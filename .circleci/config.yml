# ============================================================
# WORKFLOWS  (unchanged from original)
# ============================================================
workflows:
  version: 2

  scheduled-IntQa-deploy:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ BRInt, << pipeline.git.branch >> ]
        - equal: [ deploy, << pipeline.parameters.action_type >> ]
    jobs:
      - intqa-full-sync:
          name: deploy-BRInt-full-sync
          context: sf-intqa
          operation: deploy
          test_level: << pipeline.parameters.test_level >>

  scheduled-StagingUat-deploy:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ BRStaging, << pipeline.git.branch >> ]
        - equal: [ deploy, << pipeline.parameters.action_type >> ]
    jobs:
      - staginguat-full-sync:
          name: deploy-BRStaging-full-sync
          context: sf-staging
          operation: deploy
          test_level: << pipeline.parameters.test_level >>

  scheduled-IntQa-validate:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ BRInt, << pipeline.git.branch >> ]
        - equal: [ validate, << pipeline.parameters.action_type >> ]
    jobs:
      - intqa-full-sync:
          name: validate-BRInt
          context: sf-intqa
          operation: validate
          test_level: << pipeline.parameters.test_level >>

  scheduled-StagingUat-validate:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ BRStaging, << pipeline.git.branch >> ]
        - equal: [ validate, << pipeline.parameters.action_type >> ]
    jobs:
      - staginguat-full-sync:
          name: validate-BRStaging
          context: sf-staging
          operation: validate
          test_level: << pipeline.parameters.test_level >>

  scheduled-Prod-validate:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ main, << pipeline.git.branch >> ]
        - equal: [ validate, << pipeline.parameters.action_type >> ]
    jobs:
      - prod-full-sync:
          name: validate-main
          context: sf-prod
          operation: validate

  Auto-IntQa-Deploy:
    when:
      and:
        - equal: [ webhook, << pipeline.trigger_source >> ]
        - equal: [ BRInt, << pipeline.git.branch >> ]
    jobs:
      - auto-deploy-intqa:
          name: auto-deploy-BRInt
          context: sf-intqa
          tag_prefix: "INTQA-"
          operation: deploy
          create_tags: true

  Auto-StagingUat-Deploy:
    when:
      and:
        - equal: [ webhook, << pipeline.trigger_source >> ]
        - equal: [ BRStaging, << pipeline.git.branch >> ]
    jobs:
      - auto-deploy-staging:
          name: auto-deploy-BRStaging
          context: sf-staging
          tag_prefix: "STAGINGUAT-"
          operation: deploy
          create_tags: true

  Manual-IntQa-Deploy:
    when:
      and:
        - equal: [ api, << pipeline.trigger_source >> ]
        - equal: [ BRInt, << pipeline.git.branch >> ]
        - equal: [ deploy, << pipeline.parameters.action_type >> ]
    jobs:
      - intqa-full-sync:
          name: deploy-BRInt-full-sync
          context: sf-intqa
          operation: deploy
          test_level: << pipeline.parameters.test_level >>

  Manual-IntQa-Validate:
    when:
      and:
        - equal: [ api, << pipeline.trigger_source >> ]
        - equal: [ BRInt, << pipeline.git.branch >> ]
        - equal: [ validate, << pipeline.parameters.action_type >> ]
    jobs:
      - intqa-full-sync:
          name: validate-BRInt
          context: sf-intqa
          operation: validate
          test_level: << pipeline.parameters.test_level >>

  Manual-StagingUat-Deploy:
    when:
      and:
        - equal: [ api, << pipeline.trigger_source >> ]
        - equal: [ BRStaging, << pipeline.git.branch >> ]
        - equal: [ deploy, << pipeline.parameters.action_type >> ]
    jobs:
      - staginguat-full-sync:
          name: deploy-BRStaging-full-sync
          context: sf-staging
          operation: deploy
          test_level: << pipeline.parameters.test_level >>

  Manual-StagingUat-Validate:
    when:
      and:
        - equal: [ api, << pipeline.trigger_source >> ]
        - equal: [ BRStaging, << pipeline.git.branch >> ]
        - equal: [ validate, << pipeline.parameters.action_type >> ]
    jobs:
      - staginguat-full-sync:
          name: validate-BRStaging
          context: sf-staging
          operation: validate
          test_level: << pipeline.parameters.test_level >>

  Manual-Prod-Deploy:
    when:
      and:
        - equal: [ api, << pipeline.trigger_source >> ]
        - equal: [ main, << pipeline.git.branch >> ]
        - equal: [ deploy, << pipeline.parameters.action_type >> ]
    jobs:
      - prod-full-sync:
          name: deploy-main-full-sync
          context: sf-prod
          operation: deploy

  Manual-Prod-Validate:
    when:
      and:
        - equal: [ api, << pipeline.trigger_source >> ]
        - equal: [ main, << pipeline.git.branch >> ]
        - equal: [ validate, << pipeline.parameters.action_type >> ]
    jobs:
      - prod-full-sync:
          name: validate-main
          context: sf-prod
          operation: validate
