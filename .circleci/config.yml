version: 2.1

orbs:
  node: circleci/node@5.0.2
  slack: circleci/slack@4.12.5

# ============================================================
# PIPELINE PARAMETERS
# ============================================================
parameters:
  action_type:
    type: enum
    enum:
      - validate
      - deploy
    default: validate
  test_level:
    type: enum
    enum:
      - RunLocalTests
      - RunAllTestsInOrg
      - NoTestRun
      - RunSpecifiedTests
    default: RunLocalTests

# ============================================================
# COMMANDS
# ============================================================
commands:
  # ----------------------------------------------------------
  # Install Tooling: Node + SF CLI
  # ----------------------------------------------------------
  install-tooling:
    steps:
      - node/install:
          node-version: "20"
      - run:
          name: Install SF CLI
          command: |
            npm install -g @salesforce/cli
            sf --version

  # ----------------------------------------------------------
  # JWT AUTH
  # ----------------------------------------------------------
  jwt-auth:
    parameters:
      target_env:
        type: string
    steps:
      - run:
          name: Decode JWT key for << parameters.target_env >>
          command: |
            echo "${JWT_KEY_<< parameters.target_env >>}" | base64 -d > server.key 2>/dev/null \
              || echo "${JWT_KEY_<< parameters.target_env >>}" > server.key
            chmod 600 server.key
      - run:
          name: Authenticate to Salesforce (<< parameters.target_env >>)
          command: |
            sf org login jwt \
              --username "${SF_USERNAME_<< parameters.target_env >>}" \
              --jwt-key-file server.key \
              --client-id "${SF_CONSUMER_KEY_<< parameters.target_env >>}" \
              --instance-url "${SF_INSTANCEURL_<< parameters.target_env >>}" \
              --alias target \
              --set-default

  # ----------------------------------------------------------
  # GIT BLAME NOTIFY
  # Runs only on failure (when: on_fail in each job).
  # Reads /tmp/deploy_failures.json written by Poll step,
  # resolves each failed component to a file path, runs
  # git log to find the last author, looks up their Slack
  # user ID via users.lookupByEmail, then posts a rich
  # Slack message tagging each owner.
  #
  # Required in CircleCI context:
  #   SLACK_BOT_TOKEN   - Bot token with users:read.email + chat:write
  #   SLACK_DEFAULT_CHANNEL - Channel ID to post blame report to
  # ----------------------------------------------------------
  git-blame-notify:
    steps:
      - run:
          name: "🔍 Git Blame — Tag Failed Component Owners in Slack"
          when: on_fail
          command: |
            # ── Prerequisites ─────────────────────────────────────────
            if [ -z "${SLACK_BOT_TOKEN:-}" ]; then
              echo "⚠️  SLACK_BOT_TOKEN not set — skipping blame notification"
              exit 0
            fi

            if [ ! -f /tmp/deploy_failures.json ]; then
              echo "⚠️  /tmp/deploy_failures.json not found"
              echo "    (Pipeline may have failed before deployment started)"
              # Still send a generic failure ping for the triggering user
              python3 - \<<'PYEOF'
            import json, os, urllib.request, urllib.parse

            token   = os.environ.get("SLACK_BOT_TOKEN", "")
            channel = os.environ.get("SLACK_DEFAULT_CHANNEL", "")
            branch  = os.environ.get("CIRCLE_BRANCH", "unknown")
            job     = os.environ.get("CIRCLE_JOB", "unknown")
            build   = os.environ.get("CIRCLE_BUILD_URL", "#")
            trigger = os.environ.get("CIRCLE_USERNAME", "unknown")

            payload = {
                "channel": channel,
                "text": f":red_circle: Pipeline failed on `{branch}` — job `{job}` (triggered by {trigger}) — no deployment data captured.",
                "blocks": [
                    {"type": "section", "text": {"type": "mrkdwn",
                     "text": f":red_circle: *Pipeline failed* on `{branch}`\nJob: `{job}` | Triggered by: *{trigger}*\n<{build}|View Build>"}},
                ]
            }
            req = urllib.request.Request(
                "https://slack.com/api/chat.postMessage",
                data=json.dumps(payload).encode(),
                headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
            )
            urllib.request.urlopen(req)
            PYEOF
              exit 0
            fi

            # ── Ensure full git history for blame ─────────────────────
            git fetch --unshallow 2>/dev/null || true
            git fetch origin 2>/dev/null || true

            # ── Resolve Salesforce component type → file path ─────────
            resolve_path() {
              local COMP_TYPE="$1"
              local COMP_NAME="$2"
              local PROJECT_DIR
              PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)

              case "$COMP_TYPE" in
                ApexClass)
                  echo "${PROJECT_DIR}/force-app/main/default/classes/${COMP_NAME}.cls" ;;
                ApexTrigger)
                  echo "${PROJECT_DIR}/force-app/main/default/triggers/${COMP_NAME}.trigger" ;;
                LightningComponentBundle)
                  echo "${PROJECT_DIR}/force-app/main/default/lwc/${COMP_NAME}/${COMP_NAME}.js" ;;
                AuraDefinitionBundle)
                  echo "${PROJECT_DIR}/force-app/main/default/aura/${COMP_NAME}/${COMP_NAME}.cmp" ;;
                Flow)
                  echo "${PROJECT_DIR}/force-app/main/default/flows/${COMP_NAME}.flow-meta.xml" ;;
                PermissionSet)
                  echo "${PROJECT_DIR}/force-app/main/default/permissionsets/${COMP_NAME}.permissionset-meta.xml" ;;
                Profile)
                  echo "${PROJECT_DIR}/force-app/main/default/profiles/${COMP_NAME}.profile-meta.xml" ;;
                CustomObject)
                  echo "${PROJECT_DIR}/force-app/main/default/objects/${COMP_NAME}/${COMP_NAME}.object-meta.xml" ;;
                CustomField)
                  # format: ObjectName.FieldName
                  OBJ=$(echo "$COMP_NAME" | cut -d'.' -f1)
                  FLD=$(echo "$COMP_NAME" | cut -d'.' -f2)
                  echo "${PROJECT_DIR}/force-app/main/default/objects/${OBJ}/fields/${FLD}.field-meta.xml" ;;
                ValidationRule)
                  OBJ=$(echo "$COMP_NAME" | cut -d'.' -f1)
                  VR=$(echo "$COMP_NAME" | cut -d'.' -f2)
                  echo "${PROJECT_DIR}/force-app/main/default/objects/${OBJ}/validationRules/${VR}.validationRule-meta.xml" ;;
                *)
                  # Fallback: search repo by filename
                  find "${PROJECT_DIR}" -type f \( \
                    -name "${COMP_NAME}.cls" \
                    -o -name "${COMP_NAME}.trigger" \
                    -o -name "${COMP_NAME}.js" \
                    -o -name "${COMP_NAME}.cmp" \
                    -o -name "${COMP_NAME}.flow-meta.xml" \
                  \) 2>/dev/null | head -1 ;;
              esac
            }

            # ── Build blame data and post Slack message ────────────────
            python3 - \<<'PYEOF'
            import json, os, subprocess, urllib.request, urllib.parse, sys

            token        = os.environ.get("SLACK_BOT_TOKEN", "")
            channel      = os.environ.get("SLACK_DEFAULT_CHANNEL", "")
            branch       = os.environ.get("CIRCLE_BRANCH", "unknown")
            job          = os.environ.get("CIRCLE_JOB", "unknown")
            build_url    = os.environ.get("CIRCLE_BUILD_URL", "#")
            trigger_user = os.environ.get("CIRCLE_USERNAME", "unknown")

            def slack_api(method, payload):
                req = urllib.request.Request(
                    f"https://slack.com/api/{method}",
                    data=json.dumps(payload).encode(),
                    headers={
                        "Authorization": f"Bearer {token}",
                        "Content-Type": "application/json"
                    }
                )
                try:
                    resp = urllib.request.urlopen(req, timeout=10)
                    return json.loads(resp.read())
                except Exception as e:
                    print(f"Slack API error ({method}): {e}")
                    return {}

            def lookup_slack_user(email):
                """Resolve git author email → Slack user ID via users.lookupByEmail."""
                url = f"https://slack.com/api/users.lookupByEmail?email={urllib.parse.quote(email)}"
                req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
                try:
                    resp = urllib.request.urlopen(req, timeout=10)
                    data = json.loads(resp.read())
                    if data.get("ok"):
                        return data["user"]["id"]
                except Exception:
                    pass
                return None

            def git_blame(filepath):
                """Return (author_email, author_name, short_hash, commit_msg, time_ago) for last commit on file."""
                if not filepath or not os.path.isfile(filepath):
                    return None, "Unknown", "?", "File not in repo", "unknown"
                try:
                    out = subprocess.check_output(
                        ["git", "log", "--follow", "-n", "1",
                         "--format=%ae|%an|%h|%s|%ar", "--", filepath],
                        stderr=subprocess.DEVNULL
                    ).decode().strip()
                    if not out:
                        return None, "Unknown", "?", "No git history", "unknown"
                    parts = out.split("|", 4)
                    return parts[0], parts[1], parts[2], parts[3], parts[4]
                except Exception:
                    return None, "Unknown", "?", "git error", "unknown"

            # ── Load failures written by Poll step ────────────────────
            with open("/tmp/deploy_failures.json") as f:
                failures_data = json.load(f)

            component_failures = failures_data.get("component_failures", [])
            test_failures      = failures_data.get("test_failures", [])
            coverage_warnings  = failures_data.get("coverage_warnings", [])

            # ── Collect blame per unique component ────────────────────
            blame_cache   = {}   # email → slack_user_id
            blame_results = []

            def get_mention(email):
                if email not in blame_cache:
                    blame_cache[email] = lookup_slack_user(email)
                uid = blame_cache[email]
                return f"<@{uid}>" if uid else f"`{email}`"

            for cf in component_failures:
                comp_type = cf.get("componentType", "Unknown")
                comp_name = cf.get("fullName",      "Unknown")
                problem   = cf.get("problem",       "Unknown error")[:200]

                # Resolve path via shell function (call bash)
                filepath = subprocess.check_output(
                    ["bash", "-c", f'source /tmp/resolve_path.sh 2>/dev/null; resolve_path "{comp_type}" "{comp_name}"'],
                    stderr=subprocess.DEVNULL
                ).decode().strip()

                email, author, commit, msg, when = git_blame(filepath or "")
                mention = get_mention(email) if email else "`unknown`"

                blame_results.append({
                    "kind": "component",
                    "type": comp_type,
                    "name": comp_name,
                    "file": filepath or "not found",
                    "problem": problem,
                    "author": author,
                    "email": email,
                    "commit": commit,
                    "commit_msg": msg,
                    "when": when,
                    "mention": mention,
                })

            for tf in test_failures:
                comp_name = tf.get("name",       "Unknown")
                method    = tf.get("methodName", "")
                problem   = tf.get("message",    "")[:200]

                filepath = subprocess.check_output(
                    ["bash", "-c", f'source /tmp/resolve_path.sh 2>/dev/null; resolve_path "ApexClass" "{comp_name}"'],
                    stderr=subprocess.DEVNULL
                ).decode().strip()

                email, author, commit, msg, when = git_blame(filepath or "")
                mention = get_mention(email) if email else "`unknown`"

                blame_results.append({
                    "kind": "test",
                    "type": "ApexClass (Test)",
                    "name": f"{comp_name}.{method}" if method else comp_name,
                    "file": filepath or "not found",
                    "problem": problem,
                    "author": author,
                    "email": email,
                    "commit": commit,
                    "commit_msg": msg,
                    "when": when,
                    "mention": mention,
                })

            # ── Collect unique owners for summary header ───────────────
            all_mentions = sorted(set(r["mention"] for r in blame_results if r["mention"] != "`unknown`"))
            owner_line   = ", ".join(all_mentions) if all_mentions else "unknown authors"

            # ── Build Slack blocks ────────────────────────────────────
            blocks = [
                {
                    "type": "header",
                    "text": {"type": "plain_text", "text": "🚨 Salesforce Deploy Failed — Blame Report", "emoji": True}
                },
                {
                    "type": "section",
                    "fields": [
                        {"type": "mrkdwn", "text": f"*Branch:*\n`{branch}`"},
                        {"type": "mrkdwn", "text": f"*Job:*\n`{job}`"},
                        {"type": "mrkdwn", "text": f"*Triggered by:*\n`{trigger_user}`"},
                        {"type": "mrkdwn", "text": f"*Owners notified:*\n{owner_line}"},
                    ]
                },
                {"type": "divider"},
            ]

            # One block per failed component
            for r in blame_results:
                emoji = "🔴" if r["kind"] == "component" else "🧪"
                blocks.append({
                    "type": "section",
                    "text": {
                        "type": "mrkdwn",
                        "text": (
                            f"{emoji} *{r['type']}* › `{r['name']}`\n"
                            f">_{r['problem']}_"
                        )
                    }
                })
                blocks.append({
                    "type": "context",
                    "elements": [
                        {"type": "mrkdwn",
                         "text": (
                             f"👤 *Owner:* {r['mention']}  |  "
                             f"📁 `{r['file']}`  |  "
                             f"🕐 {r['when']}  |  "
                             f"📝 `{r['commit']}` {r['commit_msg']}"
                         )}
                    ]
                })
                blocks.append({"type": "divider"})

            # Coverage warnings (no blame needed, just list them)
            if coverage_warnings:
                cw_text = "\n".join(
                    f"• `{w.get('name','?')}`: {w.get('message','')[:120]}"
                    for w in coverage_warnings[:5]
                )
                blocks.append({
                    "type": "section",
                    "text": {"type": "mrkdwn", "text": f"⚠️ *Code Coverage Failures*\n{cw_text}"}
                })
                blocks.append({"type": "divider"})

            # Build link button
            blocks.append({
                "type": "actions",
                "elements": [{
                    "type": "button",
                    "text": {"type": "plain_text", "text": "🔗 View Build", "emoji": True},
                    "url": build_url,
                    "style": "danger"
                }]
            })

            # ── Post to Slack channel ─────────────────────────────────
            result = slack_api("chat.postMessage", {
                "channel": channel,
                "text": f"🚨 Deploy failed on `{branch}` — {len(blame_results)} component(s). Owners: {owner_line}",
                "blocks": blocks,
                "unfurl_links": False,
            })

            if result.get("ok"):
                print(f"✅ Blame report posted to Slack (ts={result.get('ts')})")
            else:
                print(f"❌ Slack post failed: {result.get('error','unknown')}")
                sys.exit(1)

            # ── DM each unique owner directly ─────────────────────────
            seen_emails = set()
            for r in blame_results:
                if not r["email"] or r["email"] in seen_emails:
                    continue
                seen_emails.add(r["email"])

                uid = blame_cache.get(r["email"])
                if not uid:
                    print(f"  ⚠️  No Slack user found for {r['email']} — skipping DM")
                    continue

                # Open DM channel
                dm = slack_api("conversations.open", {"users": uid})
                if not dm.get("ok"):
                    print(f"  ⚠️  Could not open DM for {r['email']}")
                    continue

                dm_channel = dm["channel"]["id"]
                owned = [x for x in blame_results if x["email"] == r["email"]]
                comp_list = "\n".join(
                    f"  • `{x['name']}` ({x['type']}): _{x['problem']}_"
                    for x in owned
                )

                slack_api("chat.postMessage", {
                    "channel": dm_channel,
                    "text": (
                        f"Hey {r['author'].split()[0]}! 👋  Your recent commit(s) may have caused a pipeline failure.\n\n"
                        f"*Branch:* `{branch}` | *Job:* `{job}`\n\n"
                        f"*Components you own that failed:*\n{comp_list}\n\n"
                        f"<{build_url}|→ View the full build log>"
                    )
                })
                print(f"  ✅ DM sent to {r['author']} ({r['email']})")

            PYEOF

  # ----------------------------------------------------------
  # FULL SYNC (validate or deploy)
  # ----------------------------------------------------------
  run-full-sync:
    parameters:
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      test_level:
        type: enum
        enum: [RunLocalTests, RunAllTestsInOrg, NoTestRun, RunSpecifiedTests]
        default: RunLocalTests
    steps:
      - run:
          name: Full Manifest
          command: |
            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"
            sf project generate manifest --source-dir force-app > /dev/null

      - run:
          name: Full Sync << parameters.operation >>
          command: |
            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"

            if [ "<< parameters.operation >>" = "validate" ]; then
              sf project deploy validate \
                --manifest package.xml \
                --target-org target \
                --test-level << parameters.test_level >> \
                --wait 360
            else
              sf project deploy start \
                --manifest package.xml \
                --target-org target \
                --test-level << parameters.test_level >> \
                --wait 360
            fi

  # ----------------------------------------------------------
  # BATCH JOB
  # ----------------------------------------------------------
  run-batch-job:
    parameters:
      batch_job_name:
        type: string
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
    steps:
      - run:
          name: Run Batch Job << parameters.batch_job_name >>
          command: |
            if [ "<< parameters.operation >>" != "deploy" ]; then
              echo "Not a deploy run — skipping batch."
              exit 0
            fi

            cat > run_batch.apex \<<'APEX'
            Database.executeBatch(new Batch_Initiate_DataDictionary());
            APEX

            sf apex run \
              --target-org target \
              --file run_batch.apex

  # ----------------------------------------------------------
  # DEPLOY/VALIDATE WITH TAGS + CANCEL ACTIVE DEPLOYS
  # ----------------------------------------------------------
  deploy-with-tags:
    parameters:
      tag_prefix:
        type: string
      target_env:
        type: string
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      create_tags:
        type: boolean
        default: true
    steps:
      - run:
          name: Cancel Existing Deploys (Safe Mode)
          command: |
            echo "🔍 Checking for active deployments by 'CircleCI User'"

            ACTIVE_DEPLOYS=$(sf data query --use-tooling-api --query \
            "SELECT Id, Status, CreatedDate, NumberComponentsDeployed, NumberComponentsTotal
             FROM DeployRequest
             WHERE Status IN ('Pending','PendingValidation','InProgress')
             AND CreatedBy.Name = 'CircleCI API'
             ORDER BY CreatedDate DESC" --json)

            echo "$ACTIVE_DEPLOYS" | jq .
            DEPLOY_IDS=$(echo "$ACTIVE_DEPLOYS" | jq -r '.result.records[].Id')

            if [ -z "$DEPLOY_IDS" ] || [ "$DEPLOY_IDS" = "null" ]; then
              echo "✅ No active deployments found."
            else
              echo "⚠️ Deployments found — attempting cancel..."
              for deployId in $DEPLOY_IDS; do
                echo "⛔ Canceling: $deployId"
                sf project deploy cancel --job-id "$deployId" 2>&1 || true
              done
            fi
            true

      - run:
          name: Find Most Recent Tag
          command: |
            TAG_PREFIX="<< parameters.tag_prefix >>"
            git fetch --tags

            currentRef=0
            tags=$(git tag -l "${TAG_PREFIX}[0-9]*" | sort -V)

            if [ -n "$tags" ]; then
              for tag in $tags; do
                refNum=$(echo "$tag" | sed -E "s/${TAG_PREFIX}([0-9]+)/\1/")
                if [ "$refNum" -gt "$currentRef" ]; then
                  currentRef=$refNum
                fi
              done
            else
              echo "export FIRST_RUN=true" >> $BASH_ENV
            fi

            echo "export CURRENT_REF=$currentRef" >> $BASH_ENV

      - run:
          name: Build Manifest
          command: |
            source $BASH_ENV
            TAG_PREFIX="<< parameters.tag_prefix >>"

            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"

            git diff --diff-filter=ACMR --name-only "${TAG_PREFIX}${CURRENT_REF}" HEAD \
              | grep 'force-app/' \
              | sed -E 's#.*(force-app/.*)#\1#' > files.txt || true

            if [ -s files.txt ]; then
              cat files.txt
              mapfile -t manifest_paths < files.txt
              sf project generate manifest -p "${manifest_paths[@]}"
              echo "export CHANGES_FOUND=true" >> $BASH_ENV
            else
              echo "No changes since last tag."
              echo "export CHANGES_FOUND=false" >> $BASH_ENV
            fi

      - run:
          name: Deploy Metadata
          command: |
            source $BASH_ENV

            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"

            if [ "$CHANGES_FOUND" = "true" ]; then
              DEPLOY_TYPE="DELTA"
            else
              if [ "$FIRST_RUN" = "true" ]; then
                DEPLOY_TYPE="FULL_FIRST_RUN"
              else
                DEPLOY_TYPE="FULL_NO_TAG"
              fi
              sf project generate manifest --source-dir force-app > /dev/null
            fi

            source $BASH_ENV

            if [ "$CHANGES_FOUND" = "true" ]; then
              if [ "$APEX_CLASSES_CHANGED" = "true" ]; then
                if [ -z "$TEST_CLASSES" ]; then
                  echo "❌ ERROR: Apex classes modified but no test classes found"
                  exit 1
                fi
                test_args=""
                for test_class in $TEST_CLASSES; do
                  test_args="$test_args --tests $test_class"
                done

                DEPLOY_OUTPUT=$(sf project deploy start \
                  --manifest package.xml \
                  --target-org target \
                  --test-level RunSpecifiedTests \
                  $test_args \
                  --async 2>&1)

                echo "$DEPLOY_OUTPUT"
                DEPLOY_ID=$(echo "$DEPLOY_OUTPUT" | grep -oP 'Deploy ID: \K[A-Za-z0-9]+' | head -n 1 | tr -d '\n\r')
              else
                DEPLOY_OUTPUT=$(sf project deploy start \
                  --manifest package.xml \
                  --target-org target \
                  --test-level NoTestRun \
                  --async 2>&1)

                echo "$DEPLOY_OUTPUT"
                DEPLOY_ID=$(echo "$DEPLOY_OUTPUT" | grep -oP 'Deploy ID: \K[A-Za-z0-9]+' | head -n 1 | tr -d '\n\r')
              fi

              if [ -z "$DEPLOY_ID" ]; then
                echo "❌ ERROR: Failed to extract Deploy ID"
                exit 1
              fi

              echo "export DEPLOY_ID='$DEPLOY_ID'" >> $BASH_ENV
            fi

      # ──────────────────────────────────────────────────────
      # Poll Deployment Status
      # KEY CHANGE: on failure, writes structured JSON to
      # /tmp/deploy_failures.json for the git-blame-notify
      # command to consume.
      # ──────────────────────────────────────────────────────
      - run:
          name: Poll Deployment Status
          command: |
            source $BASH_ENV

            if [ -z "$DEPLOY_ID" ]; then
              echo "⚠️ No deployment to poll"
              exit 0
            fi

            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"

            echo "📊 Polling deployment: $DEPLOY_ID"
            TIMEOUT_SECONDS=$((120 * 60))
            POLL_INTERVAL=30
            ELAPSED=0

            while [ $ELAPSED -lt $TIMEOUT_SECONDS ]; do
              REPORT_JSON=$(sf project deploy report \
                --job-id "$DEPLOY_ID" \
                --target-org target \
                --json 2>&1)

              STATUS=$(echo "$REPORT_JSON"               | jq -r '.result.status // "Unknown"')
              DONE=$(echo "$REPORT_JSON"                 | jq -r '.result.done // false')
              SUCCESS=$(echo "$REPORT_JSON"              | jq -r '.result.success // false')
              COMPONENTS_DEPLOYED=$(echo "$REPORT_JSON"  | jq -r '.result.numberComponentsDeployed // 0')
              COMPONENTS_TOTAL=$(echo "$REPORT_JSON"     | jq -r '.result.numberComponentsTotal // 0')
              TESTS_COMPLETED=$(echo "$REPORT_JSON"      | jq -r '.result.numberTestsCompleted // 0')
              TESTS_TOTAL=$(echo "$REPORT_JSON"          | jq -r '.result.numberTestsTotal // 0')
              RUN_TESTS_ENABLED=$(echo "$REPORT_JSON"    | jq -r '.result.runTestsEnabled // false')

              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "⏱️  Elapsed: $((ELAPSED / 60)) min | Status: $STATUS"
              echo "📦 Components: $COMPONENTS_DEPLOYED / $COMPONENTS_TOTAL"
              if [ "$RUN_TESTS_ENABLED" = "true" ] && [ "$COMPONENTS_DEPLOYED" -eq "$COMPONENTS_TOTAL" ] && [ "$COMPONENTS_TOTAL" -gt 0 ]; then
                echo "🧪 Tests: $TESTS_COMPLETED / $TESTS_TOTAL"
              fi

              if [ "$DONE" = "true" ]; then
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

                if [ "$SUCCESS" = "true" ]; then
                  echo "✅ Deployment completed successfully!"
                  exit 0
                fi

                # ── FAILURE: print details and save blame input ──────
                echo "❌ Deployment failed!"
                echo ""

                COMPONENT_FAILURES=$(echo "$REPORT_JSON" | jq -r \
                  '.result.details.componentFailures[]? | "  ❌ \(.fullName) (\(.componentType)): \(.problem)"' 2>/dev/null)
                [ -n "$COMPONENT_FAILURES" ] && { echo "🔴 COMPONENT ERRORS:"; echo "$COMPONENT_FAILURES"; echo ""; }

                TEST_FAILURES=$(echo "$REPORT_JSON" | jq -r \
                  '.result.details.runTestResult.failures[]? | "  ❌ \(.name).\(.methodName): \(.message)"' 2>/dev/null)
                [ -n "$TEST_FAILURES" ] && { echo "🔴 TEST FAILURES:"; echo "$TEST_FAILURES"; echo ""; }

                COVERAGE_WARNINGS=$(echo "$REPORT_JSON" | jq -r \
                  '.result.details.runTestResult.codeCoverageWarnings[]? | "  ⚠️  \(.name): \(.message)"' 2>/dev/null)
                [ -n "$COVERAGE_WARNINGS" ] && { echo "🔴 CODE COVERAGE:"; echo "$COVERAGE_WARNINGS"; echo ""; }

                # ── Write structured failure JSON for git-blame-notify ─
                # This file is the handoff between Poll and blame steps.
                echo "$REPORT_JSON" | python3 - \<<'PYEOF'
            import json, sys

            raw = sys.stdin.read()
            try:
                report = json.loads(raw)
            except Exception:
                # If jq already processed it, just write empty
                with open("/tmp/deploy_failures.json", "w") as f:
                    json.dump({"component_failures":[],"test_failures":[],"coverage_warnings":[]}, f)
                sys.exit(0)

            result  = report.get("result", {})
            details = result.get("details", {})

            output = {
                "component_failures": details.get("componentFailures", []),
                "test_failures":      details.get("runTestResult", {}).get("failures", []),
                "coverage_warnings":  details.get("runTestResult", {}).get("codeCoverageWarnings", []),
            }

            with open("/tmp/deploy_failures.json", "w") as f:
                json.dump(output, f, indent=2)

            total = len(output["component_failures"]) + len(output["test_failures"])
            print(f"📝 Saved {total} failure(s) to /tmp/deploy_failures.json")
            PYEOF

                # Write resolve_path helper so Python subprocess can call it
                cat > /tmp/resolve_path.sh \<<'BASH'
            resolve_path() {
              local COMP_TYPE="$1"
              local COMP_NAME="$2"
              local PROJECT_DIR
              PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
              case "$COMP_TYPE" in
                ApexClass)              echo "${PROJECT_DIR}/force-app/main/default/classes/${COMP_NAME}.cls" ;;
                ApexTrigger)            echo "${PROJECT_DIR}/force-app/main/default/triggers/${COMP_NAME}.trigger" ;;
                LightningComponentBundle) echo "${PROJECT_DIR}/force-app/main/default/lwc/${COMP_NAME}/${COMP_NAME}.js" ;;
                AuraDefinitionBundle)   echo "${PROJECT_DIR}/force-app/main/default/aura/${COMP_NAME}/${COMP_NAME}.cmp" ;;
                Flow)                   echo "${PROJECT_DIR}/force-app/main/default/flows/${COMP_NAME}.flow-meta.xml" ;;
                PermissionSet)          echo "${PROJECT_DIR}/force-app/main/default/permissionsets/${COMP_NAME}.permissionset-meta.xml" ;;
                Profile)                echo "${PROJECT_DIR}/force-app/main/default/profiles/${COMP_NAME}.profile-meta.xml" ;;
                CustomObject)           echo "${PROJECT_DIR}/force-app/main/default/objects/${COMP_NAME}/${COMP_NAME}.object-meta.xml" ;;
                CustomField)
                  OBJ=$(echo "$COMP_NAME" | cut -d'.' -f1)
                  FLD=$(echo "$COMP_NAME" | cut -d'.' -f2)
                  echo "${PROJECT_DIR}/force-app/main/default/objects/${OBJ}/fields/${FLD}.field-meta.xml" ;;
                ValidationRule)
                  OBJ=$(echo "$COMP_NAME" | cut -d'.' -f1)
                  VR=$(echo "$COMP_NAME" | cut -d'.' -f2)
                  echo "${PROJECT_DIR}/force-app/main/default/objects/${OBJ}/validationRules/${VR}.validationRule-meta.xml" ;;
                *)
                  find "${PROJECT_DIR}" -type f \( \
                    -name "${COMP_NAME}.cls" \
                    -o -name "${COMP_NAME}.trigger" \
                    -o -name "${COMP_NAME}.js" \
                    -o -name "${COMP_NAME}.cmp" \
                    -o -name "${COMP_NAME}.flow-meta.xml" \
                  \) 2>/dev/null | head -1 ;;
              esac
            }
            BASH

                TOTAL_FAILURES=$(echo "$REPORT_JSON" | jq -r '.result.numberComponentErrors // 0')
                TOTAL_TEST_FAILURES=$(echo "$REPORT_JSON" | jq -r '.result.numberTestErrors // 0')
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                echo "📊 SUMMARY: Component Errors=$TOTAL_FAILURES | Test Failures=$TOTAL_TEST_FAILURES"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                exit 1
              fi

              sleep $POLL_INTERVAL
              ELAPSED=$((ELAPSED + POLL_INTERVAL))
            done

            echo "⏱️  Timeout after 120 minutes — last status: $STATUS"
            exit 1

      - run:
          name: Create & Push Tag
          command: |
            source $BASH_ENV
            OPERATION="<< parameters.operation >>"
            CREATE_TAGS="<< parameters.create_tags >>"
            TAG_PREFIX="<< parameters.tag_prefix >>"

            if [ "$OPERATION" = "validate" ]; then
              echo "Validation run — no tag."
              exit 0
            fi

            if [ "$CREATE_TAGS" != "true" ]; then
              echo "Tag creation disabled."
              exit 0
            fi

            if [ "$CHANGES_FOUND" = "true" ] || [ "$FIRST_RUN" = "true" ]; then
              PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
              cd "$PROJECT_DIR"
              newTag="${TAG_PREFIX}$( [ "$FIRST_RUN" = "true" ] && echo 1 || echo $((CURRENT_REF + 1)) )"
              git config user.email "circleci@cargurus.com"
              git config user.name "CircleCI"
              git tag "$newTag"
              git push origin "$newTag"
              echo "✔️ Created tag: $newTag"
            fi

# ============================================================
# JOBS
# ============================================================
jobs:
  # ----------------------------------------------------------
  # INTQA AUTO DEPLOY (webhook — PR merge to BRInt)
  # ----------------------------------------------------------
  auto-deploy-intqa:
    parameters:
      tag_prefix:
        type: string
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      create_tags:
        type: boolean
        default: true
    resource_class: large
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - install-tooling
      - jwt-auth:
          target_env: INTQA
      - deploy-with-tags:
          tag_prefix: << parameters.tag_prefix >>
          target_env: INTQA
          operation: << parameters.operation >>
          create_tags: << parameters.create_tags >>
      # ── Git blame runs first on failure, then fallback generic notify ──
      - git-blame-notify
      - slack/notify:
          event: fail
          channel: $SLACK_DEFAULT_CHANNEL
          template: basic_fail_1
      - slack/notify:
          event: pass
          channel: $SLACK_DEFAULT_CHANNEL
          template: basic_success_1

  # ----------------------------------------------------------
  # STAGINGUAT AUTO DEPLOY
  # ----------------------------------------------------------
  auto-deploy-staging:
    parameters:
      tag_prefix:
        type: string
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      create_tags:
        type: boolean
        default: true
    resource_class: large
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - install-tooling
      - jwt-auth:
          target_env: STAGINGUAT
      - deploy-with-tags:
          tag_prefix: << parameters.tag_prefix >>
          target_env: STAGINGUAT
          operation: << parameters.operation >>
          create_tags: << parameters.create_tags >>
      - git-blame-notify
      - slack/notify:
          event: fail
          channel: $SLACK_DEFAULT_CHANNEL
          template: basic_fail_1
      - slack/notify:
          event: pass
          channel: $SLACK_DEFAULT_CHANNEL
          template: basic_success_1

  # ----------------------------------------------------------
  # INTQA FULL SYNC
  # ----------------------------------------------------------
  intqa-full-sync:
    parameters:
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      test_level:
        type: enum
        enum: [RunLocalTests, RunAllTestsInOrg, NoTestRun, RunSpecifiedTests]
        default: RunLocalTests
    resource_class: large
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - install-tooling
      - jwt-auth:
          target_env: INTQA
      - run-full-sync:
          operation: << parameters.operation >>
          test_level: << parameters.test_level >>
      - run-batch-job:
          batch_job_name: Batch_Initiate_DataDictionary
          operation: << parameters.operation >>
      - git-blame-notify
      - slack/notify:
          event: fail
          channel: $SLACK_DEFAULT_CHANNEL
          template: basic_fail_1
      - slack/notify:
          event: pass
          channel: $SLACK_DEFAULT_CHANNEL
          template: basic_success_1

  # ----------------------------------------------------------
  # STAGINGUAT FULL SYNC
  # ----------------------------------------------------------
  staginguat-full-sync:
    parameters:
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      test_level:
        type: enum
        enum: [RunLocalTests, RunAllTestsInOrg, NoTestRun, RunSpecifiedTests]
        default: RunLocalTests
    resource_class: large
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - install-tooling
      - jwt-auth:
          target_env: STAGINGUAT
      - run-full-sync:
          operation: << parameters.operation >>
          test_level: << parameters.test_level >>
      - git-blame-notify
      - slack/notify:
          event: fail
          channel: $SLACK_DEFAULT_CHANNEL
          template: basic_fail_1
      - slack/notify:
          event: pass
          channel: $SLACK_DEFAULT_CHANNEL
          template: basic_success_1

  # ----------------------------------------------------------
  # PRODUCTION FULL SYNC
  # ----------------------------------------------------------
  prod-full-sync:
    parameters:
      operation:
        type: enum
        enum: [deploy, validate]
        default: validate
    resource_class: large
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - install-tooling
      - jwt-auth:
          target_env: PROD
      - run-full-sync:
          operation: << parameters.operation >>
      - run-batch-job:
          batch_job_name: Batch_Initiate_DataDictionary
          operation: << parameters.operation >>
      - git-blame-notify
      - slack/notify:
          event: fail
          channel: $SLACK_DEFAULT_CHANNEL
          template: basic_fail_1
      - slack/notify:
          event: pass
          channel: $SLACK_DEFAULT_CHANNEL
          template: basic_success_1

# ============================================================
# WORKFLOWS  (unchanged from original)
# ============================================================
workflows:
  version: 2

  scheduled-IntQa-deploy:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ BRInt, << pipeline.git.branch >> ]
        - equal: [ deploy, << pipeline.parameters.action_type >> ]
    jobs:
      - intqa-full-sync:
          name: deploy-BRInt-full-sync
          context: sf-intqa
          operation: deploy
          test_level: << pipeline.parameters.test_level >>

  scheduled-StagingUat-deploy:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ BRStaging, << pipeline.git.branch >> ]
        - equal: [ deploy, << pipeline.parameters.action_type >> ]
    jobs:
      - staginguat-full-sync:
          name: deploy-BRStaging-full-sync
          context: sf-staging
          operation: deploy
          test_level: << pipeline.parameters.test_level >>

  scheduled-IntQa-validate:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ BRInt, << pipeline.git.branch >> ]
        - equal: [ validate, << pipeline.parameters.action_type >> ]
    jobs:
      - intqa-full-sync:
