version: 2.1

orbs:
  node: circleci/node@5.0.2
  slack: circleci/slack@4.12.5

# ============================================================
# PIPELINE PARAMETERS
# ============================================================
parameters:
  action_type:
    type: enum
    enum:
      - validate
      - deploy
    default: validate
  test_level:
    type: enum
    enum:
      - RunLocalTests
      - RunAllTestsInOrg
      - NoTestRun
      - RunSpecifiedTests
    default: RunLocalTests

# ============================================================
# COMMANDS
# ============================================================
commands:
  # ----------------------------------------------------------
  # Install Tooling: Node + SF CLI
  # ----------------------------------------------------------
  install-tooling:
    steps:
      - node/install:
          node-version: "20"
      - run:
          name: Install SF CLI
          command: |
            npm install -g @salesforce/cli
            sf --version

  # ----------------------------------------------------------
  # JWT AUTH
  # ----------------------------------------------------------
  jwt-auth:
    parameters:
      target_env:
        type: string
    steps:
      - run:
          name: Decode JWT key for << parameters.target_env >>
          command: |
            echo "${JWT_KEY_<< parameters.target_env >>}" | base64 -d > server.key 2>/dev/null \
              || echo "${JWT_KEY_<< parameters.target_env >>}" > server.key
            chmod 600 server.key
      - run:
          name: Authenticate to Salesforce (<< parameters.target_env >>)
          command: |
            sf org login jwt \
              --username "${SF_USERNAME_<< parameters.target_env >>}" \
              --jwt-key-file server.key \
              --client-id "${SF_CONSUMER_KEY_<< parameters.target_env >>}" \
              --instance-url "${SF_INSTANCEURL_<< parameters.target_env >>}" \
              --alias target \
              --set-default

  # ----------------------------------------------------------
  # GIT BLAME COLLECT
  # Runs when: on_fail. Reads /tmp/deploy_failures.json,
  # runs git log on each failed component to find the last
  # author (name + email + commit), then writes BLAME_TEXT
  # to $BASH_ENV so the existing slack/notify custom template
  # can include it — no Slack API calls, no second message.
  # ----------------------------------------------------------
  git-blame-notify:
    steps:
      - run:
          name: "🔍 Git Blame — Collect Failed Component Owners"
          when: on_fail
          command: |
            git fetch --unshallow 2>/dev/null || true

            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)

            resolve_path() {
              local TYPE="$1" NAME="$2"
              case "$TYPE" in
                ApexClass)               echo "${PROJECT_DIR}/force-app/main/default/classes/${NAME}.cls" ;;
                ApexTrigger)             echo "${PROJECT_DIR}/force-app/main/default/triggers/${NAME}.trigger" ;;
                LightningComponentBundle) echo "${PROJECT_DIR}/force-app/main/default/lwc/${NAME}/${NAME}.js" ;;
                AuraDefinitionBundle)    echo "${PROJECT_DIR}/force-app/main/default/aura/${NAME}/${NAME}.cmp" ;;
                Flow)                    echo "${PROJECT_DIR}/force-app/main/default/flows/${NAME}.flow-meta.xml" ;;
                PermissionSet)           echo "${PROJECT_DIR}/force-app/main/default/permissionsets/${NAME}.permissionset-meta.xml" ;;
                Profile)                 echo "${PROJECT_DIR}/force-app/main/default/profiles/${NAME}.profile-meta.xml" ;;
                CustomObject)            echo "${PROJECT_DIR}/force-app/main/default/objects/${NAME}/${NAME}.object-meta.xml" ;;
                CustomField)
                  echo "${PROJECT_DIR}/force-app/main/default/objects/$(echo $NAME|cut -d. -f1)/fields/$(echo $NAME|cut -d. -f2).field-meta.xml" ;;
                ValidationRule)
                  echo "${PROJECT_DIR}/force-app/main/default/objects/$(echo $NAME|cut -d. -f1)/validationRules/$(echo $NAME|cut -d. -f2).validationRule-meta.xml" ;;
                *)
                  find "${PROJECT_DIR}" -type f \( -name "${NAME}.cls" -o -name "${NAME}.trigger" -o -name "${NAME}.js" \) 2>/dev/null | head -1 ;;
              esac
            }

            BLAME_TEXT=""

            if [ -f /tmp/deploy_failures.json ]; then
              # Process each component failure
              python3 - \<<'PYEOF'
            import json, os, subprocess

            with open("/tmp/deploy_failures.json") as f:
                data = json.load(f)

            project_dir = subprocess.check_output(
                "find . -name sfdx-project.json -exec dirname {} \; | head -1",
                shell=True, stderr=subprocess.DEVNULL
            ).decode().strip()

            TYPE_MAP = {
                "ApexClass":               lambda n: f"{project_dir}/force-app/main/default/classes/{n}.cls",
                "ApexTrigger":             lambda n: f"{project_dir}/force-app/main/default/triggers/{n}.trigger",
                "LightningComponentBundle":lambda n: f"{project_dir}/force-app/main/default/lwc/{n}/{n}.js",
                "AuraDefinitionBundle":    lambda n: f"{project_dir}/force-app/main/default/aura/{n}/{n}.cmp",
                "Flow":                    lambda n: f"{project_dir}/force-app/main/default/flows/{n}.flow-meta.xml",
                "PermissionSet":           lambda n: f"{project_dir}/force-app/main/default/permissionsets/{n}.permissionset-meta.xml",
                "Profile":                 lambda n: f"{project_dir}/force-app/main/default/profiles/{n}.profile-meta.xml",
            }

            def resolve(ctype, name):
                fn = TYPE_MAP.get(ctype)
                if fn:
                    p = fn(name)
                    if os.path.isfile(p):
                        return p
                # fallback search
                r = subprocess.run(
                    ["find", project_dir, "-type", "f",
                     "-name", f"{name}.cls", "-o", "-name", f"{name}.js",
                     "-o", "-name", f"{name}.trigger"],
                    capture_output=True, text=True
                )
                return r.stdout.strip().split("\n")[0]

            def blame(filepath):
                if not filepath or not os.path.isfile(filepath):
                    print(f"  ⚠ path not found: {filepath!r}")
                    return "unknown", "unknown", "?"
                try:
                    out = subprocess.check_output(
                        ["git", "log", "--follow", "-n", "1",
                         "--format=%an|%ae|%h", "--", filepath],
                        stderr=subprocess.DEVNULL
                    ).decode().strip()
                    print(f"  git log → {out!r}")
                    if out:
                        parts = out.split("|", 2)
                        return parts[0], parts[1], parts[2]
                except Exception as e:
                    print(f"  git error: {e}")
                return "unknown", "unknown", "?"

            lines = []
            seen  = set()

            for cf in data.get("component_failures", []):
                ctype   = cf.get("componentType", "Unknown")
                name    = cf.get("fullName",       "Unknown")
                problem = cf.get("problem",        "")[:120].replace('"', "'")
                path    = resolve(ctype, name)
                author, email, commit = blame(path)
                key = f"{name}|{author}"
                if key not in seen:
                    seen.add(key)
                    lines.append(f":red_circle: *{name}* ({ctype})\n>_{problem}_\n>Last changed by: *{author}* ({email}) — `{commit}`")
                    print(f"  → {name}: {author} <{email}> [{commit}]")

            for tf in data.get("test_failures", []):
                name    = tf.get("name",       "Unknown")
                method  = tf.get("methodName", "")
                problem = tf.get("message",    "")[:120].replace('"', "'")
                path    = resolve("ApexClass", name)
                author, email, commit = blame(path)
                label = f"{name}.{method}" if method else name
                key   = f"{label}|{author}"
                if key not in seen:
                    seen.add(key)
                    lines.append(f":test_tube: *{label}* (Test)\n>_{problem}_\n>Last changed by: *{author}* ({email}) — `{commit}`")
                    print(f"  → {label}: {author} <{email}> [{commit}]")

            # Write single-line BLAME_TEXT to a temp file
            # (newlines encoded as \n so it can live in BASH_ENV)
            text = "\\n\\n".join(lines) if lines else "No component details found."
            with open("/tmp/blame_text.txt", "w") as f:
                f.write(text)
            print(f"\n✅ Wrote {len(lines)} blame entry(s) to /tmp/blame_text.txt")
            PYEOF

              # Read back and export to BASH_ENV
              if [ -f /tmp/blame_text.txt ]; then
                BLAME_TEXT=$(cat /tmp/blame_text.txt)
              else
                BLAME_TEXT="No failure details captured."
              fi
            else
              BLAME_TEXT="Pipeline failed before deployment reached Salesforce."
            fi

            # Safely write to BASH_ENV (escape double-quotes)
            printf 'export BLAME_TEXT=%q\n' "$BLAME_TEXT" >> $BASH_ENV
            echo "✅ BLAME_TEXT written to BASH_ENV"

  # ----------------------------------------------------------
  # FULL SYNC (validate or deploy)
  # ----------------------------------------------------------
  run-full-sync:
    parameters:
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      test_level:
        type: enum
        enum: [RunLocalTests, RunAllTestsInOrg, NoTestRun, RunSpecifiedTests]
        default: RunLocalTests
    steps:
      - run:
          name: Full Manifest
          command: |
            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"
            sf project generate manifest --source-dir force-app > /dev/null

      - run:
          name: Full Sync << parameters.operation >>
          command: |
            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"

            if [ "<< parameters.operation >>" = "validate" ]; then
              sf project deploy validate \
                --manifest package.xml \
                --target-org target \
                --test-level << parameters.test_level >> \
                --wait 360
            else
              sf project deploy start \
                --manifest package.xml \
                --target-org target \
                --test-level << parameters.test_level >> \
                --wait 360
            fi

  # ----------------------------------------------------------
  # BATCH JOB
  # ----------------------------------------------------------
  run-batch-job:
    parameters:
      batch_job_name:
        type: string
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
    steps:
      - run:
          name: Run Batch Job << parameters.batch_job_name >>
          command: |
            if [ "<< parameters.operation >>" != "deploy" ]; then
              echo "Not a deploy run — skipping batch."
              exit 0
            fi

            cat > run_batch.apex \<<'APEX'
            Database.executeBatch(new Batch_Initiate_DataDictionary());
            APEX

            sf apex run \
              --target-org target \
              --file run_batch.apex

  # ----------------------------------------------------------
  # DEPLOY/VALIDATE WITH TAGS + CANCEL ACTIVE DEPLOYS
  # ----------------------------------------------------------
  deploy-with-tags:
    parameters:
      tag_prefix:
        type: string
      target_env:
        type: string
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      create_tags:
        type: boolean
        default: true
    steps:
      - run:
          name: Cancel Existing Deploys (Safe Mode)
          command: |
            echo "🔍 Checking for active deployments by 'CircleCI User'"

            ACTIVE_DEPLOYS=$(sf data query --use-tooling-api --query \
            "SELECT Id, Status, CreatedDate, NumberComponentsDeployed, NumberComponentsTotal
             FROM DeployRequest
             WHERE Status IN ('Pending','PendingValidation','InProgress')
             AND CreatedBy.Name = 'CircleCI API'
             ORDER BY CreatedDate DESC" --json)

            echo "$ACTIVE_DEPLOYS" | jq .
            DEPLOY_IDS=$(echo "$ACTIVE_DEPLOYS" | jq -r '.result.records[].Id')

            if [ -z "$DEPLOY_IDS" ] || [ "$DEPLOY_IDS" = "null" ]; then
              echo "✅ No active deployments found."
            else
              echo "⚠️ Deployments found — attempting cancel..."
              for deployId in $DEPLOY_IDS; do
                echo "⛔ Canceling: $deployId"
                sf project deploy cancel --job-id "$deployId" 2>&1 || true
              done
            fi
            true

      - run:
          name: Find Most Recent Tag
          command: |
            TAG_PREFIX="<< parameters.tag_prefix >>"
            git fetch --tags

            currentRef=0
            tags=$(git tag -l "${TAG_PREFIX}[0-9]*" | sort -V)

            if [ -n "$tags" ]; then
              for tag in $tags; do
                refNum=$(echo "$tag" | sed -E "s/${TAG_PREFIX}([0-9]+)/\1/")
                if [ "$refNum" -gt "$currentRef" ]; then
                  currentRef=$refNum
                fi
              done
            else
              echo "export FIRST_RUN=true" >> $BASH_ENV
            fi

            echo "export CURRENT_REF=$currentRef" >> $BASH_ENV

      - run:
          name: Build Manifest
          command: |
            source $BASH_ENV
            TAG_PREFIX="<< parameters.tag_prefix >>"

            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"

            git diff --diff-filter=ACMR --name-only "${TAG_PREFIX}${CURRENT_REF}" HEAD \
              | grep 'force-app/' \
              | sed -E 's#.*(force-app/.*)#\1#' > files.txt || true

            if [ -s files.txt ]; then
              cat files.txt
              mapfile -t manifest_paths < files.txt
              sf project generate manifest -p "${manifest_paths[@]}"
              echo "export CHANGES_FOUND=true" >> $BASH_ENV
            else
              echo "No changes since last tag."
              echo "export CHANGES_FOUND=false" >> $BASH_ENV
            fi

      - run:
          name: Deploy Metadata
          command: |
            source $BASH_ENV

            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"

            if [ "$CHANGES_FOUND" = "true" ]; then
              DEPLOY_TYPE="DELTA"
            else
              if [ "$FIRST_RUN" = "true" ]; then
                DEPLOY_TYPE="FULL_FIRST_RUN"
              else
                DEPLOY_TYPE="FULL_NO_TAG"
              fi
              sf project generate manifest --source-dir force-app > /dev/null
            fi

            source $BASH_ENV

            if [ "$CHANGES_FOUND" = "true" ]; then
              if [ "$APEX_CLASSES_CHANGED" = "true" ]; then
                if [ -z "$TEST_CLASSES" ]; then
                  echo "❌ ERROR: Apex classes modified but no test classes found"
                  exit 1
                fi
                test_args=""
                for test_class in $TEST_CLASSES; do
                  test_args="$test_args --tests $test_class"
                done

                DEPLOY_OUTPUT=$(sf project deploy start \
                  --manifest package.xml \
                  --target-org target \
                  --test-level RunSpecifiedTests \
                  $test_args \
                  --async 2>&1)

                echo "$DEPLOY_OUTPUT"
                DEPLOY_ID=$(echo "$DEPLOY_OUTPUT" | grep -oP 'Deploy ID: \K[A-Za-z0-9]+' | head -n 1 | tr -d '\n\r')
              else
                DEPLOY_OUTPUT=$(sf project deploy start \
                  --manifest package.xml \
                  --target-org target \
                  --test-level NoTestRun \
                  --async 2>&1)

                echo "$DEPLOY_OUTPUT"
                DEPLOY_ID=$(echo "$DEPLOY_OUTPUT" | grep -oP 'Deploy ID: \K[A-Za-z0-9]+' | head -n 1 | tr -d '\n\r')
              fi

              if [ -z "$DEPLOY_ID" ]; then
                echo "❌ ERROR: Failed to extract Deploy ID"
                exit 1
              fi

              echo "export DEPLOY_ID='$DEPLOY_ID'" >> $BASH_ENV
            fi

      # ──────────────────────────────────────────────────────
      # Poll Deployment Status
      # KEY CHANGE: on failure, writes structured JSON to
      # /tmp/deploy_failures.json for the git-blame-notify
      # command to consume.
      # ──────────────────────────────────────────────────────
      - run:
          name: Poll Deployment Status
          command: |
            source $BASH_ENV

            if [ -z "$DEPLOY_ID" ]; then
              echo "⚠️ No deployment to poll"
              exit 0
            fi

            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"

            echo "📊 Polling deployment: $DEPLOY_ID"
            TIMEOUT_SECONDS=$((120 * 60))
            POLL_INTERVAL=30
            ELAPSED=0

            while [ $ELAPSED -lt $TIMEOUT_SECONDS ]; do
              REPORT_JSON=$(sf project deploy report \
                --job-id "$DEPLOY_ID" \
                --target-org target \
                --json 2>&1)

              STATUS=$(echo "$REPORT_JSON"               | jq -r '.result.status // "Unknown"')
              DONE=$(echo "$REPORT_JSON"                 | jq -r '.result.done // false')
              SUCCESS=$(echo "$REPORT_JSON"              | jq -r '.result.success // false')
              COMPONENTS_DEPLOYED=$(echo "$REPORT_JSON"  | jq -r '.result.numberComponentsDeployed // 0')
              COMPONENTS_TOTAL=$(echo "$REPORT_JSON"     | jq -r '.result.numberComponentsTotal // 0')
              TESTS_COMPLETED=$(echo "$REPORT_JSON"      | jq -r '.result.numberTestsCompleted // 0')
              TESTS_TOTAL=$(echo "$REPORT_JSON"          | jq -r '.result.numberTestsTotal // 0')
              RUN_TESTS_ENABLED=$(echo "$REPORT_JSON"    | jq -r '.result.runTestsEnabled // false')

              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "⏱️  Elapsed: $((ELAPSED / 60)) min | Status: $STATUS"
              echo "📦 Components: $COMPONENTS_DEPLOYED / $COMPONENTS_TOTAL"
              if [ "$RUN_TESTS_ENABLED" = "true" ] && [ "$COMPONENTS_DEPLOYED" -eq "$COMPONENTS_TOTAL" ] && [ "$COMPONENTS_TOTAL" -gt 0 ]; then
                echo "🧪 Tests: $TESTS_COMPLETED / $TESTS_TOTAL"
              fi

              if [ "$DONE" = "true" ]; then
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

                if [ "$SUCCESS" = "true" ]; then
                  echo "✅ Deployment completed successfully!"
                  exit 0
                fi

                # ── FAILURE: print details and save blame input ──────
                echo "❌ Deployment failed!"
                echo ""

                COMPONENT_FAILURES=$(echo "$REPORT_JSON" | jq -r \
                  '.result.details.componentFailures[]? | "  ❌ \(.fullName) (\(.componentType)): \(.problem)"' 2>/dev/null)
                [ -n "$COMPONENT_FAILURES" ] && { echo "🔴 COMPONENT ERRORS:"; echo "$COMPONENT_FAILURES"; echo ""; }

                TEST_FAILURES=$(echo "$REPORT_JSON" | jq -r \
                  '.result.details.runTestResult.failures[]? | "  ❌ \(.name).\(.methodName): \(.message)"' 2>/dev/null)
                [ -n "$TEST_FAILURES" ] && { echo "🔴 TEST FAILURES:"; echo "$TEST_FAILURES"; echo ""; }

                COVERAGE_WARNINGS=$(echo "$REPORT_JSON" | jq -r \
                  '.result.details.runTestResult.codeCoverageWarnings[]? | "  ⚠️  \(.name): \(.message)"' 2>/dev/null)
                [ -n "$COVERAGE_WARNINGS" ] && { echo "🔴 CODE COVERAGE:"; echo "$COVERAGE_WARNINGS"; echo ""; }

                # ── Write structured failure JSON for git-blame-notify ─
                # Save REPORT_JSON to a file first — you cannot pipe to
                # stdin AND use a heredoc for the script simultaneously.
                echo "$REPORT_JSON" > /tmp/report_raw.json

                python3 \<<'PYEOF'
            import json, os

            try:
                with open("/tmp/report_raw.json") as f:
                    report = json.load(f)
            except Exception as e:
                print(f"❌ Could not parse /tmp/report_raw.json: {e}")
                with open("/tmp/deploy_failures.json", "w") as f:
                    json.dump({"component_failures":[],"test_failures":[],"coverage_warnings":[]}, f)
                raise SystemExit(0)

            result  = report.get("result", {})
            details = result.get("details", {})

            # componentFailures can be a dict (single) or list (multiple) — normalise both
            def to_list(val):
                if val is None:   return []
                if isinstance(val, list): return val
                if isinstance(val, dict): return [val]
                return []

            run_test = details.get("runTestResult", {}) or {}

            output = {
                "component_failures": to_list(details.get("componentFailures")),
                "test_failures":      to_list(run_test.get("failures")),
                "coverage_warnings":  to_list(run_test.get("codeCoverageWarnings")),
            }

            with open("/tmp/deploy_failures.json", "w") as f:
                json.dump(output, f, indent=2)

            total = len(output["component_failures"]) + len(output["test_failures"])
            print(f"📝 Saved {total} failure(s) to /tmp/deploy_failures.json")
            print(f"   component_failures : {len(output['component_failures'])}")
            print(f"   test_failures      : {len(output['test_failures'])}")
            print(f"   coverage_warnings  : {len(output['coverage_warnings'])}")
            PYEOF

                # Write resolve_path helper so Python subprocess can call it
                cat > /tmp/resolve_path.sh \<<'BASH'
            resolve_path() {
              local COMP_TYPE="$1"
              local COMP_NAME="$2"
              local PROJECT_DIR
              PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
              case "$COMP_TYPE" in
                ApexClass)              echo "${PROJECT_DIR}/force-app/main/default/classes/${COMP_NAME}.cls" ;;
                ApexTrigger)            echo "${PROJECT_DIR}/force-app/main/default/triggers/${COMP_NAME}.trigger" ;;
                LightningComponentBundle) echo "${PROJECT_DIR}/force-app/main/default/lwc/${COMP_NAME}/${COMP_NAME}.js" ;;
                AuraDefinitionBundle)   echo "${PROJECT_DIR}/force-app/main/default/aura/${COMP_NAME}/${COMP_NAME}.cmp" ;;
                Flow)                   echo "${PROJECT_DIR}/force-app/main/default/flows/${COMP_NAME}.flow-meta.xml" ;;
                PermissionSet)          echo "${PROJECT_DIR}/force-app/main/default/permissionsets/${COMP_NAME}.permissionset-meta.xml" ;;
                Profile)                echo "${PROJECT_DIR}/force-app/main/default/profiles/${COMP_NAME}.profile-meta.xml" ;;
                CustomObject)           echo "${PROJECT_DIR}/force-app/main/default/objects/${COMP_NAME}/${COMP_NAME}.object-meta.xml" ;;
                CustomField)
                  OBJ=$(echo "$COMP_NAME" | cut -d'.' -f1)
                  FLD=$(echo "$COMP_NAME" | cut -d'.' -f2)
                  echo "${PROJECT_DIR}/force-app/main/default/objects/${OBJ}/fields/${FLD}.field-meta.xml" ;;
                ValidationRule)
                  OBJ=$(echo "$COMP_NAME" | cut -d'.' -f1)
                  VR=$(echo "$COMP_NAME" | cut -d'.' -f2)
                  echo "${PROJECT_DIR}/force-app/main/default/objects/${OBJ}/validationRules/${VR}.validationRule-meta.xml" ;;
                *)
                  find "${PROJECT_DIR}" -type f \( \
                    -name "${COMP_NAME}.cls" \
                    -o -name "${COMP_NAME}.trigger" \
                    -o -name "${COMP_NAME}.js" \
                    -o -name "${COMP_NAME}.cmp" \
                    -o -name "${COMP_NAME}.flow-meta.xml" \
                  \) 2>/dev/null | head -1 ;;
              esac
            }
            BASH

                TOTAL_FAILURES=$(echo "$REPORT_JSON" | jq -r '.result.numberComponentErrors // 0')
                TOTAL_TEST_FAILURES=$(echo "$REPORT_JSON" | jq -r '.result.numberTestErrors // 0')
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                echo "📊 SUMMARY: Component Errors=$TOTAL_FAILURES | Test Failures=$TOTAL_TEST_FAILURES"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                exit 1
              fi

              sleep $POLL_INTERVAL
              ELAPSED=$((ELAPSED + POLL_INTERVAL))
            done

            echo "⏱️  Timeout after 120 minutes — last status: $STATUS"
            exit 1

      - run:
          name: Create & Push Tag
          command: |
            source $BASH_ENV
            OPERATION="<< parameters.operation >>"
            CREATE_TAGS="<< parameters.create_tags >>"
            TAG_PREFIX="<< parameters.tag_prefix >>"

            if [ "$OPERATION" = "validate" ]; then
              echo "Validation run — no tag."
              exit 0
            fi

            if [ "$CREATE_TAGS" != "true" ]; then
              echo "Tag creation disabled."
              exit 0
            fi

            if [ "$CHANGES_FOUND" = "true" ] || [ "$FIRST_RUN" = "true" ]; then
              PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
              cd "$PROJECT_DIR"
              newTag="${TAG_PREFIX}$( [ "$FIRST_RUN" = "true" ] && echo 1 || echo $((CURRENT_REF + 1)) )"
              git config user.email "circleci@cargurus.com"
              git config user.name "CircleCI"
              git tag "$newTag"
              git push origin "$newTag"
              echo "✔️ Created tag: $newTag"
            fi

