      - run:
          name: Create & Push Tag
          command: |
            source $BASH_ENV
            OPERATION="<< parameters.operation >>"
            CREATE_TAGS="<< parameters.create_tags >>"
            TAG_PREFIX="<< parameters.tag_prefix >>"

            if [ "$OPERATION" = "validate" ]; then
              echo "Validation run — no tag creation."
              exit 0
            fi

            if [ "$CREATE_TAGS" != "true" ]; then
              echo "Tag creation disabled (create_tags=false)."
              exit 0
            fi

            if [ "$CHANGES_FOUND" = "true" ] || [ "$FIRST_RUN" = "true" ]; then
              PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
              cd "$PROJECT_DIR"

              if [ "$FIRST_RUN" = "true" ]; then
                newTag="${TAG_PREFIX}1"
              else
                newTag="${TAG_PREFIX}$((CURRENT_REF + 1))"
              fi

              git config user.email "circleci@cargurus.com"
              git config user.name "CircleCI"
              git tag "$newTag"
              git push origin "$newTag"
              echo "✔️ Created tag: $newTag"
            else
              echo "No changes — skipping tag creation."
            fi

  # ----------------------------------------------------------
  # GIT BLAME NOTIFY
  # Runs on_fail only. Reads /tmp/deploy_failures.json (written
  # by Poll step), resolves each component to its repo file,
  # runs git log to find the last author, and exports BLAME_TEXT
  # to BASH_ENV for the slack-notify-fail custom template.
  # ----------------------------------------------------------
  git-blame-notify:
    steps:
      - run:
          name: "🔍 Git Blame — Collect Failed Component Owners"
          when: on_fail
          command: |
            git fetch --unshallow 2>/dev/null || true

            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)

            if [ ! -f /tmp/deploy_failures.json ]; then
              echo "⚠️  No failure data found — pipeline may have failed before deployment"
              printf 'export BLAME_TEXT=%q\n' "No component failure details captured." >> $BASH_ENV
              exit 0
            fi

            python3 \<<'PYEOF'
import json, os, subprocess

PROJECT_DIR = subprocess.check_output(
    "find . -name sfdx-project.json -exec dirname {} \\; | head -1",
    shell=True, stderr=subprocess.DEVNULL
).decode().strip()

TYPE_MAP = {
    "ApexClass":                lambda n: f"{PROJECT_DIR}/force-app/main/default/classes/{n}.cls",
    "ApexTrigger":              lambda n: f"{PROJECT_DIR}/force-app/main/default/triggers/{n}.trigger",
    "LightningComponentBundle": lambda n: f"{PROJECT_DIR}/force-app/main/default/lwc/{n}/{n}.js",
    "AuraDefinitionBundle":     lambda n: f"{PROJECT_DIR}/force-app/main/default/aura/{n}/{n}.cmp",
    "Flow":                     lambda n: f"{PROJECT_DIR}/force-app/main/default/flows/{n}.flow-meta.xml",
    "PermissionSet":            lambda n: f"{PROJECT_DIR}/force-app/main/default/permissionsets/{n}.permissionset-meta.xml",
    "Profile":                  lambda n: f"{PROJECT_DIR}/force-app/main/default/profiles/{n}.profile-meta.xml",
}

def resolve(ctype, name):
    fn = TYPE_MAP.get(ctype)
    if fn:
        p = fn(name)
        if os.path.isfile(p):
            return p
    # fallback: search by filename
    r = subprocess.run(
        f'find {PROJECT_DIR} -type f \\( -name "{name}.cls" -o -name "{name}.trigger" -o -name "{name}.js" \\)',
        shell=True, capture_output=True, text=True
    )
    return r.stdout.strip().split("\n")[0]

def git_log(filepath):
    """Return (author_name, display_email, short_hash) for last commit on file."""
    if not filepath or not os.path.isfile(filepath):
        return "unknown", "unknown", "?"
    try:
        out = subprocess.check_output(
            ["git", "log", "--follow", "-n", "1", "--format=%an|%ae|%h", "--", filepath],
            stderr=subprocess.DEVNULL
        ).decode().strip()
        if out:
            name, email, commit = out.split("|", 2)
            # Clean up GitHub noreply addresses → show just the username
            if "noreply.github.com" in email:
                email = email.split("+")[-1].split("@")[0]
            return name, email, commit
    except Exception:
        pass
    return "unknown", "unknown", "?"

with open("/tmp/deploy_failures.json") as f:
    data = json.load(f)

lines = []
seen  = set()

for cf in data.get("component_failures", []):
    ctype   = cf.get("componentType", "Unknown")
    name    = cf.get("fullName",      "Unknown")
    problem = cf.get("problem",       "")[:150].replace('"', "'")
    path    = resolve(ctype, name)
    author, email, commit = git_log(path)
    key = f"{name}|{commit}"
    if key not in seen:
        seen.add(key)
        lines.append(f":red_circle: *{name}* ({ctype})\n>_{problem}_\n>Last changed by: *{author}* ({email}) \u2014 `{commit}`")
        print(f"  → {name}: {author} ({email}) [{commit}]")

for tf in data.get("test_failures", []):
    name   = tf.get("name",       "Unknown")
    method = tf.get("methodName", "")
    problem = tf.get("message",   "")[:150].replace('"', "'")
    path   = resolve("ApexClass", name)
    author, email, commit = git_log(path)
    label = f"{name}.{method}" if method else name
    key   = f"{label}|{commit}"
    if key not in seen:
        seen.add(key)
        lines.append(f":test_tube: *{label}* (Test)\n>_{problem}_\n>Last changed by: *{author}* ({email}) \u2014 `{commit}`")
        print(f"  → {label}: {author} ({email}) [{commit}]")

text = "\n".join(lines) if lines else "No component details found."

# base64-encode so real newlines survive BASH_ENV export
import base64
encoded = base64.b64encode(text.encode()).decode()
with open("/tmp/blame_encoded.txt", "w") as f:
    f.write(encoded)
print(f"✅ Wrote {len(lines)} blame entry(s)")
PYEOF

            # Decode back to real newlines and export
            if [ -f /tmp/blame_encoded.txt ]; then
              BLAME_TEXT=$(cat /tmp/blame_encoded.txt | base64 --decode 2>/dev/null \
                || cat /tmp/blame_encoded.txt | base64 -d)
            else
              BLAME_TEXT="No component failure details captured."
            fi
            printf 'export BLAME_TEXT=%q\n' "$BLAME_TEXT" >> $BASH_ENV
            echo "✅ BLAME_TEXT exported to BASH_ENV"

  # ----------------------------------------------------------
  # SLACK NOTIFY — SUCCESS (reusable, called from every job)
  # ----------------------------------------------------------
  slack-notify-pass:
    steps:
      - slack/notify:
          event: pass
          channel: $SLACK_DEFAULT_CHANNEL
          custom: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": ":white_check_mark: Salesforce Deploy Succeeded", "emoji": true }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Branch:*\n`${CIRCLE_BRANCH}`" },
                    { "type": "mrkdwn", "text": "*Job:*\n`${CIRCLE_JOB}`" },
                    { "type": "mrkdwn", "text": "*Triggered by:*\n`${CIRCLE_USERNAME}`" },
                    { "type": "mrkdwn", "text": "*Project:*\n`${CIRCLE_PROJECT_REPONAME}`" }
                  ]
                },
                { "type": "divider" },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": ":link: View Build", "emoji": true },
                      "url": "${CIRCLE_BUILD_URL}",
                      "style": "primary"
                    }
                  ]
                }
              ]
            }

  # ----------------------------------------------------------
  # SLACK NOTIFY — FAILURE (reusable, called from every job)
  # Reads BLAME_TEXT exported by git-blame-notify.
  # ----------------------------------------------------------
  slack-notify-fail:
    steps:
      - slack/notify:
          event: fail
          channel: $SLACK_DEFAULT_CHANNEL
          custom: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": ":rotating_light: Salesforce Deploy Failed", "emoji": true }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Branch:*\n`${CIRCLE_BRANCH}`" },
                    { "type": "mrkdwn", "text": "*Job:*\n`${CIRCLE_JOB}`" },
                    { "type": "mrkdwn", "text": "*Triggered by:*\n`${CIRCLE_USERNAME}`" },
                    { "type": "mrkdwn", "text": "*Project:*\n`${CIRCLE_PROJECT_REPONAME}`" }
                  ]
                },
                { "type": "divider" },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*:mag: Failed Components \u0026 Owners:*\n${BLAME_TEXT}" }
                },
                { "type": "divider" },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": ":link: View Build", "emoji": true },
                      "url": "${CIRCLE_BUILD_URL}",
                      "style": "danger"
                    }
                  ]
                }
              ]
            }

# ============================================================
# JOBS
# ============================================================
jobs:
  # ----------------------------------------------------------
  # INTQA FULL SYNC - Auto Deploy with tags on PR merge to BRInt
  # ----------------------------------------------------------
  auto-deploy-intqa:
    parameters:
      tag_prefix:
        type: string
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      create_tags:
        type: boolean
        default: true
    resource_class: xlarge
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - install-tooling
      - jwt-auth:
          target_env: INTQA
      - deploy-with-tags:
          tag_prefix: << parameters.tag_prefix >>
          target_env: INTQA
          operation: << parameters.operation >>
          create_tags: << parameters.create_tags >>
      - git-blame-notify
      - slack-notify-pass
      - slack-notify-fail

  # ----------------------------------------------------------
  # STAGINGUAT FULL SYNC - Auto Deploy with tags on PR merge to BRStaging
  # ----------------------------------------------------------
  auto-deploy-staging:
    parameters:
      tag_prefix:
        type: string
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      create_tags:
        type: boolean
        default: true
    resource_class: xlarge
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - install-tooling
      - jwt-auth:
          target_env: STAGINGUAT
      - deploy-with-tags:
          tag_prefix: << parameters.tag_prefix >>
          target_env: STAGINGUAT
          operation: << parameters.operation >>
          create_tags: << parameters.create_tags >>
      - git-blame-notify
      - slack-notify-pass
      - slack-notify-fail

  # ----------------------------------------------------------
  # INTQA FULL SYNC - Validate or Deploy (Manual/API only)
  # ----------------------------------------------------------
  intqa-full-sync:
    parameters:
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      test_level:
        type: enum
        enum: [RunLocalTests, RunAllTestsInOrg, NoTestRun, RunSpecifiedTests]
        default: RunLocalTests
    resource_class: xlarge
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - install-tooling
      - jwt-auth:
          target_env: INTQA
      - run-full-sync:
          operation: << parameters.operation >>
          test_level: << parameters.test_level >>
      - run-batch-job:
          batch_job_name: Batch_Initiate_DataDictionary
          operation: << parameters.operation >>
      - git-blame-notify
      - slack-notify-pass
      - slack-notify-fail

  # ----------------------------------------------------------
  # STAGING UAT FULL SYNC - Validate or Deploy (Manual/API only)
  # ----------------------------------------------------------
  staginguat-full-sync:
    parameters:
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      test_level:
        type: enum
        enum: [RunLocalTests, RunAllTestsInOrg, NoTestRun, RunSpecifiedTests]
        default: RunLocalTests
    resource_class: xlarge
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - install-tooling
      - jwt-auth:
          target_env: STAGINGUAT
      - run-full-sync:
          operation: << parameters.operation >>
          test_level: << parameters.test_level >>
      - git-blame-notify
      - slack-notify-pass
      - slack-notify-fail

  # ----------------------------------------------------------
  # PRODUCTION FULL SYNC - Validate or Deploy (Manual/API only)
  # ----------------------------------------------------------
  prod-full-sync:
    parameters:
      operation:
        type: enum
        enum: [deploy, validate]
        default: validate
    resource_class: xlarge
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - install-tooling
      - jwt-auth:
          target_env: PROD
      - run-full-sync:
          operation: << parameters.operation >>
      - run-batch-job:
          batch_job_name: Batch_Initiate_DataDictionary
          operation: << parameters.operation >>
      - git-blame-notify
      - slack-notify-pass
      - slack-notify-fail

# ============================================================
# WORKFLOWS
# ============================================================
workflows:
  version: 2

  scheduled-IntQa-deploy:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ BRInt, << pipeline.git.branch >> ]
        - equal: [ deploy, << pipeline.parameters.action_type >> ]
    jobs:
        - intqa-full-sync:
            name: deploy-BRInt-full-sync
            context: sf-intqa
            operation: deploy
            test_level: << pipeline.parameters.test_level >>

  scheduled-StagingUat-deploy:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ BRStaging, << pipeline.git.branch >> ]
        - equal: [ deploy, << pipeline.parameters.action_type >> ]
    jobs:
        - staginguat-full-sync:
            name: deploy-BRStaging-full-sync
            context: sf-staging
            operation: deploy
            test_level: << pipeline.parameters.test_level >>

  scheduled-IntQa-validate:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ BRInt, << pipeline.git.branch >> ]
        - equal: [ validate, << pipeline.parameters.action_type >> ]
    jobs:
        - intqa-full-sync:
            name: validate-BRInt
            context: sf-intqa
            operation: validate
            test_level: << pipeline.parameters.test_level >>

  scheduled-StagingUat-validate:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ BRStaging, << pipeline.git.branch >> ]
        - equal: [ validate, << pipeline.parameters.action_type >> ]
    jobs:
        - staginguat-full-sync:
            name: validate-BRStaging
            context: sf-staging
            operation: validate
            test_level: << pipeline.parameters.test_level >>

  scheduled-Prod-validate:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ main, << pipeline.git.branch >> ]
        - equal: [ validate, << pipeline.parameters.action_type >> ]
    jobs:
        - prod-full-sync:
            name: validate-main
            context: sf-prod
            operation: validate

  Auto-IntQa-Deploy:
    when:
      and:
        - equal: [ webhook, << pipeline.trigger_source >> ]
        - equal: [ BRInt , << pipeline.git.branch >> ]
    jobs:
        - auto-deploy-intqa:
            name: auto-deploy-BRInt
            context: sf-intqa
            tag_prefix: "INTQA-"
            operation: deploy
            create_tags: true

  Auto-StagingUat-Deploy:
    when:
      and:
        - equal: [ webhook, << pipeline.trigger_source >> ]
        - equal: [ BRStaging, << pipeline.git.branch >> ]
    jobs:
        - auto-deploy-staging:
            name: auto-deploy-BRStaging
            context: sf-staging
            tag_prefix: "STAGINGUAT-"
            operation: deploy
            create_tags: true

  Manual-IntQa-Deploy:
    when:
      and:
        - equal: [ api, << pipeline.trigger_source >> ]
        - equal: [ BRInt, << pipeline.git.branch >> ]
        - equal: [ deploy, << pipeline.parameters.action_type >> ]
    jobs:
        - intqa-full-sync:
            name: deploy-BRInt-full-sync
