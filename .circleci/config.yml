version: 2.1

orbs:
  node: circleci/node@5.0.2
  slack: circleci/slack@4.12.5

# ============================================================
# PIPELINE PARAMETER (single dropdown)
# ============================================================
parameters:
  action_type:
    type: enum
    enum:
      - validate
      - deploy
    default: validate
  test_level:                          
    type: enum
    enum:
      - RunLocalTests
      - RunAllTestsInOrg
      - NoTestRun
      - RunSpecifiedTests
    default: RunLocalTests

# ============================================================
# COMMANDS
# ============================================================
commands:
  # ----------------------------------------------------------
  # Install Tooling: Node + SF CLI
  # ----------------------------------------------------------
  install-tooling:
    steps:
      - node/install:
          node-version: "22"
      - run:
          name: Install SF CLI
          command: |
            npm install -g @salesforce/cli
            sf --version

  # ----------------------------------------------------------
  # JWT AUTH COMMAND : Authenticate to Salesforce using JWT for the specified target environment
  # ----------------------------------------------------------
  jwt-auth:
    parameters:
      target_env:
        type: string
    steps:
      - run:
          name: Decode JWT key for << parameters.target_env >>
          command: |
            echo "${JWT_KEY_<< parameters.target_env >>}" | base64 -d > server.key 2>/dev/null \
              || echo "${JWT_KEY_<< parameters.target_env >>}" > server.key
            chmod 600 server.key

      - run:
          name: Authenticate to Salesforce (<< parameters.target_env >>)
          command: |
            sf org login jwt \
              --username "${SF_USERNAME_<< parameters.target_env >>}" \
              --jwt-key-file server.key \
              --client-id "${SF_CONSUMER_KEY_<< parameters.target_env >>}" \
              --instance-url "${SF_INSTANCEURL_<< parameters.target_env >>}" \
              --alias target \
              --set-default

  # ----------------------------------------------------------
  # DEPLOY/VALIDATE FULL-SYNC MANIFEST
  # run_all_tests is read directly from pipeline.parameters — no job/command param needed
  # ----------------------------------------------------------
  run-full-sync:
      parameters:
        operation:
          type: enum
          enum: [deploy, validate]
          default: deploy
        test_level:                     
          type: enum
          enum: [RunLocalTests, RunAllTestsInOrg, NoTestRun, RunSpecifiedTests]
          default: RunLocalTests
      steps:
        - run:
            name: Full Manifest
            command: |
              PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
              cd "$PROJECT_DIR"
              sf project generate manifest --source-dir force-app > /dev/null

        - run:
            name: Full Sync << parameters.operation >>
            command: |
              PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
              cd "$PROJECT_DIR"

              if [ "<< parameters.operation >>" = "validate" ]; then
                sf project deploy validate \
                  --manifest package.xml \
                  --target-org target \
                  --test-level << parameters.test_level >> \
                  --wait 360
              else
                sf project deploy start \
                  --manifest package.xml \
                  --target-org target \
                  --test-level << parameters.test_level >> \
                  --wait 360
              fi

  
  # ----------------------------------------------------------
  # RUN BATCH JOB ( Pass in batch_job_name and operation (deploy or validate) ) 
  # - Only runs if operation=deploy (skips if validate)
  # ----------------------------------------------------------
  run-batch-job:
    parameters:
      batch_job_name:
        type: string
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
    steps:
      - run:
          name: Run Batch Job << parameters.batch_job_name >>
          command: |
            if [ "<< parameters.operation >>" != "deploy" ]; then
              echo "Not a deploy run (operation=<< parameters.operation >>). Skipping batch."
              exit 0
            fi

            echo "🚀 Running << parameters.batch_job_name >> in PROD..."

            cat > run_batch.apex \<<'APEX'
            Database.executeBatch(new Batch_Initiate_DataDictionary());
            APEX

            sf apex run \
              --target-org target \
              --file run_batch.apex
  # ----------------------------------------------------------
  # DEPLOY/VALIDATE WITH TAGS + CANCEL ACTIVE DEPLOYS
  # operation: deploy | validate
  # create_tags: true|false (tags only for deploy)
  # ----------------------------------------------------------
  deploy-with-tags:
    parameters:
      tag_prefix:
        type: string
      target_env:
        type: string
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      create_tags:
        type: boolean
        default: true
    steps:
      - run:
          name: Cancel Existing Deploys (Safe Mode)
          command: |
            echo "🔍 Checking for active deployments by 'CircleCI User'"

            ACTIVE_DEPLOYS=$(sf data query --use-tooling-api --query \
            "SELECT Id, Status, CreatedDate, NumberComponentsDeployed, NumberComponentsTotal
             FROM DeployRequest
             WHERE Status IN ('Pending','PendingValidation','InProgress')
             AND CreatedBy.Name = 'CircleCI API'
             ORDER BY CreatedDate DESC" --json)

            echo "$ACTIVE_DEPLOYS" | jq .
            DEPLOY_IDS=$(echo "$ACTIVE_DEPLOYS" | jq -r '.result.records[].Id')

            if [ -z "$DEPLOY_IDS" ] || [ "$DEPLOY_IDS" = "null" ]; then
              echo "✅ No active deployments found."
            else
              echo "⚠️ Deployments found — attempting cancel..."
              for deployId in $DEPLOY_IDS; do
                echo "⛔ Canceling deployment: $deployId"
                CANCEL_OUTPUT=$(sf project deploy cancel --job-id "$deployId" 2>&1) || true
                echo "$CANCEL_OUTPUT"
              done
            fi
            true

      - run:
          name: Find Most Recent Tag
          command: |
            TAG_PREFIX="<< parameters.tag_prefix >>"
            echo "Using Tag Prefix: $TAG_PREFIX"
            git fetch --tags

            currentRef=0
            tags=$(git tag -l "${TAG_PREFIX}[0-9]*" | sort -V)

            if [ -n "$tags" ]; then
              echo "🔍 Tags found:"
              echo "$tags"
              for tag in $tags; do
                refNum=$(echo "$tag" | sed -E "s/${TAG_PREFIX}([0-9]+)/\1/")
                if [ "$refNum" -gt "$currentRef" ]; then
                  currentRef=$refNum
                fi
              done
              echo "Latest tag: ${TAG_PREFIX}${currentRef}"
            else
              echo "🔍 No tags found — FIRST RUN"
              currentRef=0
              echo "export FIRST_RUN=true" >> $BASH_ENV
            fi

            echo "export CURRENT_REF=$currentRef" >> $BASH_ENV
            echo "export TAG_PREFIX=${TAG_PREFIX}" >> $BASH_ENV

      - run:
          name: Build Manifest
          command: |
            source $BASH_ENV
            TAG_PREFIX="<< parameters.tag_prefix >>"

            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"

            echo "Comparing HEAD to tag: ${TAG_PREFIX}${CURRENT_REF}"

            git diff --diff-filter=ACMR --name-only "${TAG_PREFIX}${CURRENT_REF}" HEAD \
              | grep 'force-app/' \
              | sed -E 's#.*(force-app/.*)#\1#' > files.txt || true

            if [ -s files.txt ]; then
              echo "Changes detected:"
              cat files.txt
              mapfile -t manifest_paths < files.txt
              sf project generate manifest -p "${manifest_paths[@]}"
              echo "export CHANGES_FOUND=true" >> $BASH_ENV
            else
              echo "No changes since last tag - Manifest not required."
              echo "export CHANGES_FOUND=false" >> $BASH_ENV
            fi


      # --------------------------------------------------------
      # Deploy (Delta or Full)
      # --------------------------------------------------------
      - run:
          name: Deploy Metadata
          command: |
            source $BASH_ENV

            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"

            echo "FIRST_RUN=$FIRST_RUN"
            echo "CHANGES_FOUND=$CHANGES_FOUND"
            echo "OPERATION=$OPERATION"
            echo "APEX_CLASSES_CHANGED=$APEX_CLASSES_CHANGED"
            echo "TEST_CLASSES=$TEST_CLASSES"

            if [ "$CHANGES_FOUND" = "true" ]; then
              echo "🔄 DELTA deploy"
              DEPLOY_TYPE="DELTA"
            else
              if [ "$FIRST_RUN" = "true" ]; then
                echo "🚀 FIRST RUN — FULL DEPLOY + TAG CREATION"
                DEPLOY_TYPE="FULL_FIRST_RUN"
              else
                echo "⚠️ No delta — FULL DEPLOY (NO TAG CREATION)"
                DEPLOY_TYPE="FULL_NO_TAG"
              fi

              sf project generate manifest --source-dir force-app > /dev/null
            fi
            
            # Determine test level based on what changed
            source $BASH_ENV

            if [ "$CHANGES_FOUND" = "true" ]; then
              if [ "$APEX_CLASSES_CHANGED" = "true" ]; then
                # Apex classes changed - we MUST have test classes
                if [ -z "$TEST_CLASSES" ]; then
                  echo "❌ ERROR: Apex classes were modified but no test classes were found"
                  echo "⚠️ Cannot deploy Apex changes without running tests"
                  exit 1
                else
                  echo "📋 Running deployment with specified test classes..."
                  echo "Test classes: $TEST_CLASSES"
                  
                  # Build --tests flags for each test class
                  test_args=""
                  for test_class in $TEST_CLASSES; do
                    test_args="$test_args --tests $test_class"
                  done
                  
                  echo "Executing: sf project deploy start --manifest package.xml --target-org target --test-level RunSpecifiedTests$test_args --async"
                  
                  DEPLOY_OUTPUT=$(sf project deploy start \
                    --manifest package.xml \
                    --target-org target \
                    --test-level RunSpecifiedTests \
                    $test_args \
                    --async 2>&1)
                  
                  echo "$DEPLOY_OUTPUT"
                  
                  # Extract Deploy ID from output (take first match only)
                  DEPLOY_ID=$(echo "$DEPLOY_OUTPUT" | grep -oP 'Deploy ID: \K[A-Za-z0-9]+' | head -n 1 | tr -d '\n\r')
                  
                  if [ -z "$DEPLOY_ID" ]; then
                    echo "❌ ERROR: Failed to extract Deploy ID from output"
                    exit 1
                  fi
                  
                  echo "📝 Deploy ID: $DEPLOY_ID"
                  echo "export DEPLOY_ID='$DEPLOY_ID'" >> $BASH_ENV
                fi
              else
                # No Apex classes changed - only metadata/config changes
                echo "ℹ️ No Apex classes changed - deploying with NoTestRun"
                echo "Executing: sf project deploy start --manifest package.xml --target-org target --test-level NoTestRun --async"
                
                DEPLOY_OUTPUT=$(sf project deploy start \
                  --manifest package.xml \
                  --target-org target \
                  --test-level NoTestRun \
                  --async 2>&1)
                
                echo "$DEPLOY_OUTPUT"
                
                # Extract Deploy ID from output (take first match only)
                DEPLOY_ID=$(echo "$DEPLOY_OUTPUT" | grep -oP 'Deploy ID: \K[A-Za-z0-9]+' | head -n 1 | tr -d '\n\r')
                
                if [ -z "$DEPLOY_ID" ]; then
                  echo "❌ ERROR: Failed to extract Deploy ID from output"
                  exit 1
                fi
                
                echo "📝 Deploy ID: $DEPLOY_ID"
                echo "export DEPLOY_ID='$DEPLOY_ID'" >> $BASH_ENV
              fi
            fi

      # --------------------------------------------------------
      # Poll Deployment Status
      # --------------------------------------------------------
      - run:
          name: Poll Deployment Status
          command: |
            source $BASH_ENV
            
            if [ -z "$DEPLOY_ID" ]; then
              echo "⚠️ No deployment to poll (DEPLOY_ID not set)"
              exit 0
            fi
            
            # Change to project directory
            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            if [ -z "$PROJECT_DIR" ]; then
              echo "❌ ERROR: Could not find sfdx-project.json"
              exit 1
            fi
            cd "$PROJECT_DIR"
            
            echo "📊 Polling deployment: $DEPLOY_ID"
            echo "⏱️  Timeout: 120 minutes"
            echo ""
            
            TIMEOUT_MINUTES=120
            TIMEOUT_SECONDS=$((TIMEOUT_MINUTES * 60))
            POLL_INTERVAL=30
            ELAPSED=0
            
            while [ $ELAPSED -lt $TIMEOUT_SECONDS ]; do
              # Get deployment status
              REPORT_JSON=$(sf project deploy report --job-id "$DEPLOY_ID" --target-org target --json 2>&1)
              
              if [ $? -ne 0 ]; then
                echo "❌ Error getting deployment status:"
                echo "$REPORT_JSON"
                exit 1
              fi
              
              # Parse key fields
              STATUS=$(echo "$REPORT_JSON" | jq -r '.result.status // "Unknown"')
              DONE=$(echo "$REPORT_JSON" | jq -r '.result.done // false')
              SUCCESS=$(echo "$REPORT_JSON" | jq -r '.result.success // false')
              COMPONENTS_DEPLOYED=$(echo "$REPORT_JSON" | jq -r '.result.numberComponentsDeployed // 0')
              COMPONENTS_TOTAL=$(echo "$REPORT_JSON" | jq -r '.result.numberComponentsTotal // 0')
              TESTS_COMPLETED=$(echo "$REPORT_JSON" | jq -r '.result.numberTestsCompleted // 0')
              TESTS_TOTAL=$(echo "$REPORT_JSON" | jq -r '.result.numberTestsTotal // 0')
              RUN_TESTS_ENABLED=$(echo "$REPORT_JSON" | jq -r '.result.runTestsEnabled // false')
              
              # Display current status
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "⏱️  Elapsed: $((ELAPSED / 60)) min | Status: $STATUS"
              echo "📦 Components: $COMPONENTS_DEPLOYED / $COMPONENTS_TOTAL"
              
              # Show test progress if tests are running
              if [ "$RUN_TESTS_ENABLED" = "true" ] && [ $COMPONENTS_DEPLOYED -eq $COMPONENTS_TOTAL ] && [ $COMPONENTS_TOTAL -gt 0 ]; then
                echo "🧪 Tests: $TESTS_COMPLETED / $TESTS_TOTAL"
              fi
              
              # Check if deployment is complete
              if [ "$DONE" = "true" ]; then
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                
                if [ "$SUCCESS" = "true" ]; then
                  echo "✅ Deployment completed successfully!"
                  # Build a one-line summary for the success Slack message
                  SUMMARY=":package: *Components:* ${COMPONENTS_DEPLOYED}/${COMPONENTS_TOTAL} deployed"
                  if [ "$TESTS_COMPLETED" -gt 0 ] 2>/dev/null; then
                    SUMMARY="${SUMMARY} | :test_tube: *Tests:* ${TESTS_COMPLETED}/${TESTS_TOTAL} passed"
                  fi
                  DEPLOY_SUMMARY="$SUMMARY"
                  declare -p DEPLOY_SUMMARY >> $BASH_ENV
                  exit 0
                else
                  echo "❌ Deployment failed!"
                  echo ""
                  
                  # Show component failures if any
                  COMPONENT_FAILURES=$(echo "$REPORT_JSON" | jq -r '.result.details.componentFailures[]? | "  ❌ \(.fullName) (\(.componentType)): \(.problem)"' 2>/dev/null)
                  if [ -n "$COMPONENT_FAILURES" ]; then
                    echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                    echo "🔴 COMPONENT ERRORS:"
                    echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                    echo "$COMPONENT_FAILURES"
                    echo ""
                  fi
                  
                  # Show test failures if any
                  TEST_FAILURES=$(echo "$REPORT_JSON" | jq -r '.result.details.runTestResult.failures[]? | "  ❌ \(.name).\(.methodName):\n     \(.message)\n     \(.stackTrace // "No stack trace")"' 2>/dev/null)
                  if [ -n "$TEST_FAILURES" ]; then
                    echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                    echo "🔴 TEST FAILURES:"
                    echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                    echo "$TEST_FAILURES"
                    echo ""
                  fi
                  
                  # Show code coverage failures if any
                  COVERAGE_WARNINGS=$(echo "$REPORT_JSON" | jq -r '.result.details.runTestResult.codeCoverageWarnings[]? | "  ⚠️  \(.name): \(.message)"' 2>/dev/null)
                  if [ -n "$COVERAGE_WARNINGS" ]; then
                    echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                    echo "🔴 CODE COVERAGE FAILURES:"
                    echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                    echo "$COVERAGE_WARNINGS"
                    echo ""
                  fi
                  
                  # Show summary
                  TOTAL_FAILURES=$(echo "$REPORT_JSON" | jq -r '.result.numberComponentErrors // 0')
                  TOTAL_TEST_FAILURES=$(echo "$REPORT_JSON" | jq -r '.result.numberTestErrors // 0')
                  
                  echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                  echo "📊 FAILURE SUMMARY:"
                  echo "   Component Errors: $TOTAL_FAILURES"
                  echo "   Test Failures: $TOTAL_TEST_FAILURES"
                  echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                  
                  # Save clean failure JSON for git-blame-notify to consume
                  sf project deploy report \
                    --job-id "$DEPLOY_ID" --target-org target \
                    --json > /tmp/report_raw.json 2>/dev/null || true
                  CF=$(jq '.result.details.componentFailures // []' /tmp/report_raw.json 2>/dev/null || echo '[]')
                  echo "$CF" | jq -e 'type == "object"' > /dev/null 2>&1 && CF="[$CF]"
                  TF=$(jq '(.result.details.runTestResult.failures // [])' /tmp/report_raw.json 2>/dev/null || echo '[]')
                  echo "$TF" | jq -e 'type == "object"' > /dev/null 2>&1 && TF="[$TF]"
                  jq -n --argjson cf "$CF" --argjson tf "$TF" \
                    '{"component_failures":$cf,"test_failures":$tf}' > /tmp/deploy_failures.json
                  echo "📝 Saved $(jq '.component_failures|length' /tmp/deploy_failures.json) failure(s) for git blame"
                  
                  exit 1
                fi
              fi
              
              # Wait before next poll
              sleep $POLL_INTERVAL
              ELAPSED=$((ELAPSED + POLL_INTERVAL))
            done
            
            # Timeout reached
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "⏱️  Deployment timeout reached after $TIMEOUT_MINUTES minutes"
            echo "📊 Last known status: $STATUS"
            echo "📦 Components: $COMPONENTS_DEPLOYED / $COMPONENTS_TOTAL"
            if [ "$RUN_TESTS_ENABLED" = "true" ]; then
              echo "🧪 Tests: $TESTS_COMPLETED / $TESTS_TOTAL"
            fi
            exit 1

      - run:
          name: Create & Push Tag
          command: |
            source $BASH_ENV
            OPERATION="<< parameters.operation >>"
            CREATE_TAGS="<< parameters.create_tags >>"
            TAG_PREFIX="<< parameters.tag_prefix >>"

            if [ "$OPERATION" = "validate" ]; then
              echo "Validation run — no tag creation."
              exit 0
            fi

            if [ "$CREATE_TAGS" != "true" ]; then
              echo "Tag creation disabled (create_tags=false)."
              exit 0
            fi

            if [ "$CHANGES_FOUND" = "true" ] || [ "$FIRST_RUN" = "true" ]; then
              PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
              cd "$PROJECT_DIR"

              if [ "$FIRST_RUN" = "true" ]; then
                newTag="${TAG_PREFIX}1"
              else
                newTag="${TAG_PREFIX}$((CURRENT_REF + 1))"
              fi

              git config user.email "circleci@cargurus.com"
              git config user.name "CircleCI"
              git tag "$newTag"
              git push origin "$newTag"
              echo "✔️ Created tag: $newTag"
            else
              echo "No changes — skipping tag creation."
            fi

  # ----------------------------------------------------------
  # GIT BLAME NOTIFY
  # Runs on_fail. Reads /tmp/deploy_failures.json, resolves
  # each component to its repo path, runs git log to find the
  # last author, checks whether the file was in this deploy's
  # changeset, then builds and posts a structured Slack payload
  # via curl using SLACK_ACCESS_TOKEN.
  #
  # Format per component (3 lines):
  #   🔴 Component Name: <name>  Component Type: <type>
  #      Component Last Modified 👤 <author>  <email>  
  #      Error: <error message>
  # ----------------------------------------------------------
  git-blame-notify:
    steps:
      - run:
          name: "🔍 Git Blame — Build Slack Failure Payload"
          when: on_fail
          command: |
            git fetch --unshallow 2>/dev/null || true
            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)

            BLOCKS_FILE="/tmp/blame_blocks.json"
            PAYLOAD_FILE="/tmp/slack_failure_payload.json"

            # Determine which files were in this deployment's changeset.
            # Components NOT in changeset → a dependency changed; not necessarily their fault.
            source $BASH_ENV 2>/dev/null || true
            DEPLOY_CHANGED_FILES=""
            if [ -n "${CURRENT_REF:-}" ] && [ -n "${TAG_PREFIX:-}" ]; then
              DEPLOY_CHANGED_FILES=$(git diff --diff-filter=ACMR --name-only \
                "${TAG_PREFIX}${CURRENT_REF}" HEAD 2>/dev/null | grep 'force-app/' || true)
              echo "📋 Files in changeset: $(echo "$DEPLOY_CHANGED_FILES" | grep -c . || echo 0)"
            else
              echo "⚠️  TAG_PREFIX/CURRENT_REF not set — changeset check skipped"
            fi

            in_changeset() {
              local FP="$1"
              [ -z "$FP" ] && return 1
              [ -z "$DEPLOY_CHANGED_FILES" ] && return 1
              echo "$DEPLOY_CHANGED_FILES" | grep -qF "$FP"
            }

            resolve_path() {
              local TYPE="$1" NAME="$2" OBJ FLD
              case "$TYPE" in
                ApexClass)                echo "${PROJECT_DIR}/force-app/main/default/classes/${NAME}.cls" ;;
                ApexTrigger)              echo "${PROJECT_DIR}/force-app/main/default/triggers/${NAME}.trigger" ;;
                LightningComponentBundle) echo "${PROJECT_DIR}/force-app/main/default/lwc/${NAME}/${NAME}.js" ;;
                AuraDefinitionBundle)     echo "${PROJECT_DIR}/force-app/main/default/aura/${NAME}/${NAME}.cmp" ;;
                Flow)                     echo "${PROJECT_DIR}/force-app/main/default/flows/${NAME}.flow-meta.xml" ;;
                PermissionSet)            echo "${PROJECT_DIR}/force-app/main/default/permissionsets/${NAME}.permissionset-meta.xml" ;;
                Profile)                  echo "${PROJECT_DIR}/force-app/main/default/profiles/${NAME}.profile-meta.xml" ;;
                CustomObject)             echo "${PROJECT_DIR}/force-app/main/default/objects/${NAME}/${NAME}.object-meta.xml" ;;
                CustomField)
                  OBJ=$(echo "$NAME" | cut -d'.' -f1); FLD=$(echo "$NAME" | cut -d'.' -f2)
                  echo "${PROJECT_DIR}/force-app/main/default/objects/${OBJ}/fields/${FLD}.field-meta.xml" ;;
                ValidationRule)
                  OBJ=$(echo "$NAME" | cut -d'.' -f1); FLD=$(echo "$NAME" | cut -d'.' -f2)
                  echo "${PROJECT_DIR}/force-app/main/default/objects/${OBJ}/validationRules/${FLD}.validationRule-meta.xml" ;;
                *)
                  find "${PROJECT_DIR}" -type f \( \
                    -name "${NAME}.cls" -o -name "${NAME}.trigger" -o -name "${NAME}.js" \
                  \) 2>/dev/null | head -1 ;;
              esac
            }

            run_git_blame() {
              local FILEPATH="$1"
              [ ! -f "$FILEPATH" ] && { echo "unknown|unknown|?"; return; }
              local OUT
              OUT=$(git log --follow -n 1 --format="%an|%ae|%h" -- "$FILEPATH" 2>/dev/null)
              if [ -n "$OUT" ]; then
                local EMAIL
                EMAIL=$(echo "$OUT" | cut -d'|' -f2)
                if echo "$EMAIL" | grep -q "noreply.github.com"; then
                  EMAIL=$(echo "$EMAIL" | sed 's/.*+//' | sed 's/@.*//')
                fi
                echo "$(echo "$OUT" | cut -d'|' -f1)|${EMAIL}|$(echo "$OUT" | cut -d'|' -f3)"
              else
                echo "unknown|unknown|?"
              fi
            }

            echo '[]' > "$BLOCKS_FILE"

            # Build one section block per component in the format:
            #   Line 1: 🔴 Component Name: <name>  Component Type: <type>
            #   Line 2:    Component Last Modified 👤 <author>  <email>  
            #   Line 3:    Error: <error message>
            add_block() {
              local NAME="$1" CTYPE="$2" PROB="$3" LOCATION="$4"
              local AUTHOR="$5" EMAIL="$6" COMMIT="$7" IN_DEPLOY="$8"

              jq -n \
                --arg name     "$NAME" \
                --arg ctype    "$CTYPE" \
                --arg prob     "$PROB" \
                --arg loc      "$LOCATION" \
                --arg author   "$AUTHOR" \
                --arg email    "$EMAIL" \
                --arg commit   "$COMMIT" \
                '[
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": (
                        ":red_circle: *Component Name :* `" + $name + "`  *Component Type :* `" + $ctype + "`\n" +
                        "*Component Last Modified* :bust_in_silhouette: `" + $author + "`  " + $email + "  `" + $commit +
                        "*Error:* `" + $prob + (if $loc != "" then "  " + $loc else "" end) + "`"
                      )
                    }
                  },
                  {"type": "divider"}
                ]' > /tmp/entry.json
              jq -s '.[0] + .[1]' "$BLOCKS_FILE" /tmp/entry.json > /tmp/btmp.json \
                && mv /tmp/btmp.json "$BLOCKS_FILE"
            }

            # Resolve, blame, changeset-check and emit a block for one failure.
            # display_type is what shows in Slack; resolve_type is used for the path lookup.
            blame_and_add() {
              local NAME="$1" DISPLAY_TYPE="$2" RESOLVE_TYPE="$3" PROB="$4" LOCATION="$5"
              local FILEPATH BLAME AUTHOR EMAIL COMMIT IN_DEPLOY
              FILEPATH=$(resolve_path "$RESOLVE_TYPE" "$NAME")
              BLAME=$(run_git_blame "$FILEPATH")
              AUTHOR=$(echo "$BLAME" | cut -d'|' -f1)
              EMAIL=$(echo  "$BLAME" | cut -d'|' -f2)
              COMMIT=$(echo "$BLAME" | cut -d'|' -f3)
              IN_DEPLOY="false"; in_changeset "$FILEPATH" && IN_DEPLOY="true"
              echo "  → $NAME ($DISPLAY_TYPE): $AUTHOR [$COMMIT] [in_deploy=$IN_DEPLOY]"
              add_block "$NAME" "$DISPLAY_TYPE" "$PROB" "$LOCATION" "$AUTHOR" "$EMAIL" "$COMMIT" "$IN_DEPLOY"
            }

            UNIQUE_NAMES=""
            SHOWN=0
            MAX_SHOWN=5
            SKIPPED=0

            if [ -f /tmp/deploy_failures.json ]; then
              COMP_COUNT=$(jq '.component_failures | length' /tmp/deploy_failures.json 2>/dev/null || echo 0)
              i=0
              while [ "$i" -lt "$COMP_COUNT" ]; do
                NAME=$(jq -r ".component_failures[$i].fullName // \"Unknown\""      /tmp/deploy_failures.json)
                if echo "$UNIQUE_NAMES" | grep -qF "||${NAME}||"; then
                  i=$((i+1)); SKIPPED=$((SKIPPED+1)); continue
                fi
                if [ "$SHOWN" -ge "$MAX_SHOWN" ]; then
                  i=$((i+1)); SKIPPED=$((SKIPPED+1)); continue
                fi
                UNIQUE_NAMES="${UNIQUE_NAMES}||${NAME}||"
                CTYPE=$(jq -r ".component_failures[$i].componentType // \"Unknown\"" /tmp/deploy_failures.json)
                PROB=$(jq -r  ".component_failures[$i].problem // \"\""              /tmp/deploy_failures.json | cut -c1-150)
                LINE_NO=$(jq -r ".component_failures[$i].lineNumber // \"\""         /tmp/deploy_failures.json)
                LOCATION=""
                [ -n "$LINE_NO" ] && [ "$LINE_NO" != "null" ] && LOCATION="(line ${LINE_NO})"
                blame_and_add "$NAME" "$CTYPE" "$CTYPE" "$PROB" "$LOCATION"
                SHOWN=$((SHOWN+1)); i=$((i+1))
              done

              TEST_COUNT=$(jq '.test_failures | length' /tmp/deploy_failures.json 2>/dev/null || echo 0)
              UNIQUE_TESTS=""
              i=0
              while [ "$i" -lt "$TEST_COUNT" ]; do
                NAME=$(jq -r   ".test_failures[$i].name // \"Unknown\""   /tmp/deploy_failures.json)
                METHOD=$(jq -r ".test_failures[$i].methodName // \"\""    /tmp/deploy_failures.json)
                LABEL="$NAME"; [ -n "$METHOD" ] && LABEL="${NAME}.${METHOD}"
                if echo "$UNIQUE_TESTS" | grep -qF "||${LABEL}||"; then i=$((i+1)); continue; fi
                if [ "$SHOWN" -ge "$MAX_SHOWN" ]; then i=$((i+1)); SKIPPED=$((SKIPPED+1)); continue; fi
                UNIQUE_TESTS="${UNIQUE_TESTS}||${LABEL}||"
                PROB=$(jq -r   ".test_failures[$i].message // \"\""       /tmp/deploy_failures.json | cut -c1-150)
                STACK=$(jq -r  ".test_failures[$i].stackTrace // \"\""    /tmp/deploy_failures.json | head -1 | cut -c1-100)
                [ -n "$STACK" ] && [ "$STACK" != "null" ] && PROB="${PROB}  ${STACK}"
                blame_and_add "$LABEL" "Test" "ApexClass" "$PROB" ""
                SHOWN=$((SHOWN+1)); i=$((i+1))
              done

              if [ "$SKIPPED" -gt 0 ]; then
                jq -n --arg msg "...and ${SKIPPED} more. See the build log for full details." \
                  '[{"type":"context","elements":[{"type":"mrkdwn","text":$msg}]}]' > /tmp/entry.json
                jq -s '.[0] + .[1]' "$BLOCKS_FILE" /tmp/entry.json > /tmp/btmp.json \
                  && mv /tmp/btmp.json "$BLOCKS_FILE"
              fi

              if [ "$SHOWN" -eq 0 ]; then
                jq -n '[{"type":"section","text":{"type":"mrkdwn","text":"No component details found. Check the build log."}}]' \
                  > "$BLOCKS_FILE"
              fi
            else
              jq -n '[{"type":"section","text":{"type":"mrkdwn","text":"Pipeline failed before deployment reached Salesforce."}}]' \
                > "$BLOCKS_FILE"
            fi

            # Build payload: header + blame blocks + footer (3 separate jq calls)
            jq -n \
              --arg branch  "$CIRCLE_BRANCH" \
              --arg job     "$CIRCLE_JOB" \
              --arg user    "$CIRCLE_USERNAME" \
              --arg project "$CIRCLE_PROJECT_REPONAME" \
              '[{"type":"header","text":{"type":"plain_text","text":":rotating_light: Salesforce Deploy Failed","emoji":true}},{"type":"section","fields":[{"type":"mrkdwn","text":("*Branch:*\n`"+$branch+"`")},{"type":"mrkdwn","text":("*Job:*\n`"+$job+"`")},{"type":"mrkdwn","text":("*Triggered by:*\n`"+$user+"`")},{"type":"mrkdwn","text":("*Project:*\n`"+$project+"`")}]},{"type":"divider"},{"type":"section","text":{"type":"mrkdwn","text":"*:mag: Failed Components & Owners*"}}]' \
              > /tmp/header_blocks.json

            jq -n --arg url "$CIRCLE_BUILD_URL" \
              '[{"type":"actions","elements":[{"type":"button","text":{"type":"plain_text","text":"View Build","emoji":true},"url":$url,"style":"danger"}]}]' \
              > /tmp/footer_blocks.json

            ALL_BLOCKS=$(jq -s '.[0] + .[1] + .[2]' \
              /tmp/header_blocks.json "$BLOCKS_FILE" /tmp/footer_blocks.json)

            jq -n \
              --arg     channel "$SLACK_DEFAULT_CHANNEL" \
              --argjson blocks  "$ALL_BLOCKS" \
              '{"channel":$channel,"blocks":$blocks}' > "$PAYLOAD_FILE"

            echo "✅ Slack payload built ($(wc -c < $PAYLOAD_FILE) bytes)"

  # ----------------------------------------------------------
  # SLACK NOTIFY — SUCCESS (reusable, called from every job)
  # ----------------------------------------------------------
  slack-notify-pass:
    steps:
      - slack/notify:
          event: pass
          channel: $SLACK_DEFAULT_CHANNEL
          custom: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": ":white_check_mark: Salesforce Deploy Succeeded", "emoji": true }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Branch:*\n`${CIRCLE_BRANCH}`" },
                    { "type": "mrkdwn", "text": "*Job:*\n`${CIRCLE_JOB}`" },
                    { "type": "mrkdwn", "text": "*Triggered by:*\n`${CIRCLE_USERNAME}`" },
                    { "type": "mrkdwn", "text": "*Project:*\n`${CIRCLE_PROJECT_REPONAME}`" }
                  ]
                },
                { "type": "divider" },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*:rocket: Deploy Summary*\n${DEPLOY_SUMMARY}" }
                },
                { "type": "divider" },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": ":link: View Build", "emoji": true },
                      "url": "${CIRCLE_BUILD_URL}",
                      "style": "primary"
                    }
                  ]
                }
              ]
            }

  # ----------------------------------------------------------
  # SLACK NOTIFY — FAILURE (reusable, called from every job)
  # Posts the pre-built JSON payload from git-blame-notify 
  # via curl. Bypasses orb template interpolation entirely.
  # ----------------------------------------------------------
  slack-notify-fail:
    steps:
      - run:
          name: "Send Failure Notification to Slack"
          when: on_fail
          command: |
            if [ ! -f /tmp/slack_failure_payload.json ]; then
              echo "⚠️ No failure payload found — skipping"
              exit 0
            fi
            RESPONSE=$(curl -s -X POST \
              -H "Authorization: Bearer $SLACK_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data @/tmp/slack_failure_payload.json \
              https://slack.com/api/chat.postMessage)
            if echo "$RESPONSE" | jq -e '.ok' > /dev/null 2>&1; then
              echo "✅ Slack failure notification sent"
            else
              echo "❌ Slack error: $(echo "$RESPONSE" | jq -r '.error // "unknown"')"
              echo "$RESPONSE"
            fi

# ============================================================
# JOBS
# ============================================================
jobs:
  # ----------------------------------------------------------
  # INTQA FULL SYNC -  Auto Deploy with tags on PR merge to BRInt 
  # ----------------------------------------------------------
  auto-deploy-intqa:
    parameters:
      tag_prefix:
        type: string
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      create_tags:
        type: boolean
        default: true
    resource_class: large
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - install-tooling
      - jwt-auth:
          target_env: INTQA
      - deploy-with-tags:
          tag_prefix: << parameters.tag_prefix >>
          target_env: INTQA
          operation: << parameters.operation >>
          create_tags: << parameters.create_tags >>
      - git-blame-notify
      - slack-notify-pass
      - slack-notify-fail

  # ----------------------------------------------------------
  # STAGINGUAT FULL SYNC -  Auto Deploy with tags on PR merge to BRStaging
  # ----------------------------------------------------------
  auto-deploy-staging:
    parameters:
      tag_prefix:
        type: string
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      create_tags:
        type: boolean
        default: true
    resource_class: large
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - install-tooling
      - jwt-auth:
          target_env: STAGINGUAT
      - deploy-with-tags:
          tag_prefix: << parameters.tag_prefix >>
          target_env: STAGINGUAT
          operation: << parameters.operation >>
          create_tags: << parameters.create_tags >>
      - git-blame-notify
      - slack-notify-pass
      - slack-notify-fail

  # ----------------------------------------------------------
  # INTQA FULL SYNC - Validate or Deploy (Manual/API only - NO auto workflow)
  # ----------------------------------------------------------
  intqa-full-sync:
    parameters:
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      test_level:                  
        type: enum
        enum: [RunLocalTests, RunAllTestsInOrg, NoTestRun, RunSpecifiedTests]
        default: RunLocalTests
    resource_class: large
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - install-tooling
      - jwt-auth:
          target_env: INTQA
      - run-full-sync:
          operation: << parameters.operation >>
          test_level: << parameters.test_level >>
      - run-batch-job:
                batch_job_name: Batch_Initiate_DataDictionary
                operation: << parameters.operation >>
      - git-blame-notify
      - slack-notify-pass
      - slack-notify-fail

  # ----------------------------------------------------------
  # STAGING UAT FULL SYNC - Validate or Deploy (Manual/API only - NO auto workflow)
  # ----------------------------------------------------------
  staginguat-full-sync:
    parameters:
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      test_level:                    
        type: enum
        enum: [RunLocalTests, RunAllTestsInOrg, NoTestRun, RunSpecifiedTests]
        default: RunLocalTests
    resource_class: large
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - install-tooling
      - jwt-auth:
          target_env: STAGINGUAT
      - run-full-sync:
          operation: << parameters.operation >>
          test_level: << parameters.test_level >>  
      - git-blame-notify
      - slack-notify-pass
      - slack-notify-fail
  
  # ----------------------------------------------------------
  # PRODUCTION FULL SYNC - Validate or Deploy (Manual/API only - NO auto workflow)
  # ----------------------------------------------------------
  prod-full-sync:
    parameters:
      operation:
        type: enum
        enum: [deploy, validate]
        default: validate
    resource_class: large
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - install-tooling
      - jwt-auth:
          target_env: PROD
      - run-full-sync:
          operation: << parameters.operation >>
      - run-batch-job:
                batch_job_name: Batch_Initiate_DataDictionary
                operation: << parameters.operation >>
      - git-blame-notify
      - slack-notify-pass
      - slack-notify-fail


# ============================================================
# WORKFLOWS
# ============================================================
workflows:
  version: 2

  # ----------------------------------------------------------
  # Scheduled: Nightly Full Sync to BRInt / BRStaging
  # ----------------------------------------------------------
  scheduled-IntQa-deploy:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ BRInt, << pipeline.git.branch >> ]
        - equal: [ deploy, << pipeline.parameters.action_type >> ]
    jobs:
        - intqa-full-sync:
            name: deploy-BRInt-full-sync
            context: sf-intqa
            operation: deploy
            test_level: << pipeline.parameters.test_level >> 

  scheduled-StagingUat-deploy:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ BRStaging, << pipeline.git.branch >> ]
        - equal: [ deploy, << pipeline.parameters.action_type >> ]
    jobs:
        - staginguat-full-sync:
            name: deploy-BRStaging-full-sync
            context: sf-staging
            operation: deploy 
            test_level: << pipeline.parameters.test_level >> 


  # ----------------------------------------------------------
  # Scheduled: Nightly Full Sync to BRInt / BRStaging -> Validate
  # ----------------------------------------------------------

  scheduled-IntQa-validate:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ BRInt, << pipeline.git.branch >> ]
        - equal: [ validate, << pipeline.parameters.action_type >> ]
    jobs:
        - intqa-full-sync:
            name: validate-BRInt
            context: sf-intqa
            operation: validate
            test_level: << pipeline.parameters.test_level >> 

  scheduled-StagingUat-validate:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ BRStaging, << pipeline.git.branch >> ]
        - equal: [ validate, << pipeline.parameters.action_type >> ]

    jobs:
        - staginguat-full-sync:
            name: validate-BRStaging
            context: sf-staging
            operation: validate
            test_level: << pipeline.parameters.test_level >> 

  scheduled-Prod-validate:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ main, << pipeline.git.branch >> ]
        - equal: [ validate, << pipeline.parameters.action_type >> ]

    jobs:
        - prod-full-sync:
            name: validate-main
            context: sf-prod
            operation: validate
  # ----------------------------------------------------------
  # AUTO: PR merge to BRInt / BRStaging -> deploy + tags
  # (NO main auto workflow on merge)
  # ----------------------------------------------------------
  Auto-IntQa-Deploy:
    when:
      and:
        - equal: [ webhook, << pipeline.trigger_source >> ]
        - equal: [ BRInt , << pipeline.git.branch >> ]
    jobs:
        - auto-deploy-intqa:
            name: auto-deploy-BRInt
            context: sf-INTQA
            tag_prefix: "INTQA-"
            operation: deploy
            create_tags: true

  Auto-StagingUat-Deploy:
    when:
      and:
        - equal: [ webhook, << pipeline.trigger_source >> ]
        - equal: [ BRStaging, << pipeline.git.branch >> ]
    jobs:
        - auto-deploy-staging:
            name: auto-deploy-BRStaging
            context: sf-staging
            tag_prefix: "STAGINGUAT-"
            operation: deploy
            create_tags: true

  # ----------------------------------------------------------
  # MANUAL: BRInt deploy or validate via action_type
  # ----------------------------------------------------------
  Manual-IntQa-Deploy:
    when:
      and:
        - equal: [ api, << pipeline.trigger_source >> ]
        - equal: [ BRInt, << pipeline.git.branch >> ]
        - equal: [ deploy, << pipeline.parameters.action_type >> ]
    jobs:
        - intqa-full-sync:
            name: deploy-BRInt-full-sync
            context: sf-intqa
            operation: deploy
            test_level: << pipeline.parameters.test_level >> 
    
  Manual-IntQa-Validate:
    when:
      and:
        - equal: [ api, << pipeline.trigger_source >> ]
        - equal: [ BRInt, << pipeline.git.branch >> ]
        - equal: [ validate, << pipeline.parameters.action_type >> ]
    jobs:
        - intqa-full-sync:
            name: validate-BRInt
            context: sf-intqa
            operation: validate
            test_level: << pipeline.parameters.test_level >> 

  # ----------------------------------------------------------
  # MANUAL: BRStaging (API only) - deploy or validate via action_type
  # ----------------------------------------------------------
  Manual-StagingUat-Deploy:
    when:
      and:
        - equal: [ api, << pipeline.trigger_source >> ]
        - equal: [ BRStaging, << pipeline.git.branch >> ]
        - equal: [ deploy, << pipeline.parameters.action_type >> ]
    jobs:
        - staginguat-full-sync:
            name: deploy-BRStaging-full-sync
            context: sf-staging
            operation: deploy
            test_level: << pipeline.parameters.test_level >> 

  Manual-StagingUat-Validate:
    when:
      and:
        - equal: [ api, << pipeline.trigger_source >> ]
        - equal: [ BRStaging, << pipeline.git.branch >> ]
        - equal: [ validate, << pipeline.parameters.action_type >> ]
    jobs:
        - staginguat-full-sync:
            name: validate-BRStaging
            context: sf-staging
            operation: validate
            test_level: << pipeline.parameters.test_level >> 
  # ----------------------------------------------------------
  # MANUAL: main/prod (API only)
  # - Nothing triggers on merge to main because we have NO webhook workflow for main
  # - Run deploy or validate manually by passing action_type
  # ----------------------------------------------------------
  Manual-Prod-Deploy:
    when:
      and:
        - equal: [ api, << pipeline.trigger_source >> ]
        - equal: [ main, << pipeline.git.branch >> ]
        - equal: [ deploy, << pipeline.parameters.action_type >> ]
    jobs:
        - prod-full-sync:
            name: deploy-main-full-sync
            context: sf-prod
            operation: deploy

  Manual-Prod-Validate:
    when:
      and:
        - equal: [ api, << pipeline.trigger_source >> ]
        - equal: [ main, << pipeline.git.branch >> ]
        - equal: [ validate, << pipeline.parameters.action_type >> ]
    jobs:
        - prod-full-sync:
            name: validate-main
            context: sf-prod
            operation: validate
