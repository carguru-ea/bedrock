jobs:
  # ----------------------------------------------------------
  # INTQA AUTO DEPLOY (webhook — PR merge to BRInt)
  # ----------------------------------------------------------
  auto-deploy-intqa:
    parameters:
      tag_prefix:
        type: string
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      create_tags:
        type: boolean
        default: true
    resource_class: large
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - install-tooling
      - jwt-auth:
          target_env: INTQA
      - deploy-with-tags:
          tag_prefix: << parameters.tag_prefix >>
          target_env: INTQA
          operation: << parameters.operation >>
          create_tags: << parameters.create_tags >>
      # ── Git blame runs first on failure, then fallback generic notify ──
      - git-blame-notify
      - slack/notify:
          event: pass
          channel: $SLACK_DEFAULT_CHANNEL
          template: basic_success_1
      - slack/notify:
          event: fail
          channel: $SLACK_DEFAULT_CHANNEL
          custom: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": ":rotating_light: Salesforce Deploy Failed", "emoji": true }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Branch:*\n`${CIRCLE_BRANCH}`" },
                    { "type": "mrkdwn", "text": "*Job:*\n`${CIRCLE_JOB}`" },
