version: 2.1

orbs:
  node: circleci/node@5.0.2
  slack: circleci/slack@4.12.5

parameters:
  action_type:
    type: enum
    enum:
      - validate
      - deploy
    default: validate
  test_level:
    type: enum
    enum:
      - RunLocalTests
      - RunAllTestsInOrg
      - NoTestRun
      - RunSpecifiedTests
    default: RunLocalTests

commands:
  install-tooling:
    steps:
      - node/install:
          node-version: "20"
      - run:
          name: Install SF CLI
          command: |
            npm install -g @salesforce/cli
            sf --version

  

  jwt-auth:
    parameters:
      target_env:
        type: string
    steps:
      - run:
          name: Decode JWT key for << parameters.target_env >>
          command: |
            echo "${JWT_KEY_<< parameters.target_env >>}" | base64 -d > server.key 2>/dev/null \
              || echo "${JWT_KEY_<< parameters.target_env >>}" > server.key
            chmod 600 server.key
      - run:
          name: Authenticate to Salesforce (<< parameters.target_env >>)
          command: |
            sf org login jwt \
              --username "${SF_USERNAME_<< parameters.target_env >>}" \
              --jwt-key-file server.key \
              --client-id "${SF_CONSUMER_KEY_<< parameters.target_env >>}" \
              --instance-url "${SF_INSTANCEURL_<< parameters.target_env >>}" \
              --alias target \
              --set-default

  run-full-sync:
    parameters:
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      test_level:
        type: enum
        enum: [RunLocalTests, RunAllTestsInOrg, NoTestRun, RunSpecifiedTests]
        default: RunLocalTests
    steps:
      - run:
          name: Full Manifest
          command: |
            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"
            sf project generate manifest --source-dir force-app > /dev/null
      - run:
          name: Full Sync << parameters.operation >>
          command: |
            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"
            if [ "<< parameters.operation >>" = "validate" ]; then
              sf project deploy validate \
                --manifest package.xml \
                --target-org target \
                --test-level << parameters.test_level >> \
                --wait 360
            else
              sf project deploy start \
                --manifest package.xml \
                --target-org target \
                --test-level << parameters.test_level >> \
                --wait 360
            fi

  run-batch-job:
    parameters:
      batch_job_name:
        type: string
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
    steps:
      - run:
          name: Run Batch Job << parameters.batch_job_name >>
          command: |
            if [ "<< parameters.operation >>" != "deploy" ]; then
              echo "Not a deploy run — skipping batch."
              exit 0
            fi
            echo "🚀 Running << parameters.batch_job_name >>..."
            cat > run_batch.apex \<<'APEX'
            Database.executeBatch(new Batch_Initiate_DataDictionary());
            APEX
            sf apex run --target-org target --file run_batch.apex

  deploy-with-tags:
    parameters:
      tag_prefix:
        type: string
      target_env:
        type: string
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      create_tags:
        type: boolean
        default: true
    steps:
      - run:
          name: Cancel Existing Deploys (Safe Mode)
          command: |
            echo "🔍 Checking for active deployments..."
            ACTIVE_DEPLOYS=$(sf data query --use-tooling-api --query \
              "SELECT Id, Status, CreatedDate, NumberComponentsDeployed, NumberComponentsTotal
               FROM DeployRequest
               WHERE Status IN ('Pending','PendingValidation','InProgress')
               AND CreatedBy.Name = 'CircleCI API'
               ORDER BY CreatedDate DESC" --json)
            echo "$ACTIVE_DEPLOYS" | jq .
            DEPLOY_IDS=$(echo "$ACTIVE_DEPLOYS" | jq -r '.result.records[].Id')
            if [ -z "$DEPLOY_IDS" ] || [ "$DEPLOY_IDS" = "null" ]; then
              echo "✅ No active deployments found."
            else
              echo "⚠️ Canceling active deployments..."
              for deployId in $DEPLOY_IDS; do
                echo "⛔ Canceling: $deployId"
                sf project deploy cancel --job-id "$deployId" 2>&1 || true
              done
            fi
            true

      - run:
          name: Find Most Recent Tag
          command: |
            TAG_PREFIX="<< parameters.tag_prefix >>"
            echo "Using Tag Prefix: $TAG_PREFIX"
            git fetch --tags
            currentRef=0
            tags=$(git tag -l "${TAG_PREFIX}[0-9]*" | sort -V)
            if [ -n "$tags" ]; then
              echo "🔍 Tags found:"; echo "$tags"
              for tag in $tags; do
                refNum=$(echo "$tag" | sed -E "s/${TAG_PREFIX}([0-9]+)/\1/")
                if [ "$refNum" -gt "$currentRef" ]; then currentRef=$refNum; fi
              done
              echo "Latest tag: ${TAG_PREFIX}${currentRef}"
            else
              echo "🔍 No tags found — FIRST RUN"
              currentRef=0
              echo "export FIRST_RUN=true" >> $BASH_ENV
            fi
            echo "export CURRENT_REF=$currentRef" >> $BASH_ENV

      - run:
          name: Build Manifest
          command: |
            source $BASH_ENV
            TAG_PREFIX="<< parameters.tag_prefix >>"
            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"
            echo "Comparing HEAD to tag: ${TAG_PREFIX}${CURRENT_REF}"
            git diff --diff-filter=ACMR --name-only "${TAG_PREFIX}${CURRENT_REF}" HEAD \
              | grep 'force-app/' \
              | sed -E 's#.*(force-app/.*)#\1#' > files.txt || true
            if [ -s files.txt ]; then
              echo "Changes detected:"; cat files.txt
              mapfile -t manifest_paths < files.txt
              sf project generate manifest -p "${manifest_paths[@]}"
              echo "export CHANGES_FOUND=true" >> $BASH_ENV
            else
              echo "No changes since last tag."
              echo "export CHANGES_FOUND=false" >> $BASH_ENV
            fi

   

      - run:
          name: Deploy Metadata
          command: |
            source $BASH_ENV
            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"
            echo "FIRST_RUN=$FIRST_RUN"
            echo "CHANGES_FOUND=$CHANGES_FOUND"
            echo "APEX_CLASSES_CHANGED=$APEX_CLASSES_CHANGED"
            echo "TEST_CLASSES=$TEST_CLASSES"
            if [ "$CHANGES_FOUND" = "true" ]; then
              echo "🔄 DELTA deploy"
            else
              if [ "$FIRST_RUN" = "true" ]; then echo "🚀 FIRST RUN — FULL DEPLOY"
              else echo "⚠️ No delta — FULL DEPLOY (NO TAG CREATION)"; fi
              sf project generate manifest --source-dir force-app > /dev/null
            fi
            source $BASH_ENV
            if [ "$CHANGES_FOUND" = "true" ]; then
              if [ "$APEX_CLASSES_CHANGED" = "true" ]; then
                if [ -z "$TEST_CLASSES" ]; then
                  echo "❌ ERROR: Apex classes modified but no test classes found"; exit 1
                fi
                test_args=""
                for test_class in $TEST_CLASSES; do test_args="$test_args --tests $test_class"; done
                DEPLOY_OUTPUT=$(sf project deploy start \
                  --manifest package.xml \
                  --target-org target \
                  --test-level RunSpecifiedTests \
                  $test_args \
                  --async 2>&1)
              else
                echo "ℹ️ No Apex classes changed — deploying with NoTestRun"
                DEPLOY_OUTPUT=$(sf project deploy start \
                  --manifest package.xml \
                  --target-org target \
                  --test-level NoTestRun \
                  --async 2>&1)
              fi
              echo "$DEPLOY_OUTPUT"
              DEPLOY_ID=$(echo "$DEPLOY_OUTPUT" | grep -oP 'Deploy ID: \K[A-Za-z0-9]+' | head -n 1 | tr -d '\n\r')
              if [ -z "$DEPLOY_ID" ]; then echo "❌ ERROR: Failed to extract Deploy ID"; exit 1; fi
              echo "📝 Deploy ID: $DEPLOY_ID"
              echo "export DEPLOY_ID='$DEPLOY_ID'" >> $BASH_ENV
            fi

      - run:
          name: Poll Deployment Status
          command: |
            source $BASH_ENV
            if [ -z "$DEPLOY_ID" ]; then echo "⚠️ No deployment to poll"; exit 0; fi
            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"
            echo "📊 Polling deployment: $DEPLOY_ID"
            TIMEOUT_SECONDS=$((120 * 60))
            POLL_INTERVAL=30
            ELAPSED=0
            while [ $ELAPSED -lt $TIMEOUT_SECONDS ]; do
              REPORT_JSON=$(sf project deploy report --job-id "$DEPLOY_ID" --target-org target --json 2>&1)
              STATUS=$(echo "$REPORT_JSON"              | jq -r '.result.status // "Unknown"')
              DONE=$(echo "$REPORT_JSON"                | jq -r '.result.done // false')
              SUCCESS=$(echo "$REPORT_JSON"             | jq -r '.result.success // false')
              COMPONENTS_DEPLOYED=$(echo "$REPORT_JSON" | jq -r '.result.numberComponentsDeployed // 0')
              COMPONENTS_TOTAL=$(echo "$REPORT_JSON"    | jq -r '.result.numberComponentsTotal // 0')
              TESTS_COMPLETED=$(echo "$REPORT_JSON"     | jq -r '.result.numberTestsCompleted // 0')
              TESTS_TOTAL=$(echo "$REPORT_JSON"         | jq -r '.result.numberTestsTotal // 0')
              RUN_TESTS_ENABLED=$(echo "$REPORT_JSON"   | jq -r '.result.runTestsEnabled // false')
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "⏱️  Elapsed: $((ELAPSED / 60)) min | Status: $STATUS"
              echo "📦 Components: $COMPONENTS_DEPLOYED / $COMPONENTS_TOTAL"
              if [ "$RUN_TESTS_ENABLED" = "true" ] && [ "$COMPONENTS_DEPLOYED" -eq "$COMPONENTS_TOTAL" ] && [ "$COMPONENTS_TOTAL" -gt 0 ]; then
                echo "🧪 Tests: $TESTS_COMPLETED / $TESTS_TOTAL"
              fi
              if [ "$DONE" = "true" ]; then
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                if [ "$SUCCESS" = "true" ]; then
                  echo "✅ Deployment completed successfully!"
                  SUMMARY=":package: *Components:* ${COMPONENTS_DEPLOYED}/${COMPONENTS_TOTAL} deployed"
                  if [ "$TESTS_COMPLETED" -gt 0 ] 2>/dev/null; then
                    SUMMARY="${SUMMARY}\n:test_tube: *Tests run:* ${TESTS_COMPLETED}/${TESTS_TOTAL} passed"
                  fi
                  # Use declare -p for safe BASH_ENV export — handles all special chars
                  DEPLOY_SUMMARY="$SUMMARY"
                  declare -p DEPLOY_SUMMARY >> $BASH_ENV
                  exit 0
                fi
                echo "❌ Deployment failed!"; echo ""
                COMPONENT_FAILURES=$(echo "$REPORT_JSON" | jq -r '.result.details.componentFailures[]? | "  ❌ \(.fullName) (\(.componentType)): \(.problem)"' 2>/dev/null)
                [ -n "$COMPONENT_FAILURES" ] && { echo "🔴 COMPONENT ERRORS:"; echo "$COMPONENT_FAILURES"; echo ""; }
                TEST_FAILURES=$(echo "$REPORT_JSON" | jq -r '.result.details.runTestResult.failures[]? | "  ❌ \(.name).\(.methodName): \(.message)"' 2>/dev/null)
                [ -n "$TEST_FAILURES" ] && { echo "🔴 TEST FAILURES:"; echo "$TEST_FAILURES"; echo ""; }
                COVERAGE_WARNINGS=$(echo "$REPORT_JSON" | jq -r '.result.details.runTestResult.codeCoverageWarnings[]? | "  ⚠️  \(.name): \(.message)"' 2>/dev/null)
                [ -n "$COVERAGE_WARNINGS" ] && { echo "🔴 CODE COVERAGE:"; echo "$COVERAGE_WARNINGS"; echo ""; }
                TOTAL_FAILURES=$(echo "$REPORT_JSON"      | jq -r '.result.numberComponentErrors // 0')
                TOTAL_TEST_FAILURES=$(echo "$REPORT_JSON" | jq -r '.result.numberTestErrors // 0')
                echo "📊 SUMMARY: Component Errors=$TOTAL_FAILURES | Test Failures=$TOTAL_TEST_FAILURES"
                # Save clean failure JSON for git-blame-notify
                sf project deploy report \
                  --job-id "$DEPLOY_ID" \
                  --target-org target \
                  --json > /tmp/report_raw.json 2>/dev/null || true
                CF=$(jq '.result.details.componentFailures // []' /tmp/report_raw.json 2>/dev/null || echo '[]')
                echo "$CF" | jq -e 'type == "object"' > /dev/null 2>&1 && CF="[$CF]"
                TF=$(jq '(.result.details.runTestResult.failures // [])' /tmp/report_raw.json 2>/dev/null || echo '[]')
                echo "$TF" | jq -e 'type == "object"' > /dev/null 2>&1 && TF="[$TF]"
                jq -n --argjson cf "$CF" --argjson tf "$TF" \
                  '{"component_failures":$cf,"test_failures":$tf}' > /tmp/deploy_failures.json
                echo "📝 Saved $(jq '.component_failures|length' /tmp/deploy_failures.json) component failure(s)"
                exit 1
              fi
              sleep $POLL_INTERVAL
              ELAPSED=$((ELAPSED + POLL_INTERVAL))
            done
            echo "⏱️  Timeout after 120 minutes | Status: $STATUS"
            exit 1

      - run:
          name: Create & Push Tag
          command: |
            source $BASH_ENV
            OPERATION="<< parameters.operation >>"
            CREATE_TAGS="<< parameters.create_tags >>"
            TAG_PREFIX="<< parameters.tag_prefix >>"
            [ "$OPERATION" = "validate" ] && { echo "Validation run — no tag."; exit 0; }
            [ "$CREATE_TAGS" != "true" ]  && { echo "Tag creation disabled."; exit 0; }
            if [ "$CHANGES_FOUND" = "true" ] || [ "$FIRST_RUN" = "true" ]; then
              PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
              cd "$PROJECT_DIR"
              newTag="${TAG_PREFIX}$( [ "$FIRST_RUN" = "true" ] && echo 1 || echo $((CURRENT_REF + 1)) )"
              git config user.email "circleci@cargurus.com"
              git config user.name "CircleCI"
              git tag "$newTag"
              git push origin "$newTag"
              echo "✔️ Created tag: $newTag"
            else
              echo "No changes — skipping tag."
            fi

  # ----------------------------------------------------------
  # GIT BLAME NOTIFY
  # KEY FIX: Backticks in commit hashes were being interpreted
  # as bash command substitution when BASH_ENV was sourced,
  # causing "command not found" errors. Fix:
  #   1. No backticks in blame output — use (commit) instead
  #   2. Use declare -p for BASH_ENV export — bash-native
  #      serialisation that correctly escapes ALL special chars
  # ----------------------------------------------------------
  # ----------------------------------------------------------
  # GIT BLAME NOTIFY
  # Runs on_fail. Uses jq to safely build a full Slack Block
  # Kit JSON payload — one clean block per failed component.
  # Posts via curl with SLACK_ACCESS_TOKEN.
  # No string interpolation, no escaping issues.
  # ----------------------------------------------------------
  git-blame-notify:
    steps:
      - run:
          name: "🔍 Git Blame — Build Slack Failure Payload"
          when: on_fail
          command: |
            git fetch --unshallow 2>/dev/null || true
            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)

            BLOCKS_FILE="/tmp/blame_blocks.json"
            PAYLOAD_FILE="/tmp/slack_failure_payload.json"

            resolve_path() {
              local TYPE="$1" NAME="$2" OBJ FLD
              case "$TYPE" in
                ApexClass)                echo "${PROJECT_DIR}/force-app/main/default/classes/${NAME}.cls" ;;
                ApexTrigger)              echo "${PROJECT_DIR}/force-app/main/default/triggers/${NAME}.trigger" ;;
                LightningComponentBundle) echo "${PROJECT_DIR}/force-app/main/default/lwc/${NAME}/${NAME}.js" ;;
                AuraDefinitionBundle)     echo "${PROJECT_DIR}/force-app/main/default/aura/${NAME}/${NAME}.cmp" ;;
                Flow)                     echo "${PROJECT_DIR}/force-app/main/default/flows/${NAME}.flow-meta.xml" ;;
                PermissionSet)            echo "${PROJECT_DIR}/force-app/main/default/permissionsets/${NAME}.permissionset-meta.xml" ;;
                Profile)                  echo "${PROJECT_DIR}/force-app/main/default/profiles/${NAME}.profile-meta.xml" ;;
                CustomObject)             echo "${PROJECT_DIR}/force-app/main/default/objects/${NAME}/${NAME}.object-meta.xml" ;;
                CustomField)
                  OBJ=$(echo "$NAME" | cut -d'.' -f1); FLD=$(echo "$NAME" | cut -d'.' -f2)
                  echo "${PROJECT_DIR}/force-app/main/default/objects/${OBJ}/fields/${FLD}.field-meta.xml" ;;
                ValidationRule)
                  OBJ=$(echo "$NAME" | cut -d'.' -f1); FLD=$(echo "$NAME" | cut -d'.' -f2)
                  echo "${PROJECT_DIR}/force-app/main/default/objects/${OBJ}/validationRules/${FLD}.validationRule-meta.xml" ;;
                *)
                  find "${PROJECT_DIR}" -type f \( \
                    -name "${NAME}.cls" -o -name "${NAME}.trigger" -o -name "${NAME}.js" \
                  \) 2>/dev/null | head -1 ;;
              esac
            }

            run_git_blame() {
              local FILEPATH="$1"
              [ ! -f "$FILEPATH" ] && { echo "unknown|unknown|?"; return; }
              local OUT
              OUT=$(git log --follow -n 1 --format="%an|%ae|%h" -- "$FILEPATH" 2>/dev/null)
              if [ -n "$OUT" ]; then
                local EMAIL
                EMAIL=$(echo "$OUT" | cut -d'|' -f2)
                if echo "$EMAIL" | grep -q "noreply.github.com"; then
                  EMAIL=$(echo "$EMAIL" | sed 's/.*+//' | sed 's/@.*//')
                fi
                echo "$(echo "$OUT" | cut -d'|' -f1)|${EMAIL}|$(echo "$OUT" | cut -d'|' -f3)"
              else
                echo "unknown|unknown|?"
              fi
            }

            # Start with empty blocks array
            echo '[]' > "$BLOCKS_FILE"

            add_component_block() {
              local NAME="$1" CTYPE="$2" PROB="$3" LOCATION="$4" AUTHOR="$5" EMAIL="$6" COMMIT="$7"
              local ICON=":red_circle:"
              [ "$CTYPE" = "ApexClass" ] && ICON=":large_red_circle:"

              jq -n \
                --arg icon  "$ICON" \
                --arg name  "$NAME" \
                --arg ctype "$CTYPE" \
                --arg prob  "$PROB" \
                --arg loc   "$LOCATION" \
                --arg who   "$AUTHOR" \
                --arg email "$EMAIL" \
                --arg hash  "$COMMIT" \
                '[
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": (":red_circle: *" + $name + "*  `" + $ctype + "`")
                    }
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": ("_" + $prob + (if $loc != "" then "  " + $loc else "" end) + "_")
                    }
                  },
                  {
                    "type": "context",
                    "elements": [{
                      "type": "mrkdwn",
                      "text": (":bust_in_silhouette: *" + $who + "*  " + $email + "  \u2014  `" + $hash + "`")
                    }]
                  },
                  {"type": "divider"}
                ]' > /tmp/entry.json
              jq -s '.[0] + .[1]' "$BLOCKS_FILE" /tmp/entry.json > /tmp/blocks_tmp.json \
                && mv /tmp/blocks_tmp.json "$BLOCKS_FILE"
            }

            UNIQUE_NAMES=""
            SHOWN=0
            MAX_SHOWN=5
            SKIPPED=0

            if [ -f /tmp/deploy_failures.json ]; then
              COMP_COUNT=$(jq '.component_failures | length' /tmp/deploy_failures.json 2>/dev/null || echo 0)
              i=0
              while [ "$i" -lt "$COMP_COUNT" ]; do
                NAME=$(jq -r ".component_failures[$i].fullName // \"Unknown\""      /tmp/deploy_failures.json)
                if echo "$UNIQUE_NAMES" | grep -qF "||${NAME}||"; then
                  i=$((i+1)); SKIPPED=$((SKIPPED+1)); continue
                fi
                if [ "$SHOWN" -ge "$MAX_SHOWN" ]; then
                  i=$((i+1)); SKIPPED=$((SKIPPED+1)); continue
                fi
                UNIQUE_NAMES="${UNIQUE_NAMES}||${NAME}||"
                CTYPE=$(jq -r ".component_failures[$i].componentType // \"Unknown\"" /tmp/deploy_failures.json)
                PROB=$(jq -r  ".component_failures[$i].problem // \"\""              /tmp/deploy_failures.json | cut -c1-150)
                LINE_NO=$(jq -r ".component_failures[$i].lineNumber // \"\""         /tmp/deploy_failures.json)
                LOCATION=""
                [ -n "$LINE_NO" ] && [ "$LINE_NO" != "null" ] && LOCATION="(line ${LINE_NO})"
                FILEPATH=$(resolve_path "$CTYPE" "$NAME")
                BLAME=$(run_git_blame "$FILEPATH")
                AUTHOR=$(echo "$BLAME" | cut -d'|' -f1)
                EMAIL=$(echo  "$BLAME" | cut -d'|' -f2)
                COMMIT=$(echo "$BLAME" | cut -d'|' -f3)
                echo "  → $NAME ($CTYPE): $AUTHOR [$COMMIT]"
                add_component_block "$NAME" "$CTYPE" "$PROB" "$LOCATION" "$AUTHOR" "$EMAIL" "$COMMIT"
                SHOWN=$((SHOWN+1)); i=$((i+1))
              done

              TEST_COUNT=$(jq '.test_failures | length' /tmp/deploy_failures.json 2>/dev/null || echo 0)
              UNIQUE_TESTS=""
              i=0
              while [ "$i" -lt "$TEST_COUNT" ]; do
                NAME=$(jq -r   ".test_failures[$i].name // \"Unknown\""   /tmp/deploy_failures.json)
                METHOD=$(jq -r ".test_failures[$i].methodName // \"\""    /tmp/deploy_failures.json)
                LABEL="$NAME"
                [ -n "$METHOD" ] && LABEL="${NAME}.${METHOD}"
                if echo "$UNIQUE_TESTS" | grep -qF "||${LABEL}||"; then
                  i=$((i+1)); continue
                fi
                if [ "$SHOWN" -ge "$MAX_SHOWN" ]; then
                  i=$((i+1)); SKIPPED=$((SKIPPED+1)); continue
                fi
                UNIQUE_TESTS="${UNIQUE_TESTS}||${LABEL}||"
                PROB=$(jq -r  ".test_failures[$i].message // \"\""        /tmp/deploy_failures.json | cut -c1-150)
                STACK=$(jq -r ".test_failures[$i].stackTrace // \"\""     /tmp/deploy_failures.json | head -1 | cut -c1-100)
                [ -n "$STACK" ] && [ "$STACK" != "null" ] && PROB="${PROB}  ${STACK}"
                FILEPATH=$(resolve_path "ApexClass" "$NAME")
                BLAME=$(run_git_blame "$FILEPATH")
                AUTHOR=$(echo "$BLAME" | cut -d'|' -f1)
                EMAIL=$(echo  "$BLAME" | cut -d'|' -f2)
                COMMIT=$(echo "$BLAME" | cut -d'|' -f3)
                echo "  → $LABEL (Test): $AUTHOR [$COMMIT]"
                add_component_block "$LABEL" "Test" "$PROB" "" "$AUTHOR" "$EMAIL" "$COMMIT"
                SHOWN=$((SHOWN+1)); i=$((i+1))
              done

              if [ "$SKIPPED" -gt 0 ]; then
                jq -n --arg msg "...and ${SKIPPED} more. See the build log for full details." \
                  '[{"type":"context","elements":[{"type":"mrkdwn","text":$msg}]}]' \
                  > /tmp/entry.json
                jq -s '.[0] + .[1]' "$BLOCKS_FILE" /tmp/entry.json > /tmp/blocks_tmp.json \
                  && mv /tmp/blocks_tmp.json "$BLOCKS_FILE"
              fi

              if [ "$SHOWN" -eq 0 ]; then
                jq -n '[{"type":"section","text":{"type":"mrkdwn","text":"No component details found. Check the build log."}}]' \
                  > "$BLOCKS_FILE"
              fi
            else
              jq -n '[{"type":"section","text":{"type":"mrkdwn","text":"Pipeline failed before deployment. No component details available."}}]' \
                > "$BLOCKS_FILE"
            fi

            # Build payload in 4 simple jq steps — avoids the invalid
            # '] + $var + [' array-concat-inside-object syntax that
            # causes jq compile errors in multi-line shell commands.

            # Step 1: header blocks
            jq -n \
              --arg branch  "$CIRCLE_BRANCH" \
              --arg job     "$CIRCLE_JOB" \
              --arg user    "$CIRCLE_USERNAME" \
              --arg project "$CIRCLE_PROJECT_REPONAME" \
              '[{"type":"header","text":{"type":"plain_text","text":":rotating_light: Salesforce Deploy Failed","emoji":true}},{"type":"section","fields":[{"type":"mrkdwn","text":("*Branch:*\n`"+$branch+"`")},{"type":"mrkdwn","text":("*Job:*\n`"+$job+"`")},{"type":"mrkdwn","text":("*Triggered by:*\n`"+$user+"`")},{"type":"mrkdwn","text":("*Project:*\n`"+$project+"`")}]},{"type":"divider"},{"type":"section","text":{"type":"mrkdwn","text":"*:mag: Failed Components & Owners*"}}]' \
              > /tmp/header_blocks.json

            # Step 2: footer block
            jq -n --arg url "$CIRCLE_BUILD_URL" \
              '[{"type":"actions","elements":[{"type":"button","text":{"type":"plain_text","text":"View Build","emoji":true},"url":$url,"style":"danger"}]}]' \
              > /tmp/footer_blocks.json

            # Step 3: merge header + blame + footer into one blocks array
            ALL_BLOCKS=$(jq -s '.[0] + .[1] + .[2]' \
              /tmp/header_blocks.json "$BLOCKS_FILE" /tmp/footer_blocks.json)

            # Step 4: wrap in the final payload envelope
            jq -n \
              --arg     channel "$SLACK_DEFAULT_CHANNEL" \
              --argjson blocks  "$ALL_BLOCKS" \
              '{"channel":$channel,"blocks":$blocks}' > "$PAYLOAD_FILE"

            echo "✅ Slack payload built ($(wc -c < $PAYLOAD_FILE) bytes)"

  # ----------------------------------------------------------
  # SLACK NOTIFY — SUCCESS
  # ----------------------------------------------------------
  slack-notify-pass:
    steps:
      - slack/notify:
          event: pass
          channel: $SLACK_DEFAULT_CHANNEL
          custom: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": ":white_check_mark: Salesforce Deploy Succeeded", "emoji": true }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Branch:*\n`${CIRCLE_BRANCH}`" },
                    { "type": "mrkdwn", "text": "*Job:*\n`${CIRCLE_JOB}`" },
                    { "type": "mrkdwn", "text": "*Triggered by:*\n`${CIRCLE_USERNAME}`" },
                    { "type": "mrkdwn", "text": "*Project:*\n`${CIRCLE_PROJECT_REPONAME}`" }
                  ]
                },
                { "type": "divider" },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*:rocket: Deploy Summary*\n${DEPLOY_SUMMARY}" }
                },
                { "type": "divider" },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": ":link: View Build", "emoji": true },
                      "url": "${CIRCLE_BUILD_URL}",
                      "style": "primary"
                    }
                  ]
                }
              ]
            }

  # ----------------------------------------------------------
  # SLACK NOTIFY — FAILURE
  # Posts the pre-built JSON payload from git-blame-notify
  # via curl. Bypasses orb template interpolation entirely
  # so formatting is clean and controlled.
  # ----------------------------------------------------------
  slack-notify-fail:
    steps:
      - run:
          name: "Send Failure Notification to Slack"
          when: on_fail
          command: |
            if [ ! -f /tmp/slack_failure_payload.json ]; then
              echo "⚠️ No failure payload found — skipping"
              exit 0
            fi

            RESPONSE=$(curl -s -X POST \
              -H "Authorization: Bearer $SLACK_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data @/tmp/slack_failure_payload.json \
              https://slack.com/api/chat.postMessage)

            if echo "$RESPONSE" | jq -e '.ok' > /dev/null 2>&1; then
              echo "✅ Slack failure notification sent"
            else
              echo "❌ Slack error: $(echo "$RESPONSE" | jq -r '.error // "unknown"')"
              echo "$RESPONSE"
            fi

jobs:
  auto-deploy-intqa:
    parameters:
      tag_prefix:
        type: string
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      create_tags:
        type: boolean
        default: true
    resource_class: large
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - install-tooling
      - jwt-auth:
          target_env: INTQA
      - deploy-with-tags:
          tag_prefix: << parameters.tag_prefix >>
          target_env: INTQA
          operation: << parameters.operation >>
          create_tags: << parameters.create_tags >>
      - git-blame-notify
      - slack-notify-pass
      - slack-notify-fail

  auto-deploy-staging:
    parameters:
      tag_prefix:
        type: string
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      create_tags:
        type: boolean
        default: true
    resource_class: large
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - install-tooling
      - jwt-auth:
          target_env: STAGINGUAT
      - deploy-with-tags:
          tag_prefix: << parameters.tag_prefix >>
          target_env: STAGINGUAT
          operation: << parameters.operation >>
          create_tags: << parameters.create_tags >>
      - git-blame-notify
      - slack-notify-pass
      - slack-notify-fail

  intqa-full-sync:
    parameters:
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      test_level:
        type: enum
        enum: [RunLocalTests, RunAllTestsInOrg, NoTestRun, RunSpecifiedTests]
        default: RunLocalTests
    resource_class: large
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - install-tooling
      - jwt-auth:
          target_env: INTQA
      - run-full-sync:
          operation: << parameters.operation >>
          test_level: << parameters.test_level >>
      - run-batch-job:
          batch_job_name: Batch_Initiate_DataDictionary
          operation: << parameters.operation >>
      - git-blame-notify
      - slack-notify-pass
      - slack-notify-fail

  staginguat-full-sync:
    parameters:
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      test_level:
        type: enum
        enum: [RunLocalTests, RunAllTestsInOrg, NoTestRun, RunSpecifiedTests]
        default: RunLocalTests
    resource_class: large
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - install-tooling
      - jwt-auth:
          target_env: STAGINGUAT
      - run-full-sync:
          operation: << parameters.operation >>
          test_level: << parameters.test_level >>
      - git-blame-notify
      - slack-notify-pass
      - slack-notify-fail

  prod-full-sync:
    parameters:
      operation:
        type: enum
        enum: [deploy, validate]
        default: validate
    resource_class: large
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - install-tooling
      - jwt-auth:
          target_env: PROD
      - run-full-sync:
          operation: << parameters.operation >>
      - run-batch-job:
          batch_job_name: Batch_Initiate_DataDictionary
          operation: << parameters.operation >>
      - git-blame-notify
      - slack-notify-pass
      - slack-notify-fail

workflows:
  version: 2

  scheduled-IntQa-deploy:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ BRInt, << pipeline.git.branch >> ]
        - equal: [ deploy, << pipeline.parameters.action_type >> ]
    jobs:
      - intqa-full-sync:
          name: deploy-BRInt-full-sync
          context: sf-intqa
          operation: deploy
          test_level: << pipeline.parameters.test_level >>

  scheduled-StagingUat-deploy:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ BRStaging, << pipeline.git.branch >> ]
        - equal: [ deploy, << pipeline.parameters.action_type >> ]
    jobs:
      - staginguat-full-sync:
          name: deploy-BRStaging-full-sync
          context: sf-staging
          operation: deploy
          test_level: << pipeline.parameters.test_level >>

  scheduled-IntQa-validate:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ BRInt, << pipeline.git.branch >> ]
        - equal: [ validate, << pipeline.parameters.action_type >> ]
    jobs:
      - intqa-full-sync:
          name: validate-BRInt
          context: sf-intqa
