version: 2.1

orbs:
  node: circleci/node@5.0.2
  slack: circleci/slack@4.12.5

# ============================================================
# PIPELINE PARAMETER (single dropdown)
# ============================================================
parameters:
  action_type:
    type: enum
    enum:
      - validate
      - deploy
    default: validate
  test_level:                          
    type: enum
    enum:
      - RunLocalTests
      - RunAllTestsInOrg
      - NoTestRun
      - RunSpecifiedTests
    default: RunLocalTests

# ============================================================
# COMMANDS
# ============================================================
commands:
  # ----------------------------------------------------------
  # Install Tooling: Node + SF CLI
  # ----------------------------------------------------------
  install-tooling:
    steps:
      - node/install:
          node-version: "20"
      - run:
          name: Install SF CLI
          command: |
            npm install -g @salesforce/cli
            sf --version

  # ----------------------------------------------------------
  # Find Test Classes from GitHub Repository Coverage Map
  # ----------------------------------------------------------
  find-test-classes:
    parameters:
      target_env:
        type: string
    steps:
      - run:
          name: Download Coverage Map from Repository
          command: |
            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"
            
            echo "🔍 Downloading test coverage map from EA-Salesforce-Mappings repository for << parameters.target_env >>..."
            
            REPO_URL="${MAPPINGS_REPO_URL}"
            FILENAME="${COVERAGE_MAP_FILENAME}"
            
            if [ -z "$REPO_URL" ]; then
              echo "❌ Error: MAPPINGS_REPO_URL not set"
              exit 1
            fi
            
            if [ -z "$FILENAME" ]; then
              echo "❌ Error: COVERAGE_MAP_FILENAME not set"
              exit 1
            fi
            
            COVERAGE_URL="https://raw.githubusercontent.com/${REPO_URL}/main/JSON/${FILENAME}"
            echo "📍 Fetching from: $COVERAGE_URL"
            
            AUTH_HEADER=""
            if [ -n "$GITHUB_TEST_TOKEN" ]; then
              AUTH_HEADER="Authorization: token $GITHUB_TEST_TOKEN"
              echo "🔑 Using GITHUB_TEST_TOKEN for authentication"
            else
              echo "⚠️ No GITHUB_TEST_TOKEN set — will only work for public repos"
            fi
            
            if curl -f -s -H "$AUTH_HEADER" "$COVERAGE_URL" -o coverage-map.json 2>/dev/null; then
              if [ -f "coverage-map.json" ] && [ -s "coverage-map.json" ]; then
                echo "✅ Coverage map downloaded successfully"
                echo "📊 File size: $(wc -c < coverage-map.json) bytes"
                echo "export MAP_DOWNLOADED=true" >> $BASH_ENV
              else
                echo "❌ Failed to download coverage map - file is empty or missing"
                exit 1
              fi
            else
              echo "❌ Error downloading from repository - HTTP request failed"
              exit 1
            fi

      - run:
          name: Determine Required Test Classes
          command: |
            source $BASH_ENV
            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"
            
            if [ -f "files.txt" ]; then
              echo "🔍 Finding changed Apex classes..."
              changed_classes=$(cat files.txt | grep -E '^force-app/.*classes/.*\.cls$' | grep -v '.*-meta\.xml$' | sed 's/.*classes\///' | sed 's/\.cls$//' || true)
              
              if [ -n "$changed_classes" ]; then
                echo "📝 Changed Apex classes found:"
                echo "$changed_classes"
                echo "$changed_classes" > changed_classes.txt
                echo "export APEX_CLASSES_CHANGED=true" >> $BASH_ENV
              else
                echo "ℹ️ No Apex classes changed"
                echo "" > changed_classes.txt
                echo "export APEX_CLASSES_CHANGED=false" >> $BASH_ENV
              fi
            else
              echo "⚠️ files.txt not found"
              echo "" > changed_classes.txt
              echo "export APEX_CLASSES_CHANGED=false" >> $BASH_ENV
            fi
            
            test_classes=""
            
            if [ "$MAP_DOWNLOADED" = "true" ] && [ -f "coverage-map.json" ] && [ -s "changed_classes.txt" ]; then
              echo ""
              echo "🔍 PRONG 1: Looking up test classes in coverage map..."
              
              while IFS= read -r class_name; do
                if [ -z "$class_name" ]; then
                  continue
                fi
                class_name_only=$(echo "$class_name" | sed 's|.*/||' | xargs)
                mapped_tests=$(jq -r --arg classname "$class_name_only" '.coverage[$classname].Tests[]?' coverage-map.json 2>/dev/null || true)
                
                if [ -n "$mapped_tests" ]; then
                  echo "  ✓ Found test classes for $class_name:"
                  echo "$mapped_tests" | while read -r test; do echo "    - $test"; done
                  test_classes="$test_classes $mapped_tests"
                else
                  echo "  ⚠️ No coverage mapping found for $class_name"
                fi
              done < changed_classes.txt
            fi
            
            if [ -s "changed_classes.txt" ]; then
              echo ""
              echo "🔍 PRONG 2: Scanning for classes with 'test' in the name..."
              name_based_tests=$(cat changed_classes.txt | grep -i "test" | sed 's|.*/||' || true)
              if [ -n "$name_based_tests" ]; then
                echo "  ✓ Found test classes by name:"
                echo "$name_based_tests" | while read -r test; do echo "    - $test"; done
                test_classes="$test_classes $name_based_tests"
              else
                echo "  ℹ️ No test classes found by name"
              fi
            fi
            
            if [ -f "package.xml" ]; then
              echo ""
              echo "🔍 PRONG 3: Scanning package.xml for test classes..."
              package_tests=$(grep -oP '<members>\K[^<]+(?=</members>)' package.xml | grep -i "test" || true)
              if [ -n "$package_tests" ]; then
                echo "  ✓ Found test classes in package.xml:"
                echo "$package_tests" | while read -r test; do echo "    - $test"; done
                test_classes="$test_classes $package_tests"
              else
                echo "  ℹ️ No test classes found in package.xml"
              fi
            fi
            
            final_test_classes=$(echo "$test_classes" | tr ' ' '\n' | sort -u | tr '\n' ' ' | sed 's/^ *//;s/ *$//')
            
            echo ""
            echo "📋 Final test classes to run:"
            if [ -n "$final_test_classes" ]; then
              echo "$final_test_classes" | tr ' ' '\n' | while read -r test; do
                if [ -n "$test" ]; then echo "  - $test"; fi
              done
              echo "export TEST_CLASSES='$final_test_classes'" >> $BASH_ENV
            else
              echo "  ⚠️ No test classes found"
              echo "export TEST_CLASSES=''" >> $BASH_ENV
            fi
            
            rm -f coverage-map.json changed_classes.txt

  # ----------------------------------------------------------
  # JWT AUTH COMMAND
  # ----------------------------------------------------------
  jwt-auth:
    parameters:
      target_env:
        type: string
    steps:
      - run:
          name: Decode JWT key for << parameters.target_env >>
          command: |
            echo "${JWT_KEY_<< parameters.target_env >>}" | base64 -d > server.key 2>/dev/null \
              || echo "${JWT_KEY_<< parameters.target_env >>}" > server.key
            chmod 600 server.key

      - run:
          name: Authenticate to Salesforce (<< parameters.target_env >>)
          command: |
            sf org login jwt \
              --username "${SF_USERNAME_<< parameters.target_env >>}" \
              --jwt-key-file server.key \
              --client-id "${SF_CONSUMER_KEY_<< parameters.target_env >>}" \
              --instance-url "${SF_INSTANCEURL_<< parameters.target_env >>}" \
              --alias target \
              --set-default

  # ----------------------------------------------------------
  # DEPLOY/VALIDATE FULL-SYNC MANIFEST
  # ----------------------------------------------------------
  run-full-sync:
      parameters:
        operation:
          type: enum
          enum: [deploy, validate]
          default: deploy
        test_level:                     
          type: enum
          enum: [RunLocalTests, RunAllTestsInOrg, NoTestRun, RunSpecifiedTests]
          default: RunLocalTests
      steps:
        - run:
            name: Full Manifest
            command: |
              PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
              cd "$PROJECT_DIR"
              sf project generate manifest --source-dir force-app > /dev/null

        - run:
            name: Full Sync << parameters.operation >>
            command: |
              PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
              cd "$PROJECT_DIR"

              if [ "<< parameters.operation >>" = "validate" ]; then
                sf project deploy validate \
                  --manifest package.xml \
                  --target-org target \
                  --test-level << parameters.test_level >> \
                  --wait 360
              else
                sf project deploy start \
                  --manifest package.xml \
                  --target-org target \
                  --test-level << parameters.test_level >> \
                  --wait 360
              fi

  # ----------------------------------------------------------
  # RUN BATCH JOB
  # ----------------------------------------------------------
  run-batch-job:
    parameters:
      batch_job_name:
        type: string
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
    steps:
      - run:
          name: Run Batch Job << parameters.batch_job_name >>
          command: |
            if [ "<< parameters.operation >>" != "deploy" ]; then
              echo "Not a deploy run (operation=<< parameters.operation >>). Skipping batch."
              exit 0
            fi

            echo "🚀 Running << parameters.batch_job_name >> in PROD..."

            cat > run_batch.apex \<<'APEX'
            Database.executeBatch(new Batch_Initiate_DataDictionary());
            APEX

            sf apex run \
              --target-org target \
              --file run_batch.apex

  # ----------------------------------------------------------
  # DEPLOY/VALIDATE WITH TAGS + CANCEL ACTIVE DEPLOYS
  # ----------------------------------------------------------
  deploy-with-tags:
    parameters:
      tag_prefix:
        type: string
      target_env:
        type: string
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      create_tags:
        type: boolean
        default: true
    steps:
      - run:
          name: Cancel Existing Deploys (Safe Mode)
          command: |
            echo "🔍 Checking for active deployments by 'CircleCI User'"

            ACTIVE_DEPLOYS=$(sf data query --use-tooling-api --query \
            "SELECT Id, Status, CreatedDate, NumberComponentsDeployed, NumberComponentsTotal
             FROM DeployRequest
             WHERE Status IN ('Pending','PendingValidation','InProgress')
             AND CreatedBy.Name = 'CircleCI API'
             ORDER BY CreatedDate DESC" --json)

            echo "$ACTIVE_DEPLOYS" | jq .
            DEPLOY_IDS=$(echo "$ACTIVE_DEPLOYS" | jq -r '.result.records[].Id')

            if [ -z "$DEPLOY_IDS" ] || [ "$DEPLOY_IDS" = "null" ]; then
              echo "✅ No active deployments found."
            else
              echo "⚠️ Deployments found — attempting cancel..."
              for deployId in $DEPLOY_IDS; do
                echo "⛔ Canceling deployment: $deployId"
                CANCEL_OUTPUT=$(sf project deploy cancel --job-id "$deployId" 2>&1) || true
                echo "$CANCEL_OUTPUT"
              done
            fi
            true

      - run:
          name: Find Most Recent Tag
          command: |
            TAG_PREFIX="<< parameters.tag_prefix >>"
            echo "Using Tag Prefix: $TAG_PREFIX"
            git fetch --tags

            currentRef=0
            tags=$(git tag -l "${TAG_PREFIX}[0-9]*" | sort -V)

            if [ -n "$tags" ]; then
              echo "🔍 Tags found:"
              echo "$tags"
              for tag in $tags; do
                refNum=$(echo "$tag" | sed -E "s/${TAG_PREFIX}([0-9]+)/\1/")
                if [ "$refNum" -gt "$currentRef" ]; then
                  currentRef=$refNum
                fi
              done
              echo "Latest tag: ${TAG_PREFIX}${currentRef}"
            else
              echo "🔍 No tags found — FIRST RUN"
              currentRef=0
              echo "export FIRST_RUN=true" >> $BASH_ENV
            fi

            echo "export CURRENT_REF=$currentRef" >> $BASH_ENV

      - run:
          name: Build Manifest
          command: |
            source $BASH_ENV
            TAG_PREFIX="<< parameters.tag_prefix >>"

            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"

            echo "Comparing HEAD to tag: ${TAG_PREFIX}${CURRENT_REF}"

            git diff --diff-filter=ACMR --name-only "${TAG_PREFIX}${CURRENT_REF}" HEAD \
              | grep 'force-app/' \
              | sed -E 's#.*(force-app/.*)#\1#' > files.txt || true

            if [ -s files.txt ]; then
              echo "Changes detected:"
              cat files.txt
              mapfile -t manifest_paths < files.txt
              sf project generate manifest -p "${manifest_paths[@]}"
              echo "export CHANGES_FOUND=true" >> $BASH_ENV
            else
              echo "No changes since last tag - Manifest not required."
              echo "export CHANGES_FOUND=false" >> $BASH_ENV
            fi

      - find-test-classes:
          target_env: << parameters.target_env >>

      - run:
          name: Deploy Metadata
          command: |
            source $BASH_ENV

            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"

            echo "FIRST_RUN=$FIRST_RUN"
            echo "CHANGES_FOUND=$CHANGES_FOUND"
            echo "OPERATION=$OPERATION"
            echo "APEX_CLASSES_CHANGED=$APEX_CLASSES_CHANGED"
            echo "TEST_CLASSES=$TEST_CLASSES"

            if [ "$CHANGES_FOUND" = "true" ]; then
              echo "🔄 DELTA deploy"
              DEPLOY_TYPE="DELTA"
            else
              if [ "$FIRST_RUN" = "true" ]; then
                echo "🚀 FIRST RUN — FULL DEPLOY + TAG CREATION"
                DEPLOY_TYPE="FULL_FIRST_RUN"
              else
                echo "⚠️ No delta — FULL DEPLOY (NO TAG CREATION)"
                DEPLOY_TYPE="FULL_NO_TAG"
              fi
              sf project generate manifest --source-dir force-app > /dev/null
            fi
            
            source $BASH_ENV

            if [ "$CHANGES_FOUND" = "true" ]; then
              if [ "$APEX_CLASSES_CHANGED" = "true" ]; then
                if [ -z "$TEST_CLASSES" ]; then
                  echo "❌ ERROR: Apex classes were modified but no test classes were found"
                  echo "⚠️ Cannot deploy Apex changes without running tests"
                  exit 1
                else
                  echo "📋 Running deployment with specified test classes..."
                  echo "Test classes: $TEST_CLASSES"
                  
                  test_args=""
                  for test_class in $TEST_CLASSES; do
                    test_args="$test_args --tests $test_class"
                  done
                  
                  echo "Executing: sf project deploy start --manifest package.xml --target-org target --test-level RunSpecifiedTests$test_args --async"
                  
                  DEPLOY_OUTPUT=$(sf project deploy start \
                    --manifest package.xml \
                    --target-org target \
                    --test-level RunSpecifiedTests \
                    $test_args \
                    --async 2>&1)
                  
                  echo "$DEPLOY_OUTPUT"
                  
                  DEPLOY_ID=$(echo "$DEPLOY_OUTPUT" | grep -oP 'Deploy ID: \K[A-Za-z0-9]+' | head -n 1 | tr -d '\n\r')
                  
                  if [ -z "$DEPLOY_ID" ]; then
                    echo "❌ ERROR: Failed to extract Deploy ID from output"
                    exit 1
                  fi
                  
                  echo "📝 Deploy ID: $DEPLOY_ID"
                  echo "export DEPLOY_ID='$DEPLOY_ID'" >> $BASH_ENV
                fi
              else
                echo "ℹ️ No Apex classes changed - deploying with NoTestRun"
                echo "Executing: sf project deploy start --manifest package.xml --target-org target --test-level NoTestRun --async"
                
                DEPLOY_OUTPUT=$(sf project deploy start \
                  --manifest package.xml \
                  --target-org target \
                  --test-level NoTestRun \
                  --async 2>&1)
                
                echo "$DEPLOY_OUTPUT"
                
                DEPLOY_ID=$(echo "$DEPLOY_OUTPUT" | grep -oP 'Deploy ID: \K[A-Za-z0-9]+' | head -n 1 | tr -d '\n\r')
                
                if [ -z "$DEPLOY_ID" ]; then
                  echo "❌ ERROR: Failed to extract Deploy ID from output"
                  exit 1
                fi
                
                echo "📝 Deploy ID: $DEPLOY_ID"
                echo "export DEPLOY_ID='$DEPLOY_ID'" >> $BASH_ENV
              fi
            fi

      # --------------------------------------------------------
      # Poll Deployment Status
      # NOTE: One addition vs original — on failure, writes
      # /tmp/deploy_failures.json for git-blame-notify to read.
      # All original logic is otherwise unchanged.
      # --------------------------------------------------------
      - run:
          name: Poll Deployment Status
          command: |
            source $BASH_ENV
            
            if [ -z "$DEPLOY_ID" ]; then
              echo "⚠️ No deployment to poll (DEPLOY_ID not set)"
              exit 0
            fi
            
            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            if [ -z "$PROJECT_DIR" ]; then
              echo "❌ ERROR: Could not find sfdx-project.json"
              exit 1
            fi
            cd "$PROJECT_DIR"
            
            echo "📊 Polling deployment: $DEPLOY_ID"
            echo "⏱️  Timeout: 120 minutes"
            echo ""
            
            TIMEOUT_MINUTES=120
            TIMEOUT_SECONDS=$((TIMEOUT_MINUTES * 60))
            POLL_INTERVAL=30
            ELAPSED=0
            
            while [ $ELAPSED -lt $TIMEOUT_SECONDS ]; do
              REPORT_JSON=$(sf project deploy report --job-id "$DEPLOY_ID" --target-org target --json 2>&1)
              
              if [ $? -ne 0 ]; then
                echo "❌ Error getting deployment status:"
                echo "$REPORT_JSON"
                exit 1
              fi
              
              STATUS=$(echo "$REPORT_JSON" | jq -r '.result.status // "Unknown"')
              DONE=$(echo "$REPORT_JSON" | jq -r '.result.done // false')
              SUCCESS=$(echo "$REPORT_JSON" | jq -r '.result.success // false')
              COMPONENTS_DEPLOYED=$(echo "$REPORT_JSON" | jq -r '.result.numberComponentsDeployed // 0')
              COMPONENTS_TOTAL=$(echo "$REPORT_JSON" | jq -r '.result.numberComponentsTotal // 0')
              TESTS_COMPLETED=$(echo "$REPORT_JSON" | jq -r '.result.numberTestsCompleted // 0')
              TESTS_TOTAL=$(echo "$REPORT_JSON" | jq -r '.result.numberTestsTotal // 0')
              RUN_TESTS_ENABLED=$(echo "$REPORT_JSON" | jq -r '.result.runTestsEnabled // false')
              
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "⏱️  Elapsed: $((ELAPSED / 60)) min | Status: $STATUS"
              echo "📦 Components: $COMPONENTS_DEPLOYED / $COMPONENTS_TOTAL"
              
              if [ "$RUN_TESTS_ENABLED" = "true" ] && [ $COMPONENTS_DEPLOYED -eq $COMPONENTS_TOTAL ] && [ $COMPONENTS_TOTAL -gt 0 ]; then
                echo "🧪 Tests: $TESTS_COMPLETED / $TESTS_TOTAL"
              fi
              
              if [ "$DONE" = "true" ]; then
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                
                if [ "$SUCCESS" = "true" ]; then
                  echo "✅ Deployment completed successfully!"
                  exit 0
                else
                  echo "❌ Deployment failed!"
                  echo ""
                  
                  COMPONENT_FAILURES=$(echo "$REPORT_JSON" | jq -r '.result.details.componentFailures[]? | "  ❌ \(.fullName) (\(.componentType)): \(.problem)"' 2>/dev/null)
                  if [ -n "$COMPONENT_FAILURES" ]; then
                    echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                    echo "🔴 COMPONENT ERRORS:"
                    echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                    echo "$COMPONENT_FAILURES"
                    echo ""
                  fi
                  
                  TEST_FAILURES=$(echo "$REPORT_JSON" | jq -r '.result.details.runTestResult.failures[]? | "  ❌ \(.name).\(.methodName):\n     \(.message)\n     \(.stackTrace // "No stack trace")"' 2>/dev/null)
                  if [ -n "$TEST_FAILURES" ]; then
                    echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                    echo "🔴 TEST FAILURES:"
                    echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                    echo "$TEST_FAILURES"
                    echo ""
                  fi
                  
                  COVERAGE_WARNINGS=$(echo "$REPORT_JSON" | jq -r '.result.details.runTestResult.codeCoverageWarnings[]? | "  ⚠️  \(.name): \(.message)"' 2>/dev/null)
                  if [ -n "$COVERAGE_WARNINGS" ]; then
                    echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                    echo "🔴 CODE COVERAGE FAILURES:"
                    echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                    echo "$COVERAGE_WARNINGS"
                    echo ""
                  fi
                  
                  TOTAL_FAILURES=$(echo "$REPORT_JSON" | jq -r '.result.numberComponentErrors // 0')
                  TOTAL_TEST_FAILURES=$(echo "$REPORT_JSON" | jq -r '.result.numberTestErrors // 0')
                  
                  echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                  echo "📊 FAILURE SUMMARY:"
                  echo "   Component Errors: $TOTAL_FAILURES"
                  echo "   Test Failures: $TOTAL_TEST_FAILURES"
                  echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

                  # ── NEW: save clean failure JSON for git-blame-notify ──
                  # Uses a fresh sf call (no 2>&1) so Python gets valid JSON
                  sf project deploy report \
                    --job-id "$DEPLOY_ID" \
                    --target-org target \
                    --json > /tmp/report_raw.json 2>/dev/null || true

                  python3 \<<'PYEOF'
import json
try:
    with open("/tmp/report_raw.json") as f:
        r = json.load(f)
    d = r.get("result", {}).get("details", {})
    def lst(v):
        if not v: return []
        return v if isinstance(v, list) else [v]
    rt = d.get("runTestResult") or {}
    with open("/tmp/deploy_failures.json", "w") as f:
        json.dump({
            "component_failures": lst(d.get("componentFailures")),
            "test_failures":      lst(rt.get("failures")),
        }, f, indent=2)
    print("📝 Saved failure data for git blame")
except Exception as e:
    print(f"⚠️  Could not save failure data: {e}")
PYEOF
                  # ── END NEW ────────────────────────────────────────────

                  exit 1
                fi
              fi
              
              sleep $POLL_INTERVAL
              ELAPSED=$((ELAPSED + POLL_INTERVAL))
            done
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
