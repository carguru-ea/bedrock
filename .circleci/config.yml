version: 2.1

orbs:
  node: circleci/node@5.0.2
  slack: circleci/slack@4.12.5

# ============================================================
# PIPELINE PARAMETERS
# ============================================================
parameters:
  action_type:
    type: enum
    enum:
      - validate
      - deploy
    default: validate
  test_level:
    type: enum
    enum:
      - RunLocalTests
      - RunAllTestsInOrg
      - NoTestRun
      - RunSpecifiedTests
    default: RunLocalTests

# ============================================================
# COMMANDS
# ============================================================
commands:
  # ----------------------------------------------------------
  # Install Tooling: Node + SF CLI
  # ----------------------------------------------------------
  install-tooling:
    steps:
      - node/install:
          node-version: "20"
      - run:
          name: Install SF CLI
          command: |
            npm install -g @salesforce/cli
            sf --version

  # ----------------------------------------------------------
  # Find Test Classes from GitHub Repository Coverage Map
  # ----------------------------------------------------------
  find-test-classes:
    parameters:
      target_env:
        type: string
    steps:
      - run:
          name: Download Coverage Map from Repository
          command: |
            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"

            echo "🔍 Downloading test coverage map for << parameters.target_env >>..."

            REPO_URL="${MAPPINGS_REPO_URL}"
            FILENAME="${COVERAGE_MAP_FILENAME}"

            if [ -z "$REPO_URL" ]; then
              echo "❌ Error: MAPPINGS_REPO_URL not set"
              exit 1
            fi
            if [ -z "$FILENAME" ]; then
              echo "❌ Error: COVERAGE_MAP_FILENAME not set"
              exit 1
            fi

            COVERAGE_URL="https://raw.githubusercontent.com/${REPO_URL}/main/JSON/${FILENAME}"
            echo "📍 Fetching from: $COVERAGE_URL"

            AUTH_HEADER=""
            if [ -n "$GITHUB_TEST_TOKEN" ]; then
              AUTH_HEADER="Authorization: token $GITHUB_TEST_TOKEN"
              echo "🔑 Using GITHUB_TEST_TOKEN"
            else
              echo "⚠️ No GITHUB_TEST_TOKEN set"
            fi

            if curl -f -s -H "$AUTH_HEADER" "$COVERAGE_URL" -o coverage-map.json 2>/dev/null; then
              if [ -f "coverage-map.json" ] && [ -s "coverage-map.json" ]; then
                echo "✅ Coverage map downloaded ($(wc -c < coverage-map.json) bytes)"
                echo "export MAP_DOWNLOADED=true" >> $BASH_ENV
              else
                echo "❌ Coverage map empty or missing"
                exit 1
              fi
            else
              echo "❌ HTTP request failed"
              exit 1
            fi

      - run:
          name: Determine Required Test Classes
          command: |
            source $BASH_ENV
            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"

            if [ -f "files.txt" ]; then
              echo "🔍 Finding changed Apex classes..."
              changed_classes=$(cat files.txt | grep -E '^force-app/.*classes/.*\.cls$' | grep -v '.*-meta\.xml$' | sed 's/.*classes\///' | sed 's/\.cls$//' || true)
              if [ -n "$changed_classes" ]; then
                echo "📝 Changed Apex classes:"
                echo "$changed_classes"
                echo "$changed_classes" > changed_classes.txt
                echo "export APEX_CLASSES_CHANGED=true" >> $BASH_ENV
              else
                echo "ℹ️ No Apex classes changed"
                echo "" > changed_classes.txt
                echo "export APEX_CLASSES_CHANGED=false" >> $BASH_ENV
              fi
            else
              echo "⚠️ files.txt not found"
              echo "" > changed_classes.txt
              echo "export APEX_CLASSES_CHANGED=false" >> $BASH_ENV
            fi

            test_classes=""

            if [ "$MAP_DOWNLOADED" = "true" ] && [ -f "coverage-map.json" ] && [ -s "changed_classes.txt" ]; then
              echo ""
              echo "🔍 PRONG 1: Looking up test classes in coverage map..."
              while IFS= read -r class_name; do
                [ -z "$class_name" ] && continue
                class_name_only=$(echo "$class_name" | sed 's|.*/||' | xargs)
                mapped_tests=$(jq -r --arg cn "$class_name_only" '.coverage[$cn].Tests[]?' coverage-map.json 2>/dev/null || true)
                if [ -n "$mapped_tests" ]; then
                  echo "  ✓ Found tests for $class_name"
                  test_classes="$test_classes $mapped_tests"
                else
                  echo "  ⚠️ No mapping for $class_name"
                fi
              done < changed_classes.txt
            fi

            if [ -s "changed_classes.txt" ]; then
              echo ""
              echo "🔍 PRONG 2: Scanning for test-named classes..."
              name_based_tests=$(cat changed_classes.txt | grep -i "test" | sed 's|.*/||' || true)
              if [ -n "$name_based_tests" ]; then
                echo "  ✓ Found by name"
                test_classes="$test_classes $name_based_tests"
              fi
            fi

            if [ -f "package.xml" ]; then
              echo ""
              echo "🔍 PRONG 3: Scanning package.xml..."
              package_tests=$(grep -oP '<members>\K[^<]+(?=</members>)' package.xml | grep -i "test" || true)
              if [ -n "$package_tests" ]; then
                echo "  ✓ Found in package.xml"
                test_classes="$test_classes $package_tests"
              fi
            fi

            final_test_classes=$(echo "$test_classes" | tr ' ' '\n' | sort -u | tr '\n' ' ' | sed 's/^ *//;s/ *$//')

            echo ""
            echo "📋 Final test classes:"
            if [ -n "$final_test_classes" ]; then
              echo "$final_test_classes" | tr ' ' '\n' | while read -r t; do [ -n "$t" ] && echo "  - $t"; done
              echo "export TEST_CLASSES='$final_test_classes'" >> $BASH_ENV
            else
              echo "  ⚠️ None found"
              echo "export TEST_CLASSES=''" >> $BASH_ENV
            fi

            rm -f coverage-map.json changed_classes.txt

  # ----------------------------------------------------------
  # JWT AUTH COMMAND
  # ----------------------------------------------------------
  jwt-auth:
    parameters:
      target_env:
        type: string
    steps:
      - run:
          name: Decode JWT key for << parameters.target_env >>
          command: |
            echo "${JWT_KEY_<< parameters.target_env >>}" | base64 -d > server.key 2>/dev/null \
              || echo "${JWT_KEY_<< parameters.target_env >>}" > server.key
            chmod 600 server.key
      - run:
          name: Authenticate to Salesforce (<< parameters.target_env >>)
          command: |
            sf org login jwt \
              --username "${SF_USERNAME_<< parameters.target_env >>}" \
              --jwt-key-file server.key \
              --client-id "${SF_CONSUMER_KEY_<< parameters.target_env >>}" \
              --instance-url "${SF_INSTANCEURL_<< parameters.target_env >>}" \
              --alias target \
              --set-default

  # ----------------------------------------------------------
  # DEPLOY/VALIDATE FULL-SYNC MANIFEST
  # ----------------------------------------------------------
  run-full-sync:
    parameters:
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      test_level:
        type: enum
        enum: [RunLocalTests, RunAllTestsInOrg, NoTestRun, RunSpecifiedTests]
        default: RunLocalTests
    steps:
      - run:
          name: Full Manifest
          command: |
            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"
            sf project generate manifest --source-dir force-app > /dev/null
      - run:
          name: Full Sync << parameters.operation >>
          command: |
            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"
            if [ "<< parameters.operation >>" = "validate" ]; then
              sf project deploy validate \
                --manifest package.xml \
                --target-org target \
                --test-level << parameters.test_level >> \
                --wait 360
            else
              sf project deploy start \
                --manifest package.xml \
                --target-org target \
                --test-level << parameters.test_level >> \
                --wait 360
            fi

  # ----------------------------------------------------------
  # RUN BATCH JOB
  # ----------------------------------------------------------
  run-batch-job:
    parameters:
      batch_job_name:
        type: string
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
    steps:
      - run:
          name: Run Batch Job << parameters.batch_job_name >>
          command: |
            if [ "<< parameters.operation >>" != "deploy" ]; then
              echo "Not a deploy run — skipping batch."
              exit 0
            fi
            echo "🚀 Running << parameters.batch_job_name >>..."
            cat > run_batch.apex \<<'APEX'
            Database.executeBatch(new Batch_Initiate_DataDictionary());
            APEX
            sf apex run --target-org target --file run_batch.apex

  # ----------------------------------------------------------
  # DEPLOY/VALIDATE WITH TAGS + CANCEL ACTIVE DEPLOYS
  # ----------------------------------------------------------
  deploy-with-tags:
    parameters:
      tag_prefix:
        type: string
      target_env:
        type: string
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      create_tags:
        type: boolean
        default: true
    steps:
      - run:
          name: Cancel Existing Deploys (Safe Mode)
          command: |
            echo "🔍 Checking for active deployments..."
            ACTIVE_DEPLOYS=$(sf data query --use-tooling-api --query \
              "SELECT Id, Status, CreatedDate, NumberComponentsDeployed, NumberComponentsTotal
               FROM DeployRequest
               WHERE Status IN ('Pending','PendingValidation','InProgress')
               AND CreatedBy.Name = 'CircleCI API'
               ORDER BY CreatedDate DESC" --json)
            echo "$ACTIVE_DEPLOYS" | jq .
            DEPLOY_IDS=$(echo "$ACTIVE_DEPLOYS" | jq -r '.result.records[].Id')
            if [ -z "$DEPLOY_IDS" ] || [ "$DEPLOY_IDS" = "null" ]; then
              echo "✅ No active deployments found."
            else
              echo "⚠️ Canceling active deployments..."
              for deployId in $DEPLOY_IDS; do
                echo "⛔ Canceling: $deployId"
                sf project deploy cancel --job-id "$deployId" 2>&1 || true
              done
            fi
            true

      - run:
          name: Find Most Recent Tag
          command: |
            TAG_PREFIX="<< parameters.tag_prefix >>"
            echo "Using Tag Prefix: $TAG_PREFIX"
            git fetch --tags

            currentRef=0
            tags=$(git tag -l "${TAG_PREFIX}[0-9]*" | sort -V)

            if [ -n "$tags" ]; then
              echo "🔍 Tags found:"
              echo "$tags"
              for tag in $tags; do
                refNum=$(echo "$tag" | sed -E "s/${TAG_PREFIX}([0-9]+)/\1/")
                if [ "$refNum" -gt "$currentRef" ]; then currentRef=$refNum; fi
              done
              echo "Latest tag: ${TAG_PREFIX}${currentRef}"
            else
              echo "🔍 No tags found — FIRST RUN"
              currentRef=0
              echo "export FIRST_RUN=true" >> $BASH_ENV
            fi
            echo "export CURRENT_REF=$currentRef" >> $BASH_ENV

      - run:
          name: Build Manifest
          command: |
            source $BASH_ENV
            TAG_PREFIX="<< parameters.tag_prefix >>"
            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"

            echo "Comparing HEAD to tag: ${TAG_PREFIX}${CURRENT_REF}"
            git diff --diff-filter=ACMR --name-only "${TAG_PREFIX}${CURRENT_REF}" HEAD \
              | grep 'force-app/' \
              | sed -E 's#.*(force-app/.*)#\1#' > files.txt || true

            if [ -s files.txt ]; then
              echo "Changes detected:"
              cat files.txt
              mapfile -t manifest_paths < files.txt
              sf project generate manifest -p "${manifest_paths[@]}"
              echo "export CHANGES_FOUND=true" >> $BASH_ENV
            else
              echo "No changes since last tag."
              echo "export CHANGES_FOUND=false" >> $BASH_ENV
            fi

      - find-test-classes:
          target_env: << parameters.target_env >>

      - run:
          name: Deploy Metadata
          command: |
            source $BASH_ENV
            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"

            echo "FIRST_RUN=$FIRST_RUN"
            echo "CHANGES_FOUND=$CHANGES_FOUND"
            echo "APEX_CLASSES_CHANGED=$APEX_CLASSES_CHANGED"
            echo "TEST_CLASSES=$TEST_CLASSES"

            if [ "$CHANGES_FOUND" = "true" ]; then
              echo "🔄 DELTA deploy"
            else
              if [ "$FIRST_RUN" = "true" ]; then
                echo "🚀 FIRST RUN — FULL DEPLOY"
              else
                echo "⚠️ No delta — FULL DEPLOY (NO TAG CREATION)"
              fi
              sf project generate manifest --source-dir force-app > /dev/null
            fi

            source $BASH_ENV

            if [ "$CHANGES_FOUND" = "true" ]; then
              if [ "$APEX_CLASSES_CHANGED" = "true" ]; then
                if [ -z "$TEST_CLASSES" ]; then
                  echo "❌ ERROR: Apex classes modified but no test classes found"
                  exit 1
                fi
                test_args=""
                for test_class in $TEST_CLASSES; do
                  test_args="$test_args --tests $test_class"
                done
                DEPLOY_OUTPUT=$(sf project deploy start \
                  --manifest package.xml \
                  --target-org target \
                  --test-level RunSpecifiedTests \
                  $test_args \
                  --async 2>&1)
              else
                echo "ℹ️ No Apex classes changed — deploying with NoTestRun"
                DEPLOY_OUTPUT=$(sf project deploy start \
                  --manifest package.xml \
                  --target-org target \
                  --test-level NoTestRun \
                  --async 2>&1)
              fi

              echo "$DEPLOY_OUTPUT"
              DEPLOY_ID=$(echo "$DEPLOY_OUTPUT" | grep -oP 'Deploy ID: \K[A-Za-z0-9]+' | head -n 1 | tr -d '\n\r')

              if [ -z "$DEPLOY_ID" ]; then
                echo "❌ ERROR: Failed to extract Deploy ID"
                exit 1
              fi
              echo "📝 Deploy ID: $DEPLOY_ID"
              echo "export DEPLOY_ID='$DEPLOY_ID'" >> $BASH_ENV
            fi

      # --------------------------------------------------------
      # Poll Deployment Status
      # Change vs original: on failure, saves a clean
      # /tmp/deploy_failures.json for git-blame-notify.
      # All other logic is unchanged.
      # --------------------------------------------------------
      - run:
          name: Poll Deployment Status
          command: |
            source $BASH_ENV

            if [ -z "$DEPLOY_ID" ]; then
              echo "⚠️ No deployment to poll"
              exit 0
            fi

            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
            cd "$PROJECT_DIR"

            echo "📊 Polling deployment: $DEPLOY_ID"
            TIMEOUT_SECONDS=$((120 * 60))
            POLL_INTERVAL=30
            ELAPSED=0

            while [ $ELAPSED -lt $TIMEOUT_SECONDS ]; do
              REPORT_JSON=$(sf project deploy report --job-id "$DEPLOY_ID" --target-org target --json 2>&1)

              STATUS=$(echo "$REPORT_JSON"              | jq -r '.result.status // "Unknown"')
              DONE=$(echo "$REPORT_JSON"                | jq -r '.result.done // false')
              SUCCESS=$(echo "$REPORT_JSON"             | jq -r '.result.success // false')
              COMPONENTS_DEPLOYED=$(echo "$REPORT_JSON" | jq -r '.result.numberComponentsDeployed // 0')
              COMPONENTS_TOTAL=$(echo "$REPORT_JSON"    | jq -r '.result.numberComponentsTotal // 0')
              TESTS_COMPLETED=$(echo "$REPORT_JSON"     | jq -r '.result.numberTestsCompleted // 0')
              TESTS_TOTAL=$(echo "$REPORT_JSON"         | jq -r '.result.numberTestsTotal // 0')
              RUN_TESTS_ENABLED=$(echo "$REPORT_JSON"   | jq -r '.result.runTestsEnabled // false')

              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "⏱️  Elapsed: $((ELAPSED / 60)) min | Status: $STATUS"
              echo "📦 Components: $COMPONENTS_DEPLOYED / $COMPONENTS_TOTAL"
              if [ "$RUN_TESTS_ENABLED" = "true" ] && [ "$COMPONENTS_DEPLOYED" -eq "$COMPONENTS_TOTAL" ] && [ "$COMPONENTS_TOTAL" -gt 0 ]; then
                echo "🧪 Tests: $TESTS_COMPLETED / $TESTS_TOTAL"
              fi

              if [ "$DONE" = "true" ]; then
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

                if [ "$SUCCESS" = "true" ]; then
                  echo "✅ Deployment completed successfully!"
                  exit 0
                fi

                echo "❌ Deployment failed!"
                echo ""

                COMPONENT_FAILURES=$(echo "$REPORT_JSON" | jq -r '.result.details.componentFailures[]? | "  ❌ \(.fullName) (\(.componentType)): \(.problem)"' 2>/dev/null)
                [ -n "$COMPONENT_FAILURES" ] && { echo "🔴 COMPONENT ERRORS:"; echo "$COMPONENT_FAILURES"; echo ""; }

                TEST_FAILURES=$(echo "$REPORT_JSON" | jq -r '.result.details.runTestResult.failures[]? | "  ❌ \(.name).\(.methodName): \(.message)"' 2>/dev/null)
                [ -n "$TEST_FAILURES" ] && { echo "🔴 TEST FAILURES:"; echo "$TEST_FAILURES"; echo ""; }

                COVERAGE_WARNINGS=$(echo "$REPORT_JSON" | jq -r '.result.details.runTestResult.codeCoverageWarnings[]? | "  ⚠️  \(.name): \(.message)"' 2>/dev/null)
                [ -n "$COVERAGE_WARNINGS" ] && { echo "🔴 CODE COVERAGE:"; echo "$COVERAGE_WARNINGS"; echo ""; }

                TOTAL_FAILURES=$(echo "$REPORT_JSON"      | jq -r '.result.numberComponentErrors // 0')
                TOTAL_TEST_FAILURES=$(echo "$REPORT_JSON" | jq -r '.result.numberTestErrors // 0')
                echo "📊 SUMMARY: Component Errors=$TOTAL_FAILURES | Test Failures=$TOTAL_TEST_FAILURES"

                # ── Save clean failure JSON for git-blame-notify ──────
                # Fresh sf call with 2>/dev/null keeps JSON clean
                sf project deploy report \
                  --job-id "$DEPLOY_ID" \
                  --target-org target \
                  --json > /tmp/report_raw.json 2>/dev/null || true

                # Extract component + test failures using jq only (no Python)
                CF=$(jq '.result.details.componentFailures // []' /tmp/report_raw.json 2>/dev/null || echo '[]')
                # Normalise: single object → array
                echo "$CF" | jq -e 'type == "object"' > /dev/null 2>&1 && CF="[$CF]"

                TF=$(jq '(.result.details.runTestResult.failures // [])' /tmp/report_raw.json 2>/dev/null || echo '[]')
                echo "$TF" | jq -e 'type == "object"' > /dev/null 2>&1 && TF="[$TF]"

                jq -n \
                  --argjson cf "$CF" \
                  --argjson tf "$TF" \
                  '{"component_failures":$cf,"test_failures":$tf}' \
                  > /tmp/deploy_failures.json
                echo "📝 Saved $(jq '.component_failures|length' /tmp/deploy_failures.json) component failure(s) for git blame"
                # ── END save ─────────────────────────────────────────

                exit 1
              fi

              sleep $POLL_INTERVAL
              ELAPSED=$((ELAPSED + POLL_INTERVAL))
            done

            echo "⏱️  Timeout after 120 minutes | Status: $STATUS"
            exit 1

      - run:
          name: Create & Push Tag
          command: |
            source $BASH_ENV
            OPERATION="<< parameters.operation >>"
            CREATE_TAGS="<< parameters.create_tags >>"
            TAG_PREFIX="<< parameters.tag_prefix >>"

            [ "$OPERATION" = "validate" ] && { echo "Validation run — no tag."; exit 0; }
            [ "$CREATE_TAGS" != "true" ]  && { echo "Tag creation disabled."; exit 0; }

            if [ "$CHANGES_FOUND" = "true" ] || [ "$FIRST_RUN" = "true" ]; then
              PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)
              cd "$PROJECT_DIR"
              newTag="${TAG_PREFIX}$( [ "$FIRST_RUN" = "true" ] && echo 1 || echo $((CURRENT_REF + 1)) )"
              git config user.email "circleci@cargurus.com"
              git config user.name "CircleCI"
              git tag "$newTag"
              git push origin "$newTag"
              echo "✔️ Created tag: $newTag"
            else
              echo "No changes — skipping tag."
            fi

  # ----------------------------------------------------------
  # GIT BLAME NOTIFY
  # Runs when: on_fail. Reads /tmp/deploy_failures.json,
  # resolves each component to its repo file path, runs
  # git log to get the last author name/email/commit, and
  # exports BLAME_TEXT to $BASH_ENV for slack-notify-fail.
  # Pure bash + jq — no Python, no heredoc conflicts.
  # ----------------------------------------------------------
  git-blame-notify:
    steps:
      - run:
          name: "🔍 Git Blame — Collect Failed Component Owners"
          when: on_fail
          command: |
            git fetch --unshallow 2>/dev/null || true

            PROJECT_DIR=$(find . -name "sfdx-project.json" -exec dirname {} \; | head -n 1)

            if [ ! -f /tmp/deploy_failures.json ]; then
              echo "⚠️  No failure data — pipeline failed before deployment"
              printf 'export BLAME_TEXT=%q\n' "No component failure details captured." >> $BASH_ENV
              exit 0
            fi

            # Resolve Salesforce component type → repo file path
            resolve_path() {
              local TYPE="$1" NAME="$2"
              case "$TYPE" in
                ApexClass)                echo "${PROJECT_DIR}/force-app/main/default/classes/${NAME}.cls" ;;
                ApexTrigger)              echo "${PROJECT_DIR}/force-app/main/default/triggers/${NAME}.trigger" ;;
                LightningComponentBundle) echo "${PROJECT_DIR}/force-app/main/default/lwc/${NAME}/${NAME}.js" ;;
                AuraDefinitionBundle)     echo "${PROJECT_DIR}/force-app/main/default/aura/${NAME}/${NAME}.cmp" ;;
                Flow)                     echo "${PROJECT_DIR}/force-app/main/default/flows/${NAME}.flow-meta.xml" ;;
                PermissionSet)            echo "${PROJECT_DIR}/force-app/main/default/permissionsets/${NAME}.permissionset-meta.xml" ;;
                Profile)                  echo "${PROJECT_DIR}/force-app/main/default/profiles/${NAME}.profile-meta.xml" ;;
                *)
                  find "${PROJECT_DIR}" -type f \( \
                    -name "${NAME}.cls" -o -name "${NAME}.trigger" -o -name "${NAME}.js" \
                  \) 2>/dev/null | head -1 ;;
              esac
            }

            # Run git log on a file → "AuthorName|display_email|shortHash"
            run_git_blame() {
              local FILEPATH="$1"
              if [ ! -f "$FILEPATH" ]; then
                echo "unknown|unknown|?"
                return
              fi
              local OUT
              OUT=$(git log --follow -n 1 --format="%an|%ae|%h" -- "$FILEPATH" 2>/dev/null)
              if [ -n "$OUT" ]; then
                local EMAIL
                EMAIL=$(echo "$OUT" | cut -d'|' -f2)
                # Strip GitHub noreply → show just the username
                if echo "$EMAIL" | grep -q "noreply.github.com"; then
                  EMAIL=$(echo "$EMAIL" | sed 's/.*+//' | sed 's/@.*//')
                fi
                echo "$(echo "$OUT" | cut -d'|' -f1)|${EMAIL}|$(echo "$OUT" | cut -d'|' -f3)"
              else
                echo "unknown|unknown|?"
              fi
            }

            BLAME_LINES=""

            # Process component failures
            COMP_COUNT=$(jq '.component_failures | length' /tmp/deploy_failures.json 2>/dev/null || echo 0)
            i=0
            while [ "$i" -lt "$COMP_COUNT" ]; do
              CTYPE=$(jq -r ".component_failures[$i].componentType // \"Unknown\"" /tmp/deploy_failures.json)
              NAME=$(jq -r  ".component_failures[$i].fullName // \"Unknown\""      /tmp/deploy_failures.json)
              PROB=$(jq -r  ".component_failures[$i].problem // \"\""              /tmp/deploy_failures.json | cut -c1-150 | tr '"' "'")

              FILEPATH=$(resolve_path "$CTYPE" "$NAME")
              BLAME=$(run_git_blame "$FILEPATH")
              AUTHOR=$(echo "$BLAME" | cut -d'|' -f1)
              EMAIL=$(echo  "$BLAME" | cut -d'|' -f2)
              COMMIT=$(echo "$BLAME" | cut -d'|' -f3)

              echo "  → $NAME ($CTYPE): $AUTHOR <$EMAIL> [$COMMIT]"
              BLAME_LINES="${BLAME_LINES}:red_circle: *${NAME}* (${CTYPE})\n>_${PROB}_\n>Last changed by: *${AUTHOR}* (${EMAIL}) — \`${COMMIT}\`\n"
              i=$((i + 1))
            done

            # Process test failures
            TEST_COUNT=$(jq '.test_failures | length' /tmp/deploy_failures.json 2>/dev/null || echo 0)
            i=0
            while [ "$i" -lt "$TEST_COUNT" ]; do
              NAME=$(jq -r   ".test_failures[$i].name // \"Unknown\""      /tmp/deploy_failures.json)
              METHOD=$(jq -r ".test_failures[$i].methodName // \"\""       /tmp/deploy_failures.json)
              PROB=$(jq -r   ".test_failures[$i].message // \"\""          /tmp/deploy_failures.json | cut -c1-150 | tr '"' "'")

              FILEPATH=$(resolve_path "ApexClass" "$NAME")
              BLAME=$(run_git_blame "$FILEPATH")
              AUTHOR=$(echo "$BLAME" | cut -d'|' -f1)
              EMAIL=$(echo  "$BLAME" | cut -d'|' -f2)
              COMMIT=$(echo "$BLAME" | cut -d'|' -f3)

              LABEL="$NAME"
              [ -n "$METHOD" ] && LABEL="${NAME}.${METHOD}"
              echo "  → $LABEL (Test): $AUTHOR <$EMAIL> [$COMMIT]"
              BLAME_LINES="${BLAME_LINES}:test_tube: *${LABEL}* (Test)\n>_${PROB}_\n>Last changed by: *${AUTHOR}* (${EMAIL}) — \`${COMMIT}\`\n"
              i=$((i + 1))
            done

            [ -z "$BLAME_LINES" ] && BLAME_LINES="No component details found."

            printf 'export BLAME_TEXT=%q\n' "$BLAME_LINES" >> $BASH_ENV
            echo "✅ BLAME_TEXT exported"

  # ----------------------------------------------------------
  # SLACK NOTIFY — SUCCESS (single definition, used by all jobs)
  # ----------------------------------------------------------
  slack-notify-pass:
    steps:
      - slack/notify:
          event: pass
          channel: $SLACK_DEFAULT_CHANNEL
          custom: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": ":white_check_mark: Salesforce Deploy Succeeded", "emoji": true }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Branch:*\n`${CIRCLE_BRANCH}`" },
                    { "type": "mrkdwn", "text": "*Job:*\n`${CIRCLE_JOB}`" },
                    { "type": "mrkdwn", "text": "*Triggered by:*\n`${CIRCLE_USERNAME}`" },
                    { "type": "mrkdwn", "text": "*Project:*\n`${CIRCLE_PROJECT_REPONAME}`" }
                  ]
                },
                { "type": "divider" },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": ":link: View Build", "emoji": true },
                      "url": "${CIRCLE_BUILD_URL}",
                      "style": "primary"
                    }
                  ]
                }
              ]
            }

  # ----------------------------------------------------------
  # SLACK NOTIFY — FAILURE (single definition, used by all jobs)
  # BLAME_TEXT is populated by git-blame-notify above.
  # ----------------------------------------------------------
  slack-notify-fail:
    steps:
      - slack/notify:
          event: fail
          channel: $SLACK_DEFAULT_CHANNEL
          custom: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": ":rotating_light: Salesforce Deploy Failed", "emoji": true }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Branch:*\n`${CIRCLE_BRANCH}`" },
                    { "type": "mrkdwn", "text": "*Job:*\n`${CIRCLE_JOB}`" },
                    { "type": "mrkdwn", "text": "*Triggered by:*\n`${CIRCLE_USERNAME}`" },
                    { "type": "mrkdwn", "text": "*Project:*\n`${CIRCLE_PROJECT_REPONAME}`" }
                  ]
                },
                { "type": "divider" },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": "*:mag: Failed Components \u0026 Owners:*\n${BLAME_TEXT}" }
                },
                { "type": "divider" },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": ":link: View Build", "emoji": true },
                      "url": "${CIRCLE_BUILD_URL}",
                      "style": "danger"
                    }
                  ]
                }
              ]
            }

# ============================================================
# JOBS
# ============================================================
jobs:
  # ----------------------------------------------------------
  # INTQA AUTO DEPLOY — PR merge to BRInt
  # ----------------------------------------------------------
  auto-deploy-intqa:
    parameters:
      tag_prefix:
        type: string
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      create_tags:
        type: boolean
        default: true
    resource_class: xlarge
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - install-tooling
      - jwt-auth:
          target_env: INTQA
      - deploy-with-tags:
          tag_prefix: << parameters.tag_prefix >>
          target_env: INTQA
          operation: << parameters.operation >>
          create_tags: << parameters.create_tags >>
      - git-blame-notify
      - slack-notify-pass
      - slack-notify-fail

  # ----------------------------------------------------------
  # STAGINGUAT AUTO DEPLOY — PR merge to BRStaging
  # ----------------------------------------------------------
  auto-deploy-staging:
    parameters:
      tag_prefix:
        type: string
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      create_tags:
        type: boolean
        default: true
    resource_class: xlarge
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - install-tooling
      - jwt-auth:
          target_env: STAGINGUAT
      - deploy-with-tags:
          tag_prefix: << parameters.tag_prefix >>
          target_env: STAGINGUAT
          operation: << parameters.operation >>
          create_tags: << parameters.create_tags >>
      - git-blame-notify
      - slack-notify-pass
      - slack-notify-fail

  # ----------------------------------------------------------
  # INTQA FULL SYNC — Manual/API
  # ----------------------------------------------------------
  intqa-full-sync:
    parameters:
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      test_level:
        type: enum
        enum: [RunLocalTests, RunAllTestsInOrg, NoTestRun, RunSpecifiedTests]
        default: RunLocalTests
    resource_class: xlarge
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - install-tooling
      - jwt-auth:
          target_env: INTQA
      - run-full-sync:
          operation: << parameters.operation >>
          test_level: << parameters.test_level >>
      - run-batch-job:
          batch_job_name: Batch_Initiate_DataDictionary
          operation: << parameters.operation >>
      - git-blame-notify
      - slack-notify-pass
      - slack-notify-fail

  # ----------------------------------------------------------
  # STAGINGUAT FULL SYNC — Manual/API
  # ----------------------------------------------------------
  staginguat-full-sync:
    parameters:
      operation:
        type: enum
        enum: [deploy, validate]
        default: deploy
      test_level:
        type: enum
        enum: [RunLocalTests, RunAllTestsInOrg, NoTestRun, RunSpecifiedTests]
        default: RunLocalTests
    resource_class: xlarge
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - install-tooling
      - jwt-auth:
          target_env: STAGINGUAT
      - run-full-sync:
          operation: << parameters.operation >>
          test_level: << parameters.test_level >>
      - git-blame-notify
      - slack-notify-pass
      - slack-notify-fail

  # ----------------------------------------------------------
  # PRODUCTION FULL SYNC — Manual/API
  # ----------------------------------------------------------
  prod-full-sync:
    parameters:
      operation:
        type: enum
        enum: [deploy, validate]
        default: validate
    resource_class: xlarge
    docker:
      - image: cimg/node:20.10
    steps:
      - checkout
      - install-tooling
      - jwt-auth:
          target_env: PROD
      - run-full-sync:
          operation: << parameters.operation >>
      - run-batch-job:
          batch_job_name: Batch_Initiate_DataDictionary
          operation: << parameters.operation >>
      - git-blame-notify
      - slack-notify-pass
      - slack-notify-fail

# ============================================================
# WORKFLOWS
# ============================================================
workflows:
  version: 2

  scheduled-IntQa-deploy:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ BRInt, << pipeline.git.branch >> ]
        - equal: [ deploy, << pipeline.parameters.action_type >> ]
    jobs:
      - intqa-full-sync:
          name: deploy-BRInt-full-sync
          context: sf-intqa
          operation: deploy
          test_level: << pipeline.parameters.test_level >>

  scheduled-StagingUat-deploy:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ BRStaging, << pipeline.git.branch >> ]
        - equal: [ deploy, << pipeline.parameters.action_type >> ]
    jobs:
      - staginguat-full-sync:
          name: deploy-BRStaging-full-sync
          context: sf-staging
          operation: deploy
          test_level: << pipeline.parameters.test_level >>

  scheduled-IntQa-validate:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ BRInt, << pipeline.git.branch >> ]
        - equal: [ validate, << pipeline.parameters.action_type >> ]
    jobs:
      - intqa-full-sync:
          name: validate-BRInt
          context: sf-intqa
          operation: validate
          test_level: << pipeline.parameters.test_level >>

  scheduled-StagingUat-validate:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ BRStaging, << pipeline.git.branch >> ]
        - equal: [ validate, << pipeline.parameters.action_type >> ]
    jobs:
      - staginguat-full-sync:
          name: validate-BRStaging
          context: sf-staging
          operation: validate
          test_level: << pipeline.parameters.test_level >>

  scheduled-Prod-validate:
    when:
      and:
        - equal: [ scheduled_pipeline, << pipeline.trigger_source >> ]
        - equal: [ main, << pipeline.git.branch >> ]
        - equal: [ validate, << pipeline.parameters.action_type >> ]
    jobs:
      - prod-full-sync:
          name: validate-main
          context: sf-prod
          operation: validate

  Auto-IntQa-Deploy:
    when:
      and:
        - equal: [ webhook, << pipeline.trigger_source >> ]
        - equal: [ BRInt , << pipeline.git.branch >> ]
    jobs:
      - auto-deploy-intqa:
          name: auto-deploy-BRInt
          context: sf-intqa
          tag_prefix: "INTQA-"
          operation: deploy
          create_tags: true

  Auto-StagingUat-Deploy:
    when:
      and:
        - equal: [ webhook, << pipeline.trigger_source >> ]
        - equal: [ BRStaging, << pipeline.git.branch >> ]
    jobs:
      - auto-deploy-staging:
          name: auto-deploy-BRStaging
          context: sf-staging
          tag_prefix: "STAGINGUAT-"
          operation: deploy
          create_tags: true

  Manual-IntQa-Deploy:
    when:
      and:
        - equal: [ api, << pipeline.trigger_source >> ]
        - equal: [ BRInt, << pipeline.git.branch >> ]
        - equal: [ deploy, << pipeline.parameters.action_type >> ]
    jobs:
      - intqa-full-sync:
          name: deploy-BRInt-full-sync
          context: sf-intqa
          operation: deploy
          test_level: << pipeline.parameters.test_level >>

  Manual-IntQa-Validate:
    when:
      and:
        - equal: [ api, << pipeline.trigger_source >> ]
        - equal: [ BRInt, << pipeline.git.branch >> ]
        - equal: [ validate, << pipeline.parameters.action_type >> ]
    jobs:
      - intqa-full-sync:
          name: validate-BRInt
          context: sf-intqa
          operation: validate
          test_level: << pipeline.parameters.test_level >>

  Manual-StagingUat-Deploy:
    when:
      and:
        - equal: [ api, << pipeline.trigger_source >> ]
        - equal: [ BRStaging, << pipeline.git.branch >> ]
        - equal: [ deploy, << pipeline.parameters.action_type >> ]
    jobs:
      - staginguat-full-sync:
          name: deploy-BRStaging-full-sync
          context: sf-staging
          operation: deploy
          test_level: << pipeline.parameters.test_level >>

  Manual-StagingUat-Validate:
    when:
      and:
        - equal: [ api, << pipeline.trigger_source >> ]
        - equal: [ BRStaging, << pipeline.git.branch >> ]
        - equal: [ validate, << pipeline.parameters.action_type >> ]
    jobs:
      - staginguat-full-sync:
          name: validate-BRStaging
          context: sf-staging
          operation: validate
          test_level: << pipeline.parameters.test_level >>

  Manual-Prod-Deploy:
    when:
      and:
        - equal: [ api, << pipeline.trigger_source >> ]
        - equal: [ main, << pipeline.git.branch >> ]
        - equal: [ deploy, << pipeline.parameters.action_type >> ]
    jobs:
      - prod-full-sync:
          name: deploy-main-full-sync
          context: sf-prod
          operation: deploy

  Manual-Prod-Validate:
    when:
      and:
        - equal: [ api, << pipeline.trigger_source >> ]
        - equal: [ main, << pipeline.git.branch >> ]
        - equal: [ validate, << pipeline.parameters.action_type >> ]
    jobs:
      - prod-full-sync:
          name: validate-main
          context: sf-prod
          operation: validate
